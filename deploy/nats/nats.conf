# NATS for voice: a caller's request body is at most 12 MiB (openapi.yaml),
# and wrapped for a node in `serve` it must fit one message: the node
# protocol's 16 MiB.
max_payload: 16MB
http_port: 8222

# JetStream, for queue routing's work stream (spec/internal.yaml,
# `WorkStream`; docs/design/queue-routing.md), which the brain keeps and
# nothing publishes to yet. Its store is compose's `nats` volume. Tickets are under 1 KiB and carry no
# content, at most 1024 waiting per queue, each gone within 10 minutes:
# file storage far below 1 GiB, and none in memory but JetStream's own,
# within the container's 256 MiB.
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 32MB
  max_file_store: 1GB
}
