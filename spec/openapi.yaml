                $ref: '#/components/schemas/Node'
        '202':
          $ref: '#/components/responses/PendingReview'
        '400':
          $ref: '#/components/responses/Malformed'
        '422':
          $ref: '#/components/responses/AdminInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [nodes]
      operationId: revokeNode
      summary: Revoke a node
      description: |
        Its connection is closed and its token no longer admits it; its seats
        stop serving. In-flight requests on it fail over like any seat
        failure. The id is never reused.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The revoked node.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '202':
          $ref: '#/components/responses/PendingReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/v1/nodes/{node}/seats:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [nodes]
      operationId: listSeats
      summary: List a node's seats
      security:
        - operatorToken: []
      responses:
        '200':
          description: The node's seats, each with its state.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SeatView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [nodes]
      operationId: createSeat
      summary: Add a seat to a node
      description: |
        The seat names one of the engines the node declared, and its `config`
        must be valid against that engine's `config_schema`. A node that has
        not connected yet has declared nothing; the seat is accepted and
        reported with a problem until the node connects and takes it or
        refuses it. The seat reaches the node as a new assignment.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './protocol.yaml#/components/schemas/Seat'
            examples:
              static:
                value:
                  id: static
                  engine: static
                  account: static
                  serves:
                    - model: echo-1
                  data_classes: [public, internal]
                  concurrency: 4
                  config:
                    text: hello from voice
                    chunk_chars: 8
      responses:
        '201':
          description: The seat, created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatView'
        '202':
          $ref: '#/components/responses/PendingReview'
        '400':
          $ref: '#/components/responses/Malformed'
        '422':
          $ref: '#/components/responses/AdminInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '409':
          $ref: '#/components/responses/AdminConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/v1/nodes/{node}/seats/{seat}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/SeatId'
    get:
      tags: [nodes]
      operationId: getSeat
      summary: Describe a seat and its state
      security:
        - operatorToken: []
      responses:
        '200':
          description: The seat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [nodes]
      operationId: updateSeat
      summary: Change a seat
      description: |
        Only the fields present change; `id` cannot. In-flight requests finish
        on the configuration they started with. `enabled: false` drains the
        seat: it takes no new requests.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatUpdate'
      responses:
        '200':
          description: The seat, changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatView'
        '202':
          $ref: '#/components/responses/PendingReview'
        '400':
          $ref: '#/components/responses/Malformed'
        '422':
          $ref: '#/components/responses/AdminInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [nodes]
      operationId: removeSeat
      summary: Remove a seat from a node
      description: It takes no new requests; in-flight requests finish. Usage history keeps its name.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The removed seat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatView'
        '202':
          $ref: '#/components/responses/PendingReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/v1/nodes/{node}/suggestions:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [nodes]
      operationId: suggestNodeModels
      summary: What voice would place on a node, a model per category
      description: |
        For each category voice ships (`general`, `coding`, `reasoning`,
        `decide`), the model voice suggests placing on this node.
        Suggestions come from voice's default catalog: for each platform,
        memory tier and category, the recipe that suits a machine of that
        tier (`catalog/picks.json`, from the catalog simulation).
        The node's tier is the largest it has the memory of, within a tenth,
        since a machine reports a little less than it is sold as. A category's
        suggestion is the first pick, from that tier down, that is already
        placed there, or that the operator has (shipped or allowed) and that
        fits what the node has left for models after its other placements.
        The variant and runtime are the ones `createPlacement` would choose.
        A category with no suggestion says why.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The node's platform and tier, and a suggestion per category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeSuggestions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/v1/nodes/{node}/token:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [nodes]
      operationId: rotateNodeToken
      summary: Issue a node a new enrollment token
      description: |
        For a lost or leaked token. The old token stops admitting the node at
        once, and a connection made with it is closed with `4003`. The node
        connects again once it is restarted with the new token, which is
        returned once, in this response only.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The node, with its new token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeWithToken'
        '202':
          $ref: '#/components/responses/PendingReview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '409':
          description: The node is revoked; a revoked node gets no token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminConflict' }
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/v1/events:
    get:
      tags: [events]
      operationId: streamAdminEvents
      summary: Follow changes as they happen
      description: |
        A server-sent event stream for the admin UI, so it need not poll.
        Each event carries the whole resource as it now is, the same shape
        its `GET` returns: a node that connected or changed state, a seat
        whose state changed, an account whose quota windows moved, a usage
        record as each request settles, a configuration change as it is
        applied.

        Each event has an `id`. A client that reconnects sends the last one
        in `Last-Event-ID` and receives what it missed, while the coordinator
        still holds it; otherwise it receives a `reset` event and should
        reread what it shows. A comment line (`: ping`) keeps an idle stream
        open every 15 seconds. The stream never ends on its own.
      security:
        - operatorToken: []
      parameters:
        - name: type
          in: query
          description: Only these event types. Repeatable.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [node, seat, account, usage, change, request]
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 'The event stream: each event is `id:`, `event:` (its type) and `data:` (an `AdminEvent`).'
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AdminEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/v1/routes:
    get:
      tags: [routes]
      operationId: getRoutes
      summary: The route table, as the brain last wrote it
      description: |
        The latest table the brain wrote to Postgres: per model, the seats
        that can serve it ranked best first with the capacity they had,
        and the accounts that are exhausted. A snapshot at the moment of
        the call, not a stream; it is what explains where the next request
        would go. It is read from the store, so it answers at once.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The route table.
          content:
            application/json:
              schema:
                $ref: './internal.yaml#/components/schemas/RouteTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'No table yet: no brain has written one. `code` is `route_table_unavailable`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/v1/hub:
    get:
      tags: [routes]
      operationId: getHub
      summary: Where the fleet's heartbeats stream live
      description: |
        The api's hub: a WebSocket on a port of the api's own (until it can
        share this one, hale-lang/hale#1818), on the host this api is reached
        at. A client connects to `ws://<host>:<port>/` with the operator
        token (`Authorization: Bearer`, or `?access_token=` from a browser)
        and sends `{"type": "subscribe", "topic": "<topic>"}` for each topic.
        Each `{"type": "event", "topic", "seq", "payload"}` that follows is
        one report as it arrives; a gap in `seq` is reports shed for a slow
        subscriber, and the next report says the node whole again.

        - `NodeObserved`: a node made a report (`register`, `heartbeat`,
          `seats`, `capabilities`, `local`) and it was recorded. `payload`
          is `{node, report, at, body}`; `body` is the node as
          `GET /admin/v1/nodes/{node}` answers it, as a JSON string.
        - `InstanceBeat`: an api instance is alive. `payload` is
          `{instance, at}`, every five seconds per instance.

        The store keeps only each one's latest (what the other reads
        answer); the hub carries each as it happens.
      security:
        - operatorToken: []
      responses:
        '200':
          description: The hub.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hub'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /node/v1/register:
    post:
      tags: [node]
      operationId: registerNode
      summary: A node registers on start
      description: |
        The node presents its capabilities and local controls, and gets the
        heartbeat interval, where NATS is, and its current assignment. One
        live node per id: registering again replaces the earlier
        registration, so a restarted node takes over from its own ghost. A
        node whose token was rotated or revoked is refused.
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './protocol.yaml#/components/schemas/Registration'
      responses:
        '200':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: './protocol.yaml#/components/schemas/Registered'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NodeRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /node/v1/assignment:
    get:
      tags: [node]
      operationId: getAssignment
      summary: The node's current assignment
      security:
        - enrollmentToken: []
      responses:
        '200':
          description: The whole desired state, at its current version.
          content:
            application/json:
              schema:
                $ref: './protocol.yaml#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NodeRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /node/v1/heartbeat:
    post:
      tags: [node]
      operationId: nodeHeartbeat
      summary: The node is alive, and how its seats are
      description: Every `heartbeat_interval_ms`. Three missed intervals mark the node down.
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './protocol.yaml#/components/schemas/Heartbeat'
      responses:
        '204':
          description: Received.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NodeRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /node/v1/seats:
    post:
      tags: [node]
      operationId: reportSeatStates
      summary: Every assigned seat's state, for an assignment version
      description: Sent after applying an assignment and whenever a seat's state changes.
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './protocol.yaml#/components/schemas/SeatStates'
      responses:
        '204':
          description: Received.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NodeRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /node/v1/capabilities:
    put:
      tags: [node]
      operationId: reportCapabilities
      summary: What the node offers changed
      description: The coordinator re-checks the node's assignment against the new capabilities.
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './protocol.yaml#/components/schemas/Capabilities'
      responses:
        '204':
          description: Received.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NodeRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /node/v1/local:
    put:
      tags: [node]
      operationId: reportLocalControls
      summary: The node's local controls changed
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './protocol.yaml#/components/schemas/LocalControls'
      responses:
        '204':
          description: Received.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NodeRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /node/v1/quota:
    post:
      tags: [node]
      operationId: reportQuota
      summary: Provider windows an engine reported for a seat's account
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './protocol.yaml#/components/schemas/QuotaReport'
      responses:
        '204':
          description: Received.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NodeRevoked'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /node/v1/draining:
    post:
      tags: [node]
      operationId: nodeDraining
      summary: The node is about to stop
      description: The coordinator sends it no new requests; the node exits once its in-flight requests have their results.
      security:
        - enrollmentToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: './protocol.yaml#/components/schemas/Draining'
      responses:
        '204':
          description: Received.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/NodeRevoked'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/v1/changes:
    get:
      tags: [changes]
      operationId: listChanges
      summary: List configuration changes
      description: |
        Every applied admin write, newest first: who made it, when, and the
        resource before and after. Secrets, digests and tokens are never
        included. Usage is not configuration and is not listed here. A
        `cursor` is a page's `next_cursor`; one that names no change, a
        `from` or `to` that is not an RFC 3339 time, or a `limit` outside 1
        to 1000 is a `400`.
      security:
        - operatorToken: []
      parameters:
        - name: target
          in: query
          description: Only changes to resources under this path, e.g. `projects/work` or `nodes`.
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of changes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Change'
                  next_cursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/Malformed'
        '422':
          $ref: '#/components/responses/AdminInvalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    projectKey:
      type: http
      scheme: bearer
      description: "A project key, presented as `Authorization: Bearer vk-...`; or, from an organism of voice's habitat, the key the habitat drew for it, which voice makes a project of its own, `tenant-<organism>`, a child of the habitat's project, `habitat-<name>`, that inherits its accounts."
    enrollmentToken:
      type: http
      scheme: bearer
      description: "A node's enrollment token, presented as `Authorization: Bearer vn-...` on the node plane."
    operatorToken:
      type: http
      scheme: bearer
      description: "The operator token, presented as `Authorization: Bearer va-...` on the admin plane. The api mints it on its first start and keeps it in its store; `voice-api admin-token` prints it."

  parameters:
    ModelId:
      name: model
      in: path
      required: true
      schema: { type: string }
    ProjectId:
      name: project
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectIdValue' }
    KeyId:
      name: key
      in: path
      required: true
      schema: { type: string }
    AccountId:
      name: account
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AccountIdValue' }
    RecipeId:
      name: recipe
      in: path
      required: true
      schema: { type: string }
    RuntimeId:
      name: runtime
      in: path
      required: true
      schema: { type: string }
    PlacementId:
      name: placement
      in: path
      required: true
      schema: { type: string }
    NodeId:
      name: node
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NodeIdValue' }
    SeatId:
      name: seat
      in: path
      required: true
      schema: { $ref: './protocol.yaml#/components/schemas/Slug' }
    AccountFilter:
      name: account
      in: query
      description: Only requests served on these accounts. Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    ProjectFilter:
      name: project
      in: query
      description: Only these projects. Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    KeyFilter:
      name: key
      in: query
      description: Only these keys. Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    ModelFilter:
      name: model
      in: query
      description: Only these requested models. Repeatable.
      style: form
      explode: true
      schema:
        type: array
        items: { type: string }
    ConversationFilter:
      name: conversation
      in: query
      description: Only the turns of this conversation (`UsageRecord.conversation`).
      schema: { type: string }
    AnnotationProject:
      name: project
      in: query
      description: Only this project's requests.
      schema: { type: string }
    AnnotationKey:
      name: key
      in: query
      description: Only this key's requests.
      schema: { type: string }
    AnnotationConversation:
      name: conversation
      in: query
      description: Only the turns of this conversation (`UsageRecord.conversation`).
      schema: { type: string }
    AnnotationMatch:
      name: answer
      in: query
      description: |
        Only requests with every answer named: one written
        `<annotator>.<question>=<answer>`, or several as a JSON object of
        them (at most 16). A yes or no is `true` or `false`, a score its
        level's value.
      schema:
        type: string
        examples: ['request-basics.task=code', '{"request-basics.task": "code", "response-basics.outcome": "refused"}']
    AnnotationMinProbability:
      name: min_probability
      in: query
      description: The least probability an answer `answer` names (or a counted one) has, 0 to 1.
      schema: { type: number, minimum: 0, maximum: 1, default: 0 }
    AnnotationQuestion:
      name: question
      in: query
      required: true
      description: The question counted, `<annotator>.<question>`.
      schema: { type: string }
    MetadataFilter:
      name: metadata
      in: query
      description: |
        Only requests whose `metadata` has every pair asked: one pair written
        `name=value`, or several as a JSON object of them, `{"name": "value",
        …}` (at most 16), all of which must match. The parameter is given
        once.
      schema:
        type: string
        examples: ['team=search', '{"team": "search", "run": "7"}']
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        When a client retries with the same key within the retention window,
        voice returns the original result instead of serving and billing again.
      schema: { type: string, maxLength: 255 }

  headers:
    X-Request-Id:
      description: Voice's request id; equals `voice.request_id` and the usage record's id.
      schema: { type: string }
    x-ratelimit-limit-requests:
      description: The tightest applicable request limit for the current window.
      schema: { type: integer }
    x-ratelimit-remaining-requests:
      schema: { type: integer }
    x-ratelimit-reset-requests:
      description: Time until the request window resets, e.g. `1s`, `6m0s`.
      schema: { type: string }
    x-ratelimit-limit-tokens:
      description: The tightest applicable token limit (input plus output) for the current window.
      schema: { type: integer }
    x-ratelimit-remaining-tokens:
      schema: { type: integer }
    x-ratelimit-reset-tokens:
      schema: { type: string }
    voice-budget-remaining-micros:
      description: The project's remaining budget in micros of its currency.
      schema: { type: integer }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  responses:
    BadRequest:
      description: The request is malformed or names an unsupported option.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Malformed:
      description: |
        The transport refuses the request before the handler sees it: a body
        that is not the request's JSON, a field missing or of the wrong
        type (`reason` names it), a path or query value that is not the
        field's type. The control plane is served by `http::Rest` from the
        surface's routes; its refusals are `{"refusal": {"kind", "reason"}}`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Refusal' }
    AdminInvalid:
      description: |
        The request is well formed and the handler judged it invalid. The
        body is the variant `Invalid` with its problem; `Hale-Error-Class:
        invalid` names the class.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminInvalid' }
    AdminNotFound:
      description: 'No such resource. `Hale-Error-Class: not_found`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminNotFound' }
    AdminConflict:
      description: |
        The request conflicts with the state it meets (a resource with that
        id exists, a restriction a key outruns). `Hale-Error-Class: conflict`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminConflict' }
    Unauthorized:
      description: Missing, unknown or revoked credential.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: |
        The credential may not do this: the model is not visible to the key,
        the data class is not one the project may send, or the principal does
        not own the project.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: A resource with that id already exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ModelNotFound:
      description: No model by that name in the catalog.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PendingReview:
      description: |
        This deployment requires review for policy changes. Nothing changed
        yet; the change is proposed and waits for a decision.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PolicyChange' }
    RateLimited:
      description: |
        A rate limit or the project's budget refuses the request. `code` is
        `rate_limited` or `budget_exhausted`; `voice.limit` names the limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Upstream:
      description: Every eligible seat failed; `voice.attempts` lists them.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: |
        Nothing can serve the request now. `no_eligible_seat`: no enabled
        seat on a connected node serves this model for this data class and
        these accounts. `no_capacity`: seats exist, but every account they
        spend is out of headroom; `Retry-After` is the earliest reset.
        `metering_unavailable`: the ledger cannot record usage, so nothing is
        served until it can. Seat saturation alone never produces this; it
        queues.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    DeadlineExceeded:
      description: The request's `voice.deadline` passed before it was served.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NodeRevoked:
      description: |
        The node is revoked: its token is known but no longer admits it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: |
        `internal_error`: the server could not complete the request, as when
        its store refuses a read or a write. Nothing the request asked for was
        applied unless the response says so; retrying is safe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooLarge:
      description: The request body is over 12 MiB.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---- identifiers and shared values ----------------------------------

    ProjectIdValue:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,126}$'
      description: |
        Chosen at creation, stable forever, never reused. Up to 127, room for
        a habitat's caller, `<habitat>-<caller>`.
      examples: [personal, work]

    AccountIdValue:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      description: Chosen at creation, stable forever, never reused.
      examples: [claude-work, claude-personal, codex, static]

    NodeIdValue:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      description: Chosen at creation, stable forever, never reused.
      examples: [laptop, desktop]

    Metadata:
      type: object
      description: |
        The standard's `metadata`: up to 16 caller pairs, keys up to 64
        characters, values up to 512. Voice never interprets it; it echoes it
        and stores it on the usage record. DNA sends the attempt id here.
      maxProperties: 16
      propertyNames: { maxLength: 64 }
      additionalProperties: { type: string, maxLength: 512 }

    DataClass:
      type: string
      description: |
        The sensitivity of the request's content. A request is routed only to
        seats whose data classes include it. Values are deployment policy;
        `internal` is the default.
      examples: [public, internal, customer]

    # ---- caller plane: extensions ---------------------------------------

    VoiceRequestExtension:
      type: object
      description: Voice's fields on a request. All optional.
      properties:
        data_class:
          $ref: '#/components/schemas/DataClass'
        deadline:
          type: string
          format: date-time
          description: Absolute time after which the caller no longer wants the answer.
        account:
          $ref: '#/components/schemas/AccountIdValue'
          description: |
            Serve on this account only, for when who pays matters (client
            billing). The key must permit it. No fallback to another account:
            when it has no headroom the request fails with `no_capacity`.

    Served:
      type: object
      description: What actually served the request. Evidence, not a choice.
      required: [model, node, seat, account]
      properties:
        model:
          type: string
          description: The model that ran, as the engine or provider reported it.
        quantization:
          type: [string, 'null']
          description: Null when the provider does not say.
          examples: [Q4_K_M, bf16, 4bit]
        node:
          type: string
          description: The node the seat runs on.
        seat:
          type: string
          description: The seat that served, written `<node>/<seat>`.
          examples: [laptop/static, laptop/claude-work]
        account:
          type: string
          description: The account the seat spent.
        engine:
          type: string
          examples: [static, claude-cli, llama.cpp, mlx, vllm]
        provider:
          type: [string, 'null']
          description: The hosted provider, or null for a local engine.

    Timing:
      type: object
      required: [wall_ms, queue_ms, load_ms]
      properties:
        wall_ms:
          type: integer
          description: From the coordinator accepting the request to the last byte.
        queue_ms:
          type: integer
          description: Time waiting for a seat slot.
        load_ms:
          type: integer
          description: Time spent fetching or loading weights before serving; 0 when warm.
        first_output_ms:
          type: integer
          minimum: 0
          description: |
            From the seat receiving the request to its first output, as its
            node measured it: what the seat spent before it began to
            generate (reading the prompt, a cold start). Present when the
            seat produced output.
        engine_ms:
          type: integer
          minimum: 0
          description: |
            From the seat receiving the request to its result, as its node
            measured it. Generation is `engine_ms - first_output_ms`, and the
            seat's throughput `output_tokens` over that. Present with
            `first_output_ms`.

    Attempt:
      type: object
      description: One try on one seat. A retry elsewhere is evidence, never hidden.
      required: [seat, account, outcome]
      properties:
        seat:
          type: string
          description: Written `<node>/<seat>`.
        account: { type: string }
        outcome:
          type: string
          enum: [served, failed, abandoned]
        error:
          type: string
          description: Why the seat failed, when it did.
        output_tokens_before_failure:
          type: integer
          description: Tokens already sent to the client when this seat failed. Non-zero means the response failed rather than moving seats.
        wall_ms: { type: integer }

    VoiceResponseExtension:
      type: object
      required: [request_id, project, key, served, price_micros, currency, timing, attempts]
      properties:
        request_id:
          type: string
          description: Equals the `X-Request-Id` header and the usage record's id.
        project:
          type: string
          description: The project the request was attributed to.
        key:
          type: string
          description: The key the request was made with.
        served:
          $ref: '#/components/schemas/Served'
        price_micros:
          type: integer
          description: What this request cost, in micros of `currency`. 0 for a model with no price.
        currency:
          type: string
          default: USD
        timing:
          $ref: '#/components/schemas/Timing'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
        decision:
          type: object
          description: |
            A decision model's answer to each question (`CatalogModel.contract`),
            by the schema's property: `choice` (its option, `confidence`,
            `probabilities` of every option), `noul` (the probability of yes),
            or `score` (the expected level, `confidence`, `probabilities` by
            level index, and `legend`, each index's value). Absent for a
            generative model.
          additionalProperties:
            type: object
            required: [type]
            properties:
              type: { type: string, enum: [choice, noul, score] }

    # ---- caller plane: Open Responses -----------------------------------

    CreateResponseRequest:
      description: The standard `CreateResponseBody` plus an optional `voice` object.
      allOf:
        - $ref: './vendor/open-responses/openapi.json#/components/schemas/CreateResponseBody'
        - type: object
          required: [model]
          properties:
            voice:
              $ref: '#/components/schemas/VoiceRequestExtension'

    Response:
      description: The standard `ResponseResource` plus the required `voice` object.
      allOf:
        - $ref: './vendor/open-responses/openapi.json#/components/schemas/ResponseResource'
        - type: object
          required: [voice]
          properties:
            voice:
              $ref: '#/components/schemas/VoiceResponseExtension'

    VoiceAttemptEvent:
      type: object
      description: |
        Voice's one extended streaming event: a seat failed and the request
        moved to another. Emitted before the next seat's first event.
      required: [type, sequence_number, attempt]
      properties:
        type:
          type: string
          const: 'voice:attempt'
        sequence_number:
          type: integer
        attempt:
          $ref: '#/components/schemas/Attempt'
        next_seat:
          type: string

    # ---- caller plane: Chat Completions (compatibility) -----------------

    ChatMessage:
      type: object
      required: [role]
      additionalProperties: true
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          description: Text, or an array of content parts.
          oneOf:
            - type: string
            - type: 'null'
            - type: array
              items:
                type: object
                required: [type]
                additionalProperties: true
                properties:
                  type: { type: string, examples: [text, image_url] }
        name: { type: string }
        reasoning_content:
          type: string
          description: |
            An answer's: the model's thinking before it, when it thought
            (llama-server's and vLLM's `reasoning_content`; on `/v1/responses`
            a `reasoning` output item). A stream carries it as
            `delta.reasoning_content`. An answer whose output cap ran out while
            it thought has its thinking and finish reason `length`.
        tool_calls:
          type: array
          items: { type: object }
        tool_call_id: { type: string }

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      description: |
        The OpenAI Chat Completions request. Fields voice does not recognise
        are passed through to engines that accept them. `n` greater than 1 is
        not supported in the MVP.
      properties:
        model: { type: string }
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'
        max_tokens: { type: integer, minimum: 1 }
        max_completion_tokens:
          type: integer
          minimum: 1
          description: Newer spelling of `max_tokens`; if both are set this wins.
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        stop:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
              maxItems: 4
        seed: { type: integer }
        n: { type: integer, const: 1 }
        prompt_cache_key:
          type: string
          description: |
            One value per conversation, the same on each of its turns (as on
            `/v1/responses`). Voice sends a conversation to the same seat each
            turn when several serve its model, so the seat's prompt cache holds
            what it said and a turn reads only what it added. A routing key,
            never a secret or user data; leave it out for one-shot calls.
        stream: { type: boolean, default: false }
        stream_options:
          type: object
          properties:
            include_usage: { type: boolean }
        tools:
          type: array
          description: |
            Function tools, passed to the seat as they are. Only a seat that
            carries tools serves a request that lists them (an
            `openai-compatible` seat; a `static` seat only as its drill); the
            others refuse it and the request moves to the next seat. The
            answer's calls come back as `tool_calls` (deltas when streamed)
            with `finish_reason: "tool_calls"`.
          items: { type: object }
        tool_choice: {}
        response_format: { type: object }
        metadata:
          $ref: '#/components/schemas/Metadata'
        voice:
          $ref: '#/components/schemas/VoiceRequestExtension'

    ChatUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }

    ChatCompletion:
      type: object
      required: [id, object, created, model, choices, usage, voice]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer, description: Unix seconds. }
        model: { type: string, description: The model id the caller named. }
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index: { type: integer }
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: [string, 'null']
        usage:
          $ref: '#/components/schemas/ChatUsage'
        metadata:
          $ref: '#/components/schemas/Metadata'
        voice:
          $ref: '#/components/schemas/VoiceResponseExtension'

    ChatCompletionChunk:
      type: object
      description: 'One server-sent event; the stream ends with `data: [DONE]`.'
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion.chunk }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            required: [index, delta]
            properties:
              index: { type: integer }
              delta: { type: object, additionalProperties: true }
              finish_reason:
                type: [string, 'null']
                description: The standard's reasons, and `error` on the final chunk of a stream whose seat failed once it had begun.
        usage:
          description: Final chunk only; `null` when the stream failed.
          oneOf:
            - $ref: '#/components/schemas/ChatUsage'
            - type: 'null'
        error:
          description: Final chunk only, when the stream failed once it had begun.
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }
        voice:
          description: Final chunk only.
          $ref: '#/components/schemas/VoiceResponseExtension'

    # ---- catalog and capabilities ---------------------------------------

    ModelPrice:
      type: object
      description: Price per million tokens, in micros of `currency`.
      required: [input_per_mtok_micros, output_per_mtok_micros, currency]
      properties:
        input_per_mtok_micros: { type: integer }
        output_per_mtok_micros: { type: integer }
        currency: { type: string, default: USD }

    Model:
      type: object
      required: [id, object, created, owned_by, voice]
      properties:
        id: { type: string }
        object: { type: string, const: model }
        created: { type: integer }
        owned_by:
          type: string
          description: The provider for a hosted model, or `local`.
        voice:
          type: object
          required: [kind, data_classes, available]
          properties:
            kind:
              type: string
              enum: [local, hosted]
            context_length:
              type: integer
              description: |
                The context, in tokens, a request can count on: the least any
                seat that could serve it took, never more than the model is
                made for; the catalog's when no seat has said.
            max_output_tokens:
              type: integer
              description: Default and maximum output; used for reservation when a request sets none.
            quantizations:
              type: array
              description: Quantizations available across seats, for a local model.
              items: { type: string }
            data_classes:
              type: array
              description: Data classes some eligible seat may carry for this model.
              items:
                $ref: '#/components/schemas/DataClass'
            price:
              oneOf:
                - $ref: '#/components/schemas/ModelPrice'
                - type: 'null'
            available:
              type: boolean
              description: True when at least one enabled seat on a connected node serves it, spending an account this key may spend, and its account has headroom.
            contract:
              type: string
              enum: [generative, decision]
              description: What it answers (`CatalogModel.contract`); a decision model answers only a structured request.
            capabilities:
              type: object
              description: What a seat that could serve this key carries through to the model.
              required: [tools]
              properties:
                tools:
                  type: boolean
                  description: |
                    A request's `tools` reach the model and come back as tool
                    calls: an openai-compatible seat, a managed seat under
                    llama-server, or the static engine's tool-call drill.
                    False under vLLM until voice starts it with a tool-call
                    parser, and for the claude CLI.

    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'

    Capabilities:
      type: object
      required: [project, key, models, limits, budget]
      properties:
        project:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        key:
          type: object
          required: [id]
          properties:
            id: { type: string }
            name: { type: string }
        data_classes:
          type: array
          description: Data classes this project may send.
          items:
            $ref: '#/components/schemas/DataClass'
        models:
          type: array
          description: Model ids this key may name.
          items: { type: string }
        accounts:
          type: [array, 'null']
          description: Accounts this key may spend, and so may name in `voice.account`. Null means any.
          items: { type: string }
        limits:
          type: array
          description: Every limit that applies to this key, at any scope.
          items:
            $ref: '#/components/schemas/Limit'
        budget:
          description: The project's budget, or null when it has none.
          oneOf:
            - $ref: '#/components/schemas/Budget'
            - type: 'null'

    # ---- admin plane: projects, budgets, limits -------------------------

    Limit:
      type: object
      description: |
        One rate limit. Null counters are unlimited. `remaining` and
        `resets_at` are read-only and ignored on writes.
      required: [scope, window_seconds]
      properties:
        scope:
          type: string
          enum: [project, key, model, account]
        model:
          type: string
          description: Required when `scope` is `model`.
        account:
          type: string
          description: Required when `scope` is `account`. Set on the account itself; operator policy on top of what the provider allows.
        window_seconds: { type: integer, minimum: 1 }
        requests: { type: [integer, 'null'], minimum: 0 }
        input_tokens: { type: [integer, 'null'], minimum: 0 }
        output_tokens: { type: [integer, 'null'], minimum: 0 }
        concurrent: { type: [integer, 'null'], minimum: 0 }
        remaining:
          readOnly: true
          type: object
          properties:
            requests: { type: [integer, 'null'] }
            input_tokens: { type: [integer, 'null'] }
            output_tokens: { type: [integer, 'null'] }
            concurrent: { type: [integer, 'null'] }
        resets_at:
          readOnly: true
          type: string
          format: date-time

    LimitSet:
      type: object
      required: [limits]
      properties:
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'
        source:
          type: string
          enum: [stored, practice]
          readOnly: true
          description: |
            Where the limits come from: the ones stored through this API, or,
            when voice runs under an organization's head, the organization's
            ratified practice. Ignored on writes.
        practice:
          readOnly: true
          description: The ratified practice a `practice` limit was read from.
          type: object
          required: [name, id]
          properties:
            name:
              type: string
              description: '`operating/limits/<project>`.'
            id:
              type: string

    BudgetSet:
      type: object
      description: A hard cap on the project's spend per period.
      required: [allowance_micros, period]
      properties:
        allowance_micros:
          type: integer
          minimum: 0
        currency:
          type: string
          default: USD
        period:
          type: string
          enum: [day, week, month, none]
          description: How often the spend resets. `none` is a lifetime cap.
        period_anchor:
          type: string
          format: date-time
          description: When periods start counting from. Defaults to the start of the current UTC calendar period.

    Budget:
      description: |
        The project's budget in its current period. A circuit breaker: it stops
        spend even if a client misbehaves or a key leaks.
      allOf:
        - $ref: '#/components/schemas/BudgetSet'
        - type: object
          required: [spent_micros, reserved_micros, remaining_micros]
          properties:
            spent_micros:
              type: integer
              description: Settled spend this period.
            reserved_micros:
              type: integer
              description: Held by in-flight requests, not yet settled.
            remaining_micros: { type: integer }
            window_start: { type: string, format: date-time }
            window_end: { type: [string, 'null'], format: date-time }

    ProjectCreate:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/ProjectIdValue'
        name: { type: string, maxLength: 128 }
        peek:
          type: boolean
          description: |
            Each request it sends is recorded whole, its request as served and
            its final response, reasoning included, for the operator to read
            (`listPeeks`); kept seven days. Left out, a child follows its
            parent's, read when a request is admitted, and a project of its
            own does not peek. A request is recorded when its project peeks or
            its key does.
        annotate:
          type: boolean
          description: |
            After each request it sends is answered, a decision model is asked
            the questions of the annotators in force for it (`listAnnotators`),
            off the request's path: the caller waits for none of it. The
            questions are asked as requests of `voice-system`, voice's own
            project, whose usage, limits and accounts they spend, never this
            one's. Left out, a child follows its parent's, read when a request
            is admitted, and a project of its own does not annotate. A
            request is annotated when its project annotates or its key does.
        aliases:
          type: array
          maxItems: 32
          description: |
            The names it gives models: a caller asks for `coding` and is served
            the catalog model the alias names, moved out of band. Voice's
            categories (`general`, `coding`, `reasoning`, `decide`) are the
            names it suggests. A child's are its own over its parent's, name by
            name.
          items:
            $ref: '#/components/schemas/ModelAlias'
        owners:
          type: array
          description: Principals who may administer the project. The creator is always added.
          items: { type: string }
        data_classes:
          type: array
          description: Data classes the project may send. Defaults to `[internal]`.
          items:
            $ref: '#/components/schemas/DataClass'
        models:
          type: [array, 'null']
          description: Catalog visibility. Null means the whole catalog.
          items: { type: string }
        parent:
          $ref: '#/components/schemas/ProjectIdValue'
          description: |
            The project it is a child of: one of no parent of its own, not
            archived. With no `accounts` of its own, a child inherits its
            parent's, read when it is used; giving it `accounts` narrows it.
        accounts:
          type: [array, 'null']
          description: Accounts the project may spend. Null means any.
          items:
            $ref: '#/components/schemas/AccountIdValue'
        budget:
          $ref: '#/components/schemas/BudgetSet'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'

    ModelAlias:
      type: object
      description: |
        A name a project gives a model. A request for `name` is served as
        `model`, read when it is admitted, and its usage keeps `name` as the
        model asked for. The name is not a catalog model's own; `model` is.
      required: [name, model]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          examples: [coding]
        model:
          type: string
          description: A catalog model's id.

    ProjectUpdate:
      type: object
      description: Only the fields present change. Budget and limits have their own endpoints.
      properties:
        name: { type: string, maxLength: 128 }
        peek:
          type: [boolean, 'null']
          description: |
            `true` or `false` sets its own; `null` follows its parent's again
            (off for a project of its own). Each request it sends is recorded
            whole (`listPeeks`), kept seven days.
        annotate:
          type: [boolean, 'null']
          description: |
            `true` or `false` sets its own; `null` follows its parent's again
            (off for a project of its own). Each request it sends is annotated
            (`getAnnotation`), as `voice-system`'s requests. `voice-system`
            itself never annotates.
        aliases:
          type: array
          maxItems: 32
          description: Its own model aliases, whole; its parent's still apply where it gives none.
          items:
            $ref: '#/components/schemas/ModelAlias'
        owners:
          type: array
          items: { type: string }
        data_classes:
          type: array
          items:
            $ref: '#/components/schemas/DataClass'
        models:
          type: [array, 'null']
          items: { type: string }
        accounts:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/AccountIdValue'
        parent:
          type: [string, 'null']
          description: |
            Moves it under a project of no parent of its own, or, `null`, makes
            it a project of its own, keeping the accounts it spent. A project
            that is a parent cannot become a child.
        inherits:
          type: boolean
          description: |
            A child's (a tenant, `tenant-<organism>`, is its habitat's project's):
            `true` to inherit its parent's accounts again, its own cleared.
            Setting `accounts` narrows it instead, and it no longer inherits.
            Only a project with a parent inherits.

    Project:
      type: object
      required: [id, name, status, owners, data_classes, created_at]
      properties:
        id: { type: string }
        peek:
          type: [boolean, 'null']
          description: Its own setting; `null` when it follows its parent's.
        peeks:
          type: boolean
          description: |
            Whether its requests are recorded whole now (`listPeeks`): its own
            `peek`, else its parent's.
        annotate:
          type: [boolean, 'null']
          description: Its own setting; `null` when it follows its parent's.
        annotates:
          type: boolean
          description: |
            Whether its requests are annotated now (`getAnnotation`): its own
            `annotate`, else its parent's.
        internal:
          type: boolean
          description: |
            Voice's own project, `voice-system`: the requests voice makes for
            itself (annotations) are its, never a caller's. It cannot be
            archived, takes no key, and never annotates; the operator gives it
            accounts, limits and the `decide` alias of the decision model it asks.
        aliases:
          type: array
          description: Its own model aliases.
          items:
            $ref: '#/components/schemas/ModelAlias'
        resolved_aliases:
          type: array
          description: |
            The aliases in force for it: its own, then its parent's it gives
            none of. `from` is the project each is set on.
          items:
            type: object
            required: [name, model, from]
            properties:
              name: { type: string }
              model: { type: string }
              from: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [active, archived]
        owners:
          type: array
          items: { type: string }
        data_classes:
          type: array
          items:
            $ref: '#/components/schemas/DataClass'
        models:
          type: [array, 'null']
          items: { type: string }
        accounts:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/AccountIdValue'
        budget:
          oneOf:
            - $ref: '#/components/schemas/Budget'
            - type: 'null'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'
        parent:
          type: [string, 'null']
          description: |
            The project this one is a child of. Voice makes each organism of its
            habitat a project, `tenant-<organism>`, on its first call, a child of
            the habitat's project, `habitat-<name>`, the habitat itself, voice's
            customer: what the habitat may spend is that project's accounts.
        inherits:
          type: boolean
          description: |
            A child's that spends its parent's accounts, read when it is used,
            not its own `accounts`: a change to the parent's reaches it on its
            next call.
        key_count: { type: integer }
        position:
          type: [string, 'null']
          description: The DNA position this project is, in a DNA deployment.
        created_at: { type: string, format: date-time }
        archived_at: { type: [string, 'null'], format: date-time }

    PolicyChange:
      type: object
      description: A proposed change waiting for review. Nothing is applied until it is decided.
      required: [id, status, target, proposed]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending_review, applied, rejected]
        target:
          type: string
          description: What would change, e.g. `projects/work/budget`.
        proposed:
          type: object
          description: The request body as submitted.
          additionalProperties: true
        review:
          type: [string, 'null']
          description: Where the decision is made, e.g. a DNA review id or URL.

    # ---- admin plane: keys ----------------------------------------------

    KeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: Name the client this key is for; usage is broken down by key.
        peek:
          type: boolean
          description: |
            Each request it sends is recorded whole, its request as served and
            its final response, reasoning included, for the operator to read
            (`listPeeks`); kept seven days. A request is recorded when its
            project or its key peeks.
        annotate:
          type: boolean
          description: |
            Each request it sends is annotated (`getAnnotation`), by the
            annotators in force for it, as `voice-system`'s requests. A
            request is annotated when its project or its key annotates.
        models:
          type: [array, 'null']
          description: Restrict the key to these models. Null means the project's catalog.
          items: { type: string }
        accounts:
          type: [array, 'null']
          description: |
            Restrict the key to these accounts, within the project's. Null
            means the project's. A key for client work names the work
            account here, so everything it sends is billed there.
          items:
            $ref: '#/components/schemas/AccountIdValue'
        limits:
          type: array
          description: Key-scope limits, on top of the project's.
          items:
            $ref: '#/components/schemas/Limit'
        expires_at:
          type: string
          format: date-time

    KeyUpdate:
      type: object
      description: Only the fields present change.
      properties:
        name: { type: string, maxLength: 128 }
        peek:
          type: boolean
          description: |
            Each request it sends is recorded whole, its request as served and
            its final response, reasoning included, for the operator to read
            (`listPeeks`); kept seven days. A request is recorded when its
            project or its key peeks.
        annotate:
          type: boolean
          description: |
            Each request it sends is annotated (`getAnnotation`), by the
            annotators in force for it, as `voice-system`'s requests. A
            request is annotated when its project or its key annotates.
        models:
          type: [array, 'null']
          items: { type: string }
        accounts:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/AccountIdValue'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'
        expires_at:
          type: [string, 'null']
          format: date-time

    Key:
      type: object
      required: [id, project, name, created_at, status]
      properties:
        id: { type: string }
        peek:
          type: boolean
          description: Each request it sends is recorded whole (`listPeeks`).
        annotate:
          type: boolean
          description: Each request it sends is annotated (`getAnnotation`).
        project: { type: string }
        name: { type: string }
        prefix:
          type: string
          description: The first characters of the secret, for recognition.
        models:
          type: [array, 'null']
          items: { type: string }
        accounts:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/AccountIdValue'
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'
        created_at: { type: string, format: date-time }
        created_by:
          type: string
          description: The principal who created it.
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        status:
          type: string
          enum: [active, revoked, expired]
        revoked_at: { type: [string, 'null'], format: date-time }

    KeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/Key'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: Shown once. Voice stores only a digest.

    # ---- admin plane: usage ---------------------------------------------

    UsageRecord:
      type: object
      description: |
        One request, as the ledger holds it. This is the supplier's fact DNA
        accounts from; it carries every field hale needs back: served model,
        quantization, node, seat and account, tokens, price, wall, queue and
        load time, and the caller's metadata untouched.
      required:
        - id
        - created_at
        - project
        - key
        - requested_model
        - endpoint
        - status
        - served
        - input_tokens
        - output_tokens
        - price_micros
        - currency
        - timing
        - metadata
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        project: { type: string }
        key: { type: string }
        requested_model:
          type: string
          description: |
            The model the caller named: a catalog model's id, or a name its
            project gives one (`ModelAlias`).
        resolved_model:
          type: string
          description: |
            The catalog model the request was routed and served as:
            `requested_model` itself when the caller named a model, the model
            it named when it is a name the project gives one, read when the
            request was admitted. Absent from a record written before it was
            kept, and from an abandoned one (its instance stopped before it
            settled).
        requested_account:
          type: [string, 'null']
          description: The account the request named in `voice.account`, if any.
        endpoint:
          type: string
          enum: [responses, chat.completions]
        status:
          type: string
          enum: [served, incomplete, failed, rate_limited, budget_exhausted, no_capacity, deadline_exceeded, cancelled, abandoned]
          description: |
            `abandoned`: the api instance serving it stopped before it
            settled. The brain records it when the instance's heartbeat
            stops, with the reservation released and tokens as far as
            they were known.
        served:
          oneOf:
            - $ref: '#/components/schemas/Served'
            - type: 'null'
        data_class:
          $ref: '#/components/schemas/DataClass'
        input_tokens: { type: integer }
        cached_input_tokens: { type: integer }
        cache_write_input_tokens:
          type: integer
          description: Input tokens written to the provider's cache, as the engine reported them; counted in `input_tokens`.
        output_tokens: { type: integer }
        reasoning_tokens: { type: integer }
        price_micros: { type: integer }
        currency: { type: string }
        timing:
          $ref: '#/components/schemas/Timing'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
        instance:
          type: [string, 'null']
          description: |
            The api instance that admitted the request (`api-<id>`, the id the
            hub's `InstanceBeat` announces): which of an api's replicas the
            caller reached. `null` for a record from before instances were kept.
        conversation:
          type: [string, 'null']
          description: |
            The conversation the request was a turn of: its
            `prompt_cache_key`, the same on each turn. `null` when the caller
            sent none. The ledger's turns of one conversation share it.
        metadata:
          $ref: '#/components/schemas/Metadata'

    UsageSummary:
      type: object
      required: [group_by, data]
      properties:
        group_by:
          type: array
          items: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        data:
          type: array
          items:
            type: object
            required: [group, requests, input_tokens, output_tokens, price_micros, currency, first_at, last_at, last_request]
            properties:
              group:
                type: object
                description: 'The group''s values, keyed by the `group_by` fields, e.g. `{"project": "work", "key": "k_ci"}`.'
                additionalProperties: { type: string }
              requests: { type: integer }
              refused:
                type: integer
                description: Requests refused by a limit or the budget.
              input_tokens: { type: integer }
              output_tokens: { type: integer }
              price_micros: { type: integer }
              currency: { type: string }
              first_at:
                type: string
                format: date-time
                description: When the group's earliest request was made.
              last_at:
                type: string
                format: date-time
                description: When its latest was.
              last_request:
                type: string
                description: The latest request's id, as `getUsage` reads it.

    # ---- admin plane: catalog --------------------------------------------

    CatalogModelCreate:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: What callers name and seats serve. Stable; never reused for a different model.
          examples: [echo-1, claude-sonnet-5]
        owned_by:
          type: string
          default: local
          description: The provider, or `local`.
        kind:
          type: string
          enum: [local, hosted]
          default: local
        context_length:
          type: integer
          minimum: 1
          description: |
            The longest context, in tokens, the model is made for. A model made
            from a recipe takes the recipe's when this is left out.
        max_output_tokens:
          type: integer
          minimum: 1
          description: Default and maximum output; used for reservation when a request sets none.
        price:
          description: What a request costs. For a subscription account this is the list-price equivalent. Null means free.
          oneOf:
            - $ref: '#/components/schemas/ModelPrice'
            - type: 'null'
        recipe:
          type: string
          description: |
            The recipe a local model's weights come from (`Recipe`): one
            voice ships or the operator allowed. Refused for a hosted model
            and for a recipe there is not. Fixed at creation, like the id.
        contract:
          type: string
          enum: [generative, decision]
          description: |
            What it answers. `generative` (the default): text. `decision`: a
            model that answers only a structured request: `response_format`
            (or `text.format`) a `json_schema` whose every property is a
            question, a string `enum` (or `oneOf` of `{const, description}`)
            a choice of 1 to 255, a `boolean` a yes or no, an integer `enum`
            (or `oneOf`) of 2 to 10 levels in order a score; each property's
            `description` its instructions. Its messages are text only, and
            it takes no `tools`, sampling or length settings, nor `stream`.
            The answer's text is JSON matching the schema, each question's
            most likely answer, and `voice.decision` holds every
            probability. Whatever serves it, a Jev-Style decision model on a
            node or one behind a service, is asked as `/v1/systemone` asks.
            Left out, its recipe's, else `generative`.

    CatalogModelUpdate:
      type: object
      description: Only the fields present change. The id and the recipe cannot change.
      properties:
        owned_by: { type: string }
        kind:
          type: string
          enum: [local, hosted]
        context_length: { type: integer, minimum: 1 }
        max_output_tokens: { type: integer, minimum: 1 }
        price:
          oneOf:
            - $ref: '#/components/schemas/ModelPrice'
            - type: 'null'
        contract:
          type: string
          enum: [generative, decision]

    CatalogModel:
      allOf:
        - $ref: '#/components/schemas/CatalogModelCreate'
        - type: object
          required: [seats, available, created_at]
          properties:
            seats:
              type: array
              description: Seats that serve this model, written `<node>/<seat>`.
              items: { type: string }
            available:
              type: boolean
              description: As on `/v1/models`.
            served_context_length:
              type: integer
              minimum: 1
              description: |
                The least context, in tokens, a seat that could serve it now
                took (`SeatView.context`); left out when none has said. Less
                than `context_length` when its seats serve less than the model
                is made for.
            created_at: { type: string, format: date-time }

    # ---- recipes ---------------------------------------------------------

    RecipeCreate:
      type: object
      description: |
        Where a local model's weights come from, pinned: what the operator
        allows (`createRecipe`), and the form of a file voice ships in
        `recipes/<id>.json`. A recipe says only what the weights are; what
        callers name, the price and the limits are the catalog's.
      required: [id, license, variants]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9.-]{0,62}$'
          description: Stable; never reused for other weights. A shipped recipe's is its file's name without `.json`.
          examples: [qwen3-8b]
        license:
          type: object
          required: [name, url]
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, maxLength: 64, examples: [apache-2.0] }
            url: { type: string, format: uri, maxLength: 512 }
        context_length:
          type: integer
          minimum: 1
          maximum: 16777216
          description: |
            The longest context, in tokens, the model is made for (its
            config's `max_position_embeddings`). A catalog model made from the
            recipe takes it as its `context_length` unless one is given, and a
            seat is never started with more. What a seat actually serves can
            be less; each seat reports its own (`SeatState.context`).
        kv_bytes_per_token:
          type: integer
          minimum: 1
          maximum: 16777216
          description: |
            What one more token of context costs in KV cache, in bytes at 16
            bits: the layers that keep every token (full attention, or MLA's
            latent), not the linear, recurrent or sliding-window ones. A
            placement sizes its seat's prompt cache by it.
        contract:
          type: string
          enum: [generative, decision]
          description: |
            What a catalog model made from it answers (`CatalogModel.contract`),
            unless the model says otherwise. Left out, `generative`.
        variants:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/RecipeVariant' }

    Recipe:
      allOf:
        - $ref: '#/components/schemas/RecipeCreate'
        - type: object
          required: [origin]
          properties:
            origin:
              type: string
              enum: [shipped, operator]
              description: '`shipped`: in voice''s `recipes/`, read-only. `operator`: allowed through `createRecipe`.'
            created_at:
              type: string
              format: date-time
              description: When the operator allowed it; left out for a shipped recipe.

    RecipeVariant:
      type: object
      description: |
        One form of the weights: a format and a quantization, from one
        revision of one source, every file pinned by its digest. A variant
        is what is placed: `memory_bytes` is its whole need, whatever nodes
        it is placed across.
      required: [id, format, quantization, source, files, memory_bytes]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_.-]{0,62}$'
          description: Distinct within its recipe.
          examples: [gguf-q4_k_m, mlx-4bit]
        format:
          type: string
          enum: [safetensors, gguf, mlx]
          description: Formats that hold only tensors; none runs code when loaded.
        quantization:
          type: string
          minLength: 1
          maxLength: 64
          examples: [bf16, q4_k_m, 4bit]
        source:
          type: object
          required: [hub, repo, revision]
          additionalProperties: false
          properties:
            hub:
              type: string
              enum: [huggingface]
            repo:
              type: string
              maxLength: 128
              pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
            revision:
              type: string
              pattern: '^[0-9a-f]{40}$'
              description: A commit, never a branch or a tag.
        files:
          type: array
          minItems: 1
          maxItems: 300
          description: |
            At most 300, and the variant at most 45 KiB as JSON, which a
            frontier model's 160–250 shards fit: a placed seat's config
            carries the variant whole, and a seat's config is at most 48 KiB.

            Every file the variant needs, and nothing else: a file is
            fetched only when it is listed here, and used only when its
            digest matches. Each holds tensors, a tokenizer or settings
            (`.safetensors`, `.gguf`, `.json`, `.txt`, `.model`, `.tiktoken`,
            `.jinja`); a pickled checkpoint or code is never listed.
          items:
            type: object
            required: [path, bytes, sha256]
            additionalProperties: false
            properties:
              path:
                type: string
                maxLength: 256
                pattern: '^(?!/)(?!.*(^|/)\.\.(/|$))[A-Za-z0-9._/-]+\.(safetensors|gguf|json|txt|model|tiktoken|jinja)$'
              bytes: { type: integer, minimum: 1 }
              sha256:
                type: string
                pattern: '^[0-9a-f]{64}$'
        memory_bytes:
          type: integer
          minimum: 1
          description: What serving the variant needs, weights and the engine's own, before any context.

    # ---- runtimes --------------------------------------------------------

    RuntimeCreate:
      type: object
      description: |
        What serves a local model on a node, pinned: what the operator
        allows (`createRuntime`), and the form of a file voice ships in
        `runtimes/<id>.json`. A node starts only a `server` it knows, from
        this artifact and nothing else, so a runtime names no command.
      required: [id, license, server, formats, accelerator, platforms, artifact]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9.-]{0,62}$'
          description: Stable; never reused for another build. A shipped runtime's is its file's name without `.json`.
          examples: [vllm-26.09, llama-server-b11913-cuda]
        license:
          type: object
          required: [name, url]
          additionalProperties: false
          properties:
            name: { type: string, minLength: 1, maxLength: 64 }
            url: { type: string, format: uri, maxLength: 512 }
        server:
          type: string
          enum: [vllm, llama-server, decision]
          description: |
            The server program, which the node knows how to start and stop.
            `decision`: voice's decision server, `voice-decide`, which
            answers a decision model's requests (`CatalogModel.contract:
            decision`, asked as `/v1/systemone`): its MLX build, an archive
            that reads `mlx` on `metal`, or its native build, which reads
            `gguf` on any accelerator (an archive on macOS, a container on
            Linux). A decision recipe is placed only with a `decision`
            runtime, and a generative one never.
        formats:
          type: array
          minItems: 1
          maxItems: 3
          description: The weight formats it reads.
          items:
            type: string
            enum: [safetensors, gguf, mlx]
        accelerator:
          type: string
          enum: [cuda, rocm, vulkan, metal, cpu]
          description: |
            What it runs on. `cuda`: an NVIDIA GPU. `rocm`: an AMD GPU through
            ROCm. `vulkan`: an AMD or Intel GPU (or any with a Vulkan driver).
            `metal`: Apple silicon. `cpu` runs on any machine. A machine's GPU
            is placed on through its native API first (CUDA, ROCm, Metal),
            then Vulkan, then the processors.
        platforms:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            required: [os, arch]
            additionalProperties: false
            properties:
              os: { type: string, enum: [linux, darwin] }
              arch: { type: string, enum: [arm64, x86_64] }
        artifact:
          type: object
          description: |
            Where it comes from. `container`: an image, pulled by its
            digest, never a tag; for several platforms, a manifest list's
            digest. `archive`: a tarball, fetched from `url` and used only
            when its sha256 matches.
          required: [kind]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [container, archive] }
            image:
              type: string
              maxLength: 256
              pattern: '^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+$'
              examples: [nvcr.io/nvidia/vllm]
            digest:
              type: string
              pattern: '^sha256:[0-9a-f]{64}$'
            url:
              type: string
              maxLength: 512
              pattern: '^https://'
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
            bytes: { type: integer, minimum: 1 }
          allOf:
            - if: { properties: { kind: { const: container } } }
              then: { required: [image, digest] }
            - if: { properties: { kind: { const: archive } } }
              then: { required: [url, sha256, bytes] }

    Runtime:
      allOf:
        - $ref: '#/components/schemas/RuntimeCreate'
        - type: object
          required: [origin]
          properties:
            origin:
              type: string
              enum: [shipped, operator]
              description: '`shipped`: in voice''s `runtimes/`, read-only. `operator`: allowed through `createRuntime`.'
            created_at:
              type: string
              format: date-time
              description: When the operator allowed it; left out for a shipped runtime.

    # ---- placements ------------------------------------------------------

    PlacementCreate:
      type: object
      required: [id, model, nodes, account]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
          description: Chosen at creation, stable forever, never reused; the id of the seat it creates on its leader.
          examples: [qwen3-8b-on-spark]
        account:
          type: string
          description: The account the seat spends, as any seat names one; a local account that bills nothing, for a model on the operator's own machines.
        model:
          type: string
          description: A local catalog model that names a recipe.
        nodes:
          type: array
          minItems: 1
          maxItems: 1
          description: |
            The nodes it runs on, the first of them its leader, which holds
            the seat that serves it. One node today; a model too large for
            one is placed across several when engines can split it.
          items: { $ref: '#/components/schemas/NodeIdValue' }
        variant:
          type: string
          description: The operator's choice of form, taken only if it fits; left out, the coordinator picks.
        runtime:
          type: string
          description: The operator's choice of runtime, taken only if it runs the variant on the nodes; left out, the coordinator picks.

    NodeSuggestions:
      type: object
      description: A node's platform and memory tier, and what voice would place on it per category.
      required: [node, data]
      properties:
        node: { type: string }
        os:
          type: string
          description: The node's platform, as its hardware says it; left out when it has declared none.
        tier_gb:
          type: integer
          description: The catalog tier the node is suggested from, in GB; left out below the smallest, or with no hardware declared.
        data:
          type: array
          items:
            $ref: '#/components/schemas/NodeSuggestion'

    NodeSuggestion:
      type: object
      description: One category's suggestion, or why there is none.
      required: [category, reason]
      properties:
        category:
          type: string
          examples: [coding]
        recipe:
          type: string
          description: The recipe voice suggests; left out when none can be placed.
        variant:
          type: string
          description: The variant a placement would take; left out when it is placed already.
        runtime:
          type: string
          description: The runtime that would serve it.
        tier_gb:
          type: integer
          description: The tier whose pick it is, which is the node's own or one below it.
        placed:
          type: string
          description: The placement already serving the recipe on this node, when there is one.
        reason:
          type: string
          description: Why it fits (as a placement's fit says), that it is placed, or why there is no suggestion.

    Placement:
      allOf:
        - $ref: '#/components/schemas/PlacementCreate'
        - type: object
          required: [recipe, variant, runtime, chosen_by, leader, seat, fit, created_at]
          properties:
            recipe:
              type: string
              description: The model's recipe.
            variant:
              type: string
              description: The form chosen.
            runtime:
              type: string
              description: The runtime chosen to serve it.
            chosen_by:
              type: string
              enum: [coordinator, operator]
            leader:
              type: string
              description: The node that holds the seat, the first of `nodes`.
            seat:
              type: string
              description: The seat it created, `<leader>/<id>`.
            fit:
              type: array
              description: Each variant of the recipe, judged against the nodes as they declared their hardware when the placement was made.
              items: { $ref: '#/components/schemas/VariantFit' }
            cache_tokens:
              type: integer
              minimum: 1
              description: |
                The prompt cache its seat keeps, in tokens, shared by the
                conversations it holds: room for four of the model's context
                (at most 128k each) from at most half the memory its variant
                leaves on the node, and no larger than the variant itself;
                never less than the 32k its variant's memory provides. Left out
                of a placement made before voice sized it.
            reserved_bytes:
              type: integer
              minimum: 1
              description: |
                What is reserved for it of its node's memory for models: its
                variant's need and its cache, all of it from when it is placed.
                Its seat holds that and its server's own, 2 GiB (the process,
                its GPU context and compute buffers; vLLM is given that sum as
                its share of the GPU). A later placement on the node fits in
                what the others leave.
            created_at: { type: string, format: date-time }

    PeekSummary:
      type: object
      description: A recorded request, listed.
      required: [request_id, project, key, model, created_at]
      properties:
        request_id: { type: string }
        project: { type: string }
        key: { type: string }
        model: { type: string }
        created_at: { type: string, format: date-time }

    Peek:
      description: A recorded request whole.
      allOf:
        - $ref: '#/components/schemas/PeekSummary'
        - type: object
          required: [input, output]
          properties:
            input:
              type: string
              description: The standard request as it was served, a JSON document as text.
            output:
              type: string
              description: The final response, reasoning included, a JSON document as text.

    AnnotatorStage:
      type: string
      description: |
        When an annotator asks: `request`, of the request; `response`, of its
        response, read beside the request.
      enum: [request, response]

    AnnotationCondition:
      type: object
      description: |
        A request answer: holds when `annotator`'s `question` gave `answer`
        a probability of `min_probability` or more.
      required: [annotator, question, answer]
      properties:
        annotator: { type: string }
        question: { type: string }
        answer:
          type: string
          description: A choice's option, `true` or `false`, or a score's level.
        min_probability: { type: number, minimum: 0, maximum: 1, default: 0.5 }

    AnnotatorQuestion:
      type: object
      description: |
        One question, as a decision model answers it: a `choice` of 1 to 255
        options, each a `value` and what it means; a `noul`, yes or no
        (`true`, `false`), which takes no options; or a `score` of 2 to 10
        levels in order, each an integer `value`. `instructions` is the
        question. A response annotator's question may carry a `condition`
        on the request's answers: asked only when it holds, and kept as
        `skipped` when it does not.
      required: [name, type, instructions]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9_]{1,64}$'
        type:
          type: string
          enum: [choice, noul, score]
        instructions: { type: string, minLength: 1, maxLength: 2000 }
        options:
          type: array
          maxItems: 255
          items:
            type: object
            required: [value]
            properties:
              value: { type: string, minLength: 1, maxLength: 128 }
              description: { type: string, maxLength: 500 }
        condition:
          $ref: '#/components/schemas/AnnotationCondition'

    AnnotatorScope:
      type: object
      description: |
        The requests it reads, of those whose project or key annotates:
        these projects' (and their children's) and these keys'. Both empty,
        every one.
      required: [projects, keys]
      properties:
        projects:
          type: array
          maxItems: 32
          items: { type: string }
        keys:
          type: array
          maxItems: 32
          items: { type: string }

    AnnotatorCreate:
      type: object
      required: [id, name, stage, questions]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        name: { type: string, minLength: 1, maxLength: 128 }
        stage: { $ref: '#/components/schemas/AnnotatorStage' }
        questions:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            Its questions. The enabled annotators of one stage ask at most 64
            together, in one request to the decision model; at most 64 KiB as
            JSON.
          items: { $ref: '#/components/schemas/AnnotatorQuestion' }
        scope: { $ref: '#/components/schemas/AnnotatorScope' }
        reads_request:
          type: boolean
          default: false
          description: |
            A response annotator that also reads the request's answers, as a
            short labelled block beside the text: its answers are
            `conditioned`, searchable apart from those given on the text
            alone.
        enabled: { type: boolean, default: true }

    AnnotatorUpdate:
      type: object
      description: What it sets makes a new version; its id and stage never change.
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        questions:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: '#/components/schemas/AnnotatorQuestion' }
        scope: { $ref: '#/components/schemas/AnnotatorScope' }
        reads_request: { type: boolean }
        enabled: { type: boolean }

    Annotator:
      type: object
      required: [id, name, stage, version, questions, scope, reads_request, enabled, builtin, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        stage: { $ref: '#/components/schemas/AnnotatorStage' }
        version:
          type: integer
          description: Its version, 1 when made, one more at each edit.
        questions:
          type: array
          items: { $ref: '#/components/schemas/AnnotatorQuestion' }
        scope: { $ref: '#/components/schemas/AnnotatorScope' }
        reads_request: { type: boolean }
        enabled: { type: boolean }
        builtin:
          type: boolean
          description: Voice's own, shipped; edited and disabled, never removed.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AnnotationExpect:
      type: object
      description: |
        The response answer a rule expects: `answer`, or for a score
        `at_least`, a level's value or a higher one.
      required: [annotator, question]
      properties:
        annotator: { type: string }
        question: { type: string }
        answer: { type: string }
        at_least: { type: string }

    AnnotationRuleCreate:
      type: object
      required: [id, name, expect]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        name: { type: string, minLength: 1, maxLength: 128 }
        condition:
          description: When the rule applies, a request answer; left out, always.
          oneOf:
            - $ref: '#/components/schemas/AnnotationCondition'
            - type: 'null'
        expect: { $ref: '#/components/schemas/AnnotationExpect' }
        enabled: { type: boolean, default: true }

    AnnotationRuleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        condition:
          description: A request answer, or `null` for always.
          oneOf:
            - $ref: '#/components/schemas/AnnotationCondition'
            - type: 'null'
        expect: { $ref: '#/components/schemas/AnnotationExpect' }
        enabled: { type: boolean }

    AnnotationRule:
      type: object
      required: [id, name, expect, enabled, builtin, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        condition:
          description: When the rule applies, a request answer; left out when it always does.
          allOf:
            - $ref: '#/components/schemas/AnnotationCondition'
        expect: { $ref: '#/components/schemas/AnnotationExpect' }
        enabled: { type: boolean }
        builtin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AnnotationSummary:
      type: object
      description: A request's annotation, listed; its answers are `getAnnotation`'s.
      required: [request_id, project, key, created_at, status, reason, clipped]
      properties:
        request_id: { type: string }
        project: { type: string }
        key: { type: string }
        conversation:
          type: string
          description: Its conversation (`UsageRecord.conversation`); left out when it has none.
        created_at: { type: string, format: date-time }
        status:
          type: string
          enum: [annotated, not_annotated]
        reason:
          type: string
          description: |
            Why it was not annotated, empty when it was: `voice-system` has no
            decision model it may use, is past its limits, or the model failed.
        clipped:
          type: boolean
          description: |
            A text read was cut to fit the decision model: its start and end
            were read, the middle left out and marked so.

    AnnotationAnswer:
      type: object
      required: [annotator, version, stage, question, probability, probabilities, conditioned, skipped]
      properties:
        annotator: { type: string }
        version: { type: integer }
        stage: { $ref: '#/components/schemas/AnnotatorStage' }
        question: { type: string }
        answer:
          type: string
          description: The likeliest answer; left out when skipped.
        probability: { type: number }
        probabilities:
          type: object
          description: Every answer's probability.
          additionalProperties: { type: number }
        score:
          type: number
          description: A score's expected level, its levels weighed by their probabilities; left out for any other question.
        conditioned:
          type: boolean
          description: Given by an annotator that read the request's answers too.
        skipped:
          type: boolean
          description: Not asked, its condition not holding.

    AnnotationPair:
      type: object
      required: [rule, name, applies, met, probability]
      properties:
        rule: { type: string }
        name: { type: string }
        applies: { type: boolean }
        met: { type: boolean }
        probability:
          type: number
          description: The probability of the answer it expects.

    Annotation:
      description: A request's annotation whole.
      allOf:
        - $ref: '#/components/schemas/AnnotationSummary'
        - type: object
          required: [input_tokens, answers, pairs]
          properties:
            model:
              type: string
              description: The decision model that answered; left out when none did.
            input_tokens:
              type: integer
              description: What its questions read, as `voice-system`'s requests.
            answers:
              type: array
              items: { $ref: '#/components/schemas/AnnotationAnswer' }
            pairs:
              type: array
              items: { $ref: '#/components/schemas/AnnotationPair' }

    AnnotationFacets:
      type: object
      required: [question, total, counts]
      properties:
        question: { type: string }
        total: { type: integer }
        counts:
          type: array
          items:
            type: object
            required: [answer, count]
            properties:
              answer: { type: string }
              count: { type: integer }

    AnnotationTrend:
      type: object
      required: [question, bucket, points]
      properties:
        question: { type: string }
        bucket:
          type: string
          enum: [hour, day]
        points:
          type: array
          items:
            type: object
            required: [at, answer, count]
            properties:
              at: { type: string, format: date-time }
              answer: { type: string }
              count: { type: integer }

    AnnotationBackfill:
      type: object
      required: [annotator]
      properties:
        annotator: { type: string }
        version:
          type: integer
          minimum: 1
          description: The version asked; its current one by default.
        project: { type: string }
        key: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    VariantFit:
      type: object
      required: [variant, runtime, fits, reason]
      properties:
        variant: { type: string }
        runtime:
          type: [string, 'null']
          description: The runtime that would serve it there; null when none runs it.
        fits: { type: boolean }
        reason:
          type: string
          description: Why it fits or does not, in a line.
          examples: ['llama-server-b11913-cuda runs gguf on cuda; 5.6 GB of 128.0 GB for models; 4.9 GB of 3.5 TB free']

    # ---- admin plane: accounts -------------------------------------------

    AccountCreate:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/AccountIdValue'
        name: { type: string, maxLength: 128 }
        provider:
          type: [string, 'null']
          description: Who the account is with; null for a local engine.
          examples: [anthropic, openai]
        billing:
          type: string
          enum: [subscription, metered, none]
          default: none
          description: |
            `subscription`: a flat plan whose limits are windows the provider
            reports. `metered`: pay per token. `none`: a local engine.
        limits:
          type: array
          description: Account-scope limits, on top of what the provider allows. `scope` is `account`.
          items:
            $ref: '#/components/schemas/Limit'

    AccountUpdate:
      type: object
      description: Only the fields present change.
      properties:
        name: { type: string, maxLength: 128 }
        provider: { type: [string, 'null'] }
        billing:
          type: string
          enum: [subscription, metered, none]
        limits:
          type: array
          items:
            $ref: '#/components/schemas/Limit'

    QuotaWindow:
      type: object
      description: A limit the provider enforces on the account, as an engine last reported it.
      required: [name, used_percent, observed_at]
      properties:
        name:
          type: string
          examples: [five_hour, seven_day]
        used_percent: { type: number, minimum: 0, maximum: 100 }
        resets_at: { type: [string, 'null'], format: date-time }
        observed_at: { type: string, format: date-time }
        seat:
          type: string
          description: The seat whose engine reported it.

    Account:
      allOf:
        - $ref: '#/components/schemas/AccountCreate'
        - type: object
          required: [status, seats, windows, created_at]
          properties:
            status:
              type: string
              enum: [active, archived]
            seats:
              type: array
              description: Seats that spend this account, written `<node>/<seat>`.
              items: { type: string }
            windows:
              type: array
              description: Provider windows. Empty until an engine reports them; the static engine never does.
              items:
                $ref: '#/components/schemas/QuotaWindow'
            exhausted_until:
              type: [string, 'null']
              format: date-time
              description: Set while a provider window or an account limit is spent; routing skips the account until then.
            created_at: { type: string, format: date-time }
            archived_at: { type: [string, 'null'], format: date-time }

    # ---- admin plane: nodes and seats ------------------------------------

    NodeCreate:
      type: object
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/NodeIdValue'
        name: { type: string, maxLength: 128 }
        max_in_flight:
          type: [integer, 'null']
          minimum: 1
          description: The coordinator's cap for the node. Null leaves the node's declared cap in charge.

    NodeUpdate:
      type: object
      description: Only the fields present change.
      properties:
        name: { type: string, maxLength: 128 }
        max_in_flight:
          type: [integer, 'null']
          minimum: 1

    Node:
      type: object
      required: [id, status, seats, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [pending, up, down, revoked]
          description: '`pending` until it first connects with its token.'
        version:
          type: [string, 'null']
          description: The node software's version, as it reported on connecting.
        capabilities:
          description: What the node offers, as it last declared. Null until it first connects.
          oneOf:
            - $ref: './protocol.yaml#/components/schemas/Capabilities'
            - type: 'null'
        local:
          description: Its local controls, as it last reported. Null until it first connects.
          oneOf:
            - $ref: './protocol.yaml#/components/schemas/LocalControls'
            - type: 'null'
        max_in_flight:
          type: [integer, 'null']
          description: The coordinator's cap for the node, or null for none.
        effective_max_in_flight:
          type: [integer, 'null']
          description: The smallest of the declared, coordinator and local caps. Null until it first connects.
        in_flight: { type: integer }
        assignment_version:
          type: integer
          description: The latest assignment for this node.
        applied_version:
          type: [integer, 'null']
          description: The assignment the node last reported applying.
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatView'
        connected_at: { type: [string, 'null'], format: date-time }
        last_heartbeat_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }

    NodeWithToken:
      allOf:
        - $ref: '#/components/schemas/Node'
        - type: object
          required: [enrollment_token]
          properties:
            enrollment_token:
              type: string
              description: Shown once. The node is started with it. Voice stores only a digest.

    SeatUpdate:
      type: object
      description: Only the fields present change. The id cannot.
      properties:
        engine: { type: string }
        account: { type: string }
        serves:
          type: array
          minItems: 1
          items:
            $ref: './protocol.yaml#/components/schemas/SeatModel'
        data_classes:
          type: array
          items: { type: string }
        concurrency: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        config: { type: object }

    SeatView:
      description: A seat as configured here, with its state on its node.
      allOf:
        - $ref: './protocol.yaml#/components/schemas/Seat'
        - type: object
          required: [ref, node, status, in_flight, problems]
          properties:
            ref:
              type: string
              description: The seat's full name, `<node>/<seat>`.
            node: { type: string }
            status:
              type: string
              enum: [pending, offline, starting, fetching, up, down, disabled, paused, refused]
              description: |
                `pending`: the node has not yet reported on the assignment
                that carries this version of the seat. `offline`: its node is
                not connected. The rest are as the node reported them
                (`SeatState` in the protocol).
            reason:
              type: [string, 'null']
              description: The node's reason, for `down`, `paused` and `refused`.
            progress:
              $ref: './protocol.yaml#/components/schemas/FetchProgress'
            context:
              type: integer
              minimum: 1
              description: |
                A managed seat's: the context, in tokens, its server took, as
                its node last reported (`SeatState.context`). Left out until
                it says. It is never more than the recipe's `context_length`,
                and a llama.cpp seat's is at most 32768.
            in_flight: { type: integer }
            problems:
              type: array
              description: What the coordinator sees wrong with it, e.g. a model not in the catalog or an archived account.
              items: { type: string }

    # ---- admin plane: changes --------------------------------------------

    Hub:
      type: object
      additionalProperties: false
      required: [port, topics]
      properties:
        port:
          type: integer
          description: The hub's port, on the host this api is reached at.
        topics:
          type: array
          items: { type: string, enum: [NodeObserved, InstanceBeat] }
          description: The topics a subscriber may follow.

    AdminEvent:
      description: One event on the admin stream. `data` is the resource as it now is.
      oneOf:
        - type: object
          required: [id, at, type, data]
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
            type: { type: string, const: node }
            data: { $ref: '#/components/schemas/Node' }
        - type: object
          required: [id, at, type, data]
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
            type: { type: string, const: seat }
            data: { $ref: '#/components/schemas/SeatView' }
        - type: object
          required: [id, at, type, data]
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
            type: { type: string, const: account }
            data: { $ref: '#/components/schemas/Account' }
        - type: object
          required: [id, at, type, data]
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
            type: { type: string, const: usage }
            data: { $ref: '#/components/schemas/UsageRecord' }
        - type: object
          required: [id, at, type, data]
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
            type: { type: string, const: change }
            data: { $ref: '#/components/schemas/Change' }
        - type: object
          required: [id, at, type, data]
          description: |
            A request offered to a seat, told once for each attempt; it runs
            until its `usage` event (same `data.id`) is told. A live view lights
            it meanwhile.
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
            type: { type: string, const: request }
            data:
              type: object
              required: [id, project, key, requested_model, seat, account, started_at]
              properties:
                id: { type: string, description: "The request's id, its usage record's." }
                project: { type: string }
                key: { type: string }
                requested_model: { type: string }
                seat: { type: string, description: 'The seat it is offered to, `<node>/<seat>`.' }
                account: { type: string }
                started_at: { type: string, format: date-time }
                instance:
                  type: [string, 'null']
                  description: The api instance that admitted it (`UsageRecord.instance`).
        - type: object
          required: [id, at, type, data]
          properties:
            id: { type: string }
            at: { type: string, format: date-time }
            type: { type: string, const: reset }
            data:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Why the stream cannot resume, e.g. the missed events are no longer held.

    Change:
      type: object
      required: [id, at, action, target]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        principal:
          type: [string, 'null']
          description: Who made it. Null while admin authentication is off, as in the MVP.
        action:
          type: string
          enum: [create, update, delete, archive, revoke, rotate]
        target:
          type: string
          description: The resource's path under `/admin/v1`.
          examples: [projects/work/budget, nodes/laptop, accounts/claude-work]
        before:
          type: [object, 'null']
          description: >
            The resource as it was; null for a create. A node's change holds
            the node's own fields, not its seats: each seat's changes are
            recorded under the seat's own target.
        after:
          type: [object, 'null']
          description: The resource as it became; null for a delete. A node's holds its own fields, as in `before`.

    # ---- health ---------------------------------------------------------

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        version: { type: string }
        checks:
          type: object
          description: Each dependency's state, on readiness.
          additionalProperties:
            type: string
            enum: [ok, unavailable]

    # ---- errors ---------------------------------------------------------

    Refusal:
      type: object
      description: A transport refusal, before or instead of the handler.
      required: [refusal]
      properties:
        refusal:
          type: object
          required: [kind, reason]
          properties:
            kind: { type: string, examples: [malformed, method_not_allowed, not_found] }
            reason: { type: string }

    AdminProblem:
      type: object
      description: |
        What a control-plane handler found wrong, in the contract's words:
        the error's `code`, a `message`, the request field at fault, and,
        for a store failure, the incident it was logged under.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - unsupported
            - request_too_large
            - context_length_exceeded
            - invalid_key
            - model_not_found
            - model_not_permitted
            - account_not_permitted
            - data_class_refused
            - previous_response_not_found
            - rate_limited
            - budget_exhausted
            - no_eligible_seat
            - no_capacity
            - metering_unavailable
            - upstream_failed
            - deadline_exceeded
            - not_found
            - conflict
            - internal_error
            - route_table_unavailable
        message: { type: string }
        param: { type: string, description: The request field at fault. }
        incident: { type: string, description: The id a store failure was logged under. }

    AdminInvalid:
      type: object
      required: [Invalid]
      additionalProperties: false
      properties:
        Invalid: { $ref: '#/components/schemas/AdminProblem' }

    AdminNotFound:
      type: object
      required: [NotFound]
      additionalProperties: false
      properties:
        NotFound: { $ref: '#/components/schemas/AdminProblem' }

    AdminConflict:
      type: object
      required: [Conflict]
      additionalProperties: false
      properties:
        Conflict: { $ref: '#/components/schemas/AdminProblem' }

    AdminUnavailable:
      description: |
        What the handler needs is unavailable (503, `Hale-Error-Class:
        unavailable`): the store, or, for readiness, the `Health` that says so.
      oneOf:
        - type: object
          required: [Unavailable]
          additionalProperties: false
          properties:
            Unavailable: { $ref: '#/components/schemas/AdminProblem' }
        - type: object
          required: [NotReady]
          additionalProperties: false
          properties:
            NotReady: { $ref: '#/components/schemas/Health' }

    ErrorResponse:
      type: object
      description: The Open Responses error envelope, with voice's codes and an optional `voice` object.
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type:
              type: string
              description: |
                The standard's types, plus `authentication_error` and
                `permission_error` for the admin plane and key checks.
              enum:
                - invalid_request
                - not_found
                - too_many_requests
                - server_error
                - model_error
                - authentication_error
                - permission_error
            code:
              type: string
              enum:
                - invalid_request
                - unsupported
                - request_too_large
                - context_length_exceeded
                - invalid_key
                - model_not_found
                - model_not_permitted
                - account_not_permitted
                - data_class_refused
                - previous_response_not_found
                - rate_limited
                - budget_exhausted
                - no_eligible_seat
                - no_capacity
                - metering_unavailable
                - upstream_failed
                - deadline_exceeded
                - not_found
                - conflict
                - internal_error
                - route_table_unavailable
            param:
              type: [string, 'null']
            voice:
              type: object
              properties:
                request_id: { type: string }
                limit:
                  description: The limit that refused the request, for `rate_limited`.
                  $ref: '#/components/schemas/Limit'
                budget:
                  description: The budget that refused the request, for `budget_exhausted`.
                  $ref: '#/components/schemas/Budget'
                attempts:
                  type: array
                  items:
                    $ref: '#/components/schemas/Attempt'
