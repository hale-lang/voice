  LinkCheckStatus_running = 0;
  LinkCheckStatus_passed = 1;
  LinkCheckStatus_failed = 2;
}

// Whether a node is up (`Node.status`).
enum NodeStatus {
  NodeStatus_pending = 0;
  NodeStatus_up = 1;
  NodeStatus_down = 2;
  NodeStatus_revoked = 3;
}

// `Accelerator.kind` (protocol.yaml).
enum AcceleratorKind {
  AcceleratorKind_cuda = 0;
  AcceleratorKind_rocm = 1;
  AcceleratorKind_vulkan = 2;
  AcceleratorKind_metal = 3;
}

// `Hardware.os` and `Hardware.arch` (protocol.yaml).
enum HostOs {
  HostOs_linux = 0;
  HostOs_darwin = 1;
}

enum HostArch {
  HostArch_arm64 = 0;
  HostArch_x86_64 = 1;
}

// Who chose a placement's variant (`Placement.chosen_by`).
enum PlacementChooser {
  PlacementChooser_coordinator = 0;
  PlacementChooser_operator = 1;
}

// An error's `code` (`ErrorResponse.error.code`).
enum ErrorCode {
  ErrorCode_invalid_request = 0;
  ErrorCode_unsupported = 1;
  ErrorCode_request_too_large = 2;
  ErrorCode_context_length_exceeded = 3;
  ErrorCode_invalid_key = 4;
  ErrorCode_model_not_found = 5;
  ErrorCode_model_not_permitted = 6;
  ErrorCode_account_not_permitted = 7;
  ErrorCode_data_class_refused = 8;
  ErrorCode_previous_response_not_found = 9;
  ErrorCode_rate_limited = 10;
  ErrorCode_budget_exhausted = 11;
  ErrorCode_no_eligible_seat = 12;
  ErrorCode_no_capacity = 13;
  ErrorCode_metering_unavailable = 14;
  ErrorCode_upstream_failed = 15;
  ErrorCode_deadline_exceeded = 16;
  ErrorCode_not_found = 17;
  ErrorCode_conflict = 18;
  ErrorCode_internal_error = 19;
  ErrorCode_route_table_unavailable = 20;
}

// Where a recipe or a runtime came from (`Recipe.origin`, `Runtime.origin`).
enum Origin {
  Origin_shipped = 0;
  Origin_operator = 1;
}

// A weight format (`RuntimeCreate.formats`, `RecipeVariant.format`).
// `exl3`: ExLlamaV3's quantized tensors, in safetensors files, which
// TensorFold serves.
enum ModelFormat {
  ModelFormat_safetensors = 0;
  ModelFormat_gguf = 1;
  ModelFormat_mlx = 2;
  ModelFormat_exl3 = 3;
}

// What a runtime runs on (`RuntimeCreate.accelerator`).
enum RuntimeAccelerator {
  RuntimeAccelerator_cuda = 0;
  RuntimeAccelerator_rocm = 1;
  RuntimeAccelerator_vulkan = 2;
  RuntimeAccelerator_metal = 3;
  RuntimeAccelerator_cpu = 4;
}

// How a runtime's server spans two nodes (`RuntimeCreate.multi_node`):
// `mp`, vLLM's own multi-node executor, with no Ray cluster; `lanes`,
// TensorFold's two ranks, the leader serving and the follower its lanes,
// which run only across two nodes.
enum MultiNode {
  MultiNode_mp = 0;
  MultiNode_lanes = 1;
}

// How a runtime's server reads a model's weights, when its image ships a
// loader faster than the server's default (`RuntimeCreate.load_format`):
// `fastsafetensors`, vLLM's `--load-format fastsafetensors`, which reads the
// files straight to the GPU rather than through lazily mapped pages.
enum LoadFormat {
  LoadFormat_fastsafetensors = 0;
}

// Where a runtime comes from (`RuntimeCreate.artifact.kind`).
enum ArtifactKind {
  ArtifactKind_container = 0;
  ArtifactKind_archive = 1;
}

// A seat's state as the admin plane sees it (`SeatView.status`): the node's report, `pending` until the node reports on the assignment that carries it, `offline` while the node is not up.
enum SeatStatus {
  SeatStatus_pending = 0;
  SeatStatus_offline = 1;
  SeatStatus_starting = 2;
  SeatStatus_fetching = 3;
  SeatStatus_up = 4;
  SeatStatus_down = 5;
  SeatStatus_disabled = 6;
  SeatStatus_paused = 7;
  SeatStatus_refused = 8;
}
