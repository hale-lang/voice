# voice's process model on one machine: Postgres, NATS, the api, the brain
# and a node, each its own process, as in docs/internals.md's MVP.
#
#   docker compose up --build
#
# The api answers on 127.0.0.1:8080 (the admin UI at /, the planes under
# it), the node's local API on 127.0.0.1:8081
# and NATS on 127.0.0.1:4222 (for a process run outside Compose); nothing
# else is published.
#
# The api hands each enrolling node a NATS address (--node-nats). Inside
# Compose that is `nats`, which only this network resolves. A node on
# another machine (or the workstation, outside Compose) needs the name it
# reaches this host by and a published port it can dial:
#
#   VOICE_NODE_HOST=voice.example.net VOICE_NATS_BIND=0.0.0.0 docker compose up -d
#
# VOICE_NATS_PORT publishes NATS on another host port (the container port
# stays 4222); it is the port in the advertised URL, so set it with
# VOICE_NODE_HOST.
#
# Placed on a host by a Hale habitat, the project is handed the host's
# name and listen address (HALE_DNA_HOST_NAME, HALE_DNA_HOST_LISTEN); they
# stand in for VOICE_NODE_HOST and VOICE_NATS_BIND when those are unset,
# and the listen address also publishes the api (VOICE_API_BIND overrides
# it) so callers and nodes on other machines reach it by the host's name.
# Every plane of the api takes a bearer: a project key on /v1, a node's
# enrollment token on /node/v1 and the operator token on /admin/v1. The
# node's local API stays on loopback.
#
# The operator token is minted by the api on its first start and kept in
# Postgres; it is never in the environment or a log. Print it with
#
#   docker compose exec api voice-api admin-token
#
# `migrate` brings the schema up to date (spec/store.md) and exits, and
# the api and the brain wait on it; the api keeps its configuration in
# Postgres and reaches the node over NATS; the brain publishes the route
# table. The node serves once it is created on the api and started with
# its token:
#
#   docker compose exec api voice-api admin-token | sed 's/^/Authorization: Bearer /' > admin.h
#   curl -X POST localhost:8080/admin/v1/nodes -H @admin.h -H 'content-type: application/json' -d '{"id": "local"}'
#   VOICE_ENROLLMENT_TOKEN=vn-... docker compose up -d node

name: voice

# The api, the brain and the node are one image, built once.
x-voice: &voice
  build: .
  image: voice:dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "voice", "-d", "voice"]
      interval: 2s
      timeout: 2s
      retries: 30

  nats:
    image: nats:2.11-alpine
    # a 12 MiB request fits a 16 MiB message (deploy/nats/nats.conf)
    command: ["-c", "/etc/nats/voice.conf"]
    volumes:
      - ./deploy/nats/nats.conf:/etc/nats/voice.conf:ro
    ports:
      - "${VOICE_NATS_BIND:-${HALE_DNA_HOST_LISTEN:-127.0.0.1}}:${VOICE_NATS_PORT:-4222}:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  # the schema, brought up to date once, before the api and the brain start
  migrate:
    <<: *voice
    command: ["voice-api", "migrate", "--database", "postgres://voice:voice@postgres:5432/voice?sslmode=disable", "--migrations", "/usr/share/voice/migrations"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *voice
    # the database `voice-api admin-token` reads the operator token from,
    # when it runs in this container (docker compose exec api ...)
    environment:
      VOICE_DATABASE_URL: postgres://voice:voice@postgres:5432/voice?sslmode=disable
    command: ["voice-api", "--host", "0.0.0.0", "--port", "8080", "--nats", "nats://nats:4222", "--node-nats", "nats://${VOICE_NODE_HOST:-${HALE_DNA_HOST_NAME:-nats}}:${VOICE_NATS_PORT:-4222}", "--ui", "/usr/share/voice/ui", "--recipes", "/usr/share/voice/recipes", "--runtimes", "/usr/share/voice/runtimes", "--database", "postgres://voice:voice@postgres:5432/voice?sslmode=disable"]
    ports:
      - "${VOICE_API_BIND:-${HALE_DNA_HOST_LISTEN:-127.0.0.1}}:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  brain:
    <<: *voice
    command: ["voice-brain", "--database", "postgres://voice:voice@postgres:5432/voice?sslmode=disable", "--nats", "nats://nats:4222"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      api:
        condition: service_started

  node:
    <<: *voice
    # the node `local`, created on the api (POST /admin/v1/nodes, under the
    # operator token), started
    # with the enrollment token that answered: VOICE_ENROLLMENT_TOKEN=vn-...
    environment:
      VOICE_ENROLLMENT_TOKEN: ${VOICE_ENROLLMENT_TOKEN:-}
    command:
      - voice-node
      - --id
      - local
      - --api
      - http://api:8080
      - --data
      - /var/lib/voice-node
      - --capabilities
      - /etc/voice/capabilities.json
      - --host
      - 0.0.0.0
      - --port
      - "8081"
    volumes:
      - node-data:/var/lib/voice-node
      - ./deploy/node/capabilities.json:/etc/voice/capabilities.json:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres:
  node-data:
