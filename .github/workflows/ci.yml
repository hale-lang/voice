# One job per process in the model (api, brain, node), run in parallel, plus
# the contracts and the image. Each process job is its own job rather than
# a matrix entry so it can be split further on its own later.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hale
      - name: Format
        run: hale fmt --check api store lib
      - name: No print outside the logger (std::log; its sink, lib/logfmt, and tests apart)
        run: |
          if grep -rnE --include='*.hl' --exclude-dir=tests --exclude-dir=logfmt --exclude=install.hl '\b(e?print(ln)?)\s*\(' api brain node store lib | grep -vE '^[^:]+:[0-9]+:\s*//'; then
            echo "a bare print outside std::log (docs/internals.md, Logs)"; exit 1
          fi
      - name: Verify
        run: hale verify api && hale verify store
      - name: Test
        run: hale test api && hale test store
      - name: Build
        run: hale build api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle the contract
        run: |
          mkdir -p build
          npm ci --prefix spec/tools/redocly --no-audit --no-fund && spec/tools/redocly/node_modules/.bin/redocly bundle spec/openapi.yaml --dereferenced -o build/openapi.bundled.json
      - name: The committed surface bundle is the surface's, file for file, and its gaps from the contract are the committed ones
        run: |
          hale api export --surface Voice --check api/bundle api
          # no file in api/bundle that the export does not write
          fresh=$(mktemp -d)
          hale api export --surface Voice --out "$fresh/bundle" api >/dev/null
          diff -r "$fresh/bundle" api/bundle
          cd spec/validate && npm ci && node bundle.mjs ../../build/openapi.bundled.json ../../api/bundle/Voice.openapi.json ../../api/gaps.json
      - name: The fit refuses what it must (spec/validate/negative)
        run: cd spec/validate && npm run bundle-negative
      - name: Every endpoint answers its happy path, live
        run: |
          api/api --port 8080 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 0.2; done
          cd spec/validate && npm ci && npm run live -- http://127.0.0.1:8080

  brain:
    name: brain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hale
      - name: Format
        run: hale fmt --check brain
      - name: Verify
        run: hale verify brain
      - name: Test
        run: hale test brain
      - name: Build
        run: hale build brain

  node:
    name: node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hale
      - name: Format
        run: hale fmt --check node
      - name: Verify
        run: hale verify node
      - name: Test
        run: hale test node
      - name: Build
        run: hale build node
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle the contract
        run: |
          mkdir -p build
          npm ci --prefix spec/tools/redocly --no-audit --no-fund && spec/tools/redocly/node_modules/.bin/redocly bundle spec/node.yaml --dereferenced -o build/node.bundled.json
      - name: The local API answers node.yaml, live
        run: |
          node/node --id ci --data build/node-data --capabilities deploy/node/capabilities.json --port 8081 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8081/healthz >/dev/null 2>&1 && break; sleep 0.2; done
          cd spec/validate && npm ci && npm run node-live -- http://127.0.0.1:8081

  # The proof the node builds and runs on macOS (docs/node-on-a-mac.md): the
  # hale toolchain built at the commit in hale.pin, no Postgres, no NATS, no compose.
  node-macos:
    name: node (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hale
      - name: Build
        run: hale build node
      - name: Test (engine, compat, claude, capabilities, assignment)
        # engine_memory_test reads /proc/self/status, which macOS has not:
        # it is left to the Linux job
        run: |
          for f in node/tests/*_test.hl; do
            case "$f" in
              */engine_memory_test.hl) echo "skip $f: reads /proc (Linux only)"; continue ;;
            esac
            hale test "$f" || exit 1
          done
      - name: The built node runs
        run: |
          # no --id: the node names its usage and exits 2
          set +e
          node/node 2>build-node-usage.txt
          code=$?
          cat build-node-usage.txt
          [ "$code" = 2 ] && grep -q 'usage: node --id' build-node-usage.txt
      - name: The built node starts with the Mac example and answers its local API
        run: |
          mkdir -p build
          node/node --id ci-mac --data build/node-data --capabilities deploy/node/capabilities.mac.json --port 8081 &
          pid=$!
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8081/node/v1/capabilities >/tmp/caps.json 2>/dev/null && break; sleep 0.2; done
          kill $pid
          grep -q claude-cli /tmp/caps.json && grep -q openai-compatible /tmp/caps.json
      - name: The node installs as a launchd user agent and is removed (docs/node-on-a-mac.md)
        run: |
          hale build api
          # a fake ollama: its models are the seats the node offers
          mkdir -p build/fake-bin
          printf '#!/bin/sh\necho "NAME ID SIZE MODIFIED"\necho "llama3.2:latest abc 2GB now"\n' > build/fake-bin/ollama
          chmod +x build/fake-bin/ollama
          export PATH="$PWD/build/fake-bin:$PATH"
          api/api --port 8080 --nats "" &
          api_pid=$!
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 0.2; done
          node/node install --id ci-mac --api http://127.0.0.1:8080 --node-bin "$PWD/node/node" \
            --data "$PWD/build/ci-node-data" --vault "$PWD/build/ci-vault" --port 8082 --no-start | tee install.txt
          grep -q 'seat ci-mac/ollama-llama3-2-latest serves llama3.2:latest' install.txt
          grep -q '^key     vk-' install.txt
          plist="$HOME/Library/LaunchAgents/net.hale-lang.voice-node.ci-mac.plist"
          plutil -lint "$plist"
          grep -q 'ci-node-data' "$plist"
          curl -fsS http://127.0.0.1:8080/admin/v1/nodes/ci-mac/seats | grep -q '"ref": "ci-mac/ollama-llama3-2-latest"'
          node/node uninstall --id ci-mac
          test ! -e "$plist"
          # the agent itself: a runner may have no user session to load it into
          if node/node install --id ci-mac2 --api http://127.0.0.1:8080 --node-bin "$PWD/node/node" \
               --data "$PWD/build/ci-node-data2" --vault "$PWD/build/ci-vault2" --port 8083; then
            launchctl print "gui/$(id -u)/net.hale-lang.voice-node.ci-mac2" | grep -q 'state'
          else
            echo "::warning::launchctl could not load a user agent on this runner"
          fi
          node/node uninstall --id ci-mac2
          kill $api_pid

  e2e:
    name: end to end
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
          POSTGRES_DB: voice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice -d voice"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hale
      - name: Build
        run: hale build api && hale build node && hale build brain
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle the contracts
        run: |
          mkdir -p build
          npm ci --prefix spec/tools/redocly --no-audit --no-fund && spec/tools/redocly/node_modules/.bin/redocly bundle spec/openapi.yaml --dereferenced -o build/openapi.bundled.json
          spec/tools/redocly/node_modules/.bin/redocly bundle spec/node.yaml --dereferenced -o build/node.bundled.json
          cd spec/validate && npm ci
      # the script runs NATS in a container of its own, so it can stop it
      # and check that a node recovers the assignment it missed meanwhile
      - name: A node enrolls and serves, recovers an assignment lost while NATS is down, and fails over after a slow failure, over the Postgres store
        env:
          DATABASE_URL: postgres://voice:voice@127.0.0.1:5432/voice?sslmode=disable
        run: scripts/e2e.sh
      - name: The Postgres store answers as the memory store does, reads a full page in linear memory, and the brain works over it
        env:
          VOICE_TEST_DATABASE_URL: postgres://voice:voice@127.0.0.1:5432/voice?sslmode=disable
        run: hale test store && hale test brain
      - name: Two api instances on one Postgres lose no write, and two migrations at once both succeed
        env:
          DATABASE_URL: postgres://voice:voice@127.0.0.1:5432/voice?sslmode=disable
        run: scripts/race.sh

  ui:
    name: ui
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Typecheck tokens, components and the app against the contract
        run: npm run typecheck
      - name: Network relationship and request-path tests
        run: npm run test -w @voice/admin
      - name: Build
        run: npm run build

  specs:
    name: contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: openapi.yaml and node.yaml are valid
        run: npm ci --prefix spec/tools/redocly --no-audit --no-fund && spec/tools/redocly/node_modules/.bin/redocly lint spec/openapi.yaml spec/node.yaml
      - name: protocol.yaml and internal.yaml are valid
        run: |
          npm ci --prefix spec/tools/asyncapi --no-audit --no-fund
          spec/tools/asyncapi/node_modules/.bin/asyncapi validate spec/protocol.yaml
          spec/tools/asyncapi/node_modules/.bin/asyncapi validate spec/internal.yaml

  store:
    name: store
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: voice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - name: The schema in spec/store.md applies to Postgres
        # every sql block of the contract that names no transaction
        # parameter: the tables, their keys and their checks; the store
        # seed's migrations must match it
        env:
          PGPASSWORD: voice
        run: |
          awk '/^```sql/{b="";f=1;next} /^```/{if(f && b !~ /\$/) printf "%s", b; f=0; next} f{b=b $0 "\n"}' spec/store.md > store.sql
          test -s store.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -f store.sql
      - name: The api's migrations are that schema, in order
        run: cat store/migrations/*.sql | cmp - store.sql

  # voice grafted as a sapling (`hale habitat graft voice`) is a fetched
  # revision: no checkout of ours, no build output. Take a fresh clone of
  # this tree into an empty directory, run the migration exactly as
  # hale.toml states it against Postgres, and build the compose images.
  sapling:
    name: sapling (fresh clone)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
          POSTGRES_DB: voice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice -d voice"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hale
      - name: A fresh clone holds no build output
        run: |
          fresh=$(mktemp -d)
          git clone --quiet "$GITHUB_WORKSPACE" "$fresh/voice"
          echo "FRESH=$fresh/voice" >> "$GITHUB_ENV"
          test ! -e "$fresh/voice/api/api"
      - name: The migration runs as hale.toml states it, twice (the second applies nothing)
        env:
          HALE_DNA_DATABASE_DSN: postgres://voice:voice@127.0.0.1:5432/voice?sslmode=disable
        run: |
          cd "$FRESH"
          for pass in 1 2; do
            python3 - "$RUNNER_TEMP/migrate.$pass.log" <<'PY'
          import subprocess, sys, tomllib
          with open("hale.toml", "rb") as f:
              cmd = tomllib.load(f)["dna"]["migrations"]["database"]["command"]
          print("running:", cmd)
          out = subprocess.run(cmd, check=True, capture_output=True, text=True)
          open(sys.argv[1], "w").write(out.stdout + out.stderr)
          print(out.stdout + out.stderr)
          PY
          done
          n=$(ls store/migrations/*.sql | wc -l)
          grep -q "applied=$n version=$n" "$RUNNER_TEMP/migrate.1.log"
          grep -q "applied=0 version=$n" "$RUNNER_TEMP/migrate.2.log"
          test -z "$(git status --porcelain --untracked-files=all)" || { git status --short; exit 1; }
      - name: The compose images build from the same clone
        run: |
          mkdir -p "$FRESH/.hale-toolchain"
          cp ~/.hale/bin/hale ~/.hale/bin/libhale_ts_shim.a "$FRESH/.hale-toolchain/"
          cd "$FRESH" && docker compose build

  image:
    name: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hale
      - name: Hand the built hale to the image build (.hale-toolchain/)
        run: |
          mkdir -p .hale-toolchain
          cp ~/.hale/bin/hale ~/.hale/bin/libhale_ts_shim.a .hale-toolchain/
      - name: Build the image and bring the process model up
        run: |
          docker compose build
          docker compose up -d --wait --wait-timeout 120
          docker compose ps
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8081/node/v1/status
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Down
        if: always()
        run: docker compose down -v
