message ArrangementRole {
  optional string id = 1;
  optional string title = 2;
  optional string annotation = 3;
  optional string alias = 4;
  repeated string candidates = 5; // Hale: at most 32
}

// `ArrangementRoleWant`: a role to fill, `count` times; `priority` 1 is
// filled first, and a role with none after those with one.
message ArrangementRoleWant {
  optional string role = 1;
  optional int64 priority = 2;
  optional int64 count = 3;
}

message ArrangementRoles {
  repeated ArrangementRole data = 1; // Hale: at most 16
}

// `ArrangementWants`.
message ArrangementWants {
  repeated ArrangementPin pins = 1; // Hale: at most 8
  repeated ArrangementRoleWant roles = 2; // Hale: at most 16
}

