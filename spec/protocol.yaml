asyncapi: 3.0.0
info:
  title: voice node protocol
  version: '2'
  description: |
    How a node and the coordinator talk. This is the seam a node
    implementation plugs into: a node that speaks this protocol and the
    node plane of `openapi.yaml` can join voice, whatever it is written in.
    `node.yaml` is only the local API of voice's own node.

    Two channels, by shape:

    - **HTTP, the node plane of the api** (`openapi.yaml`, tag `node`):
      everything one-shot. The node registers on start, presenting its
      enrollment token, and gets its assignment and where NATS is. It reports
      its state by HTTP writes: heartbeats, seat states, quota windows,
      capability and local-control changes, draining. It can read its
      current assignment any time.
    - **NATS, this document:** everything pushed or streamed. The
      coordinator publishes assignments, requests to serve and cancels on
      the node's own subject; the node streams each request's events and
      result to the reply subject that request named.

    NATS is on the private network with the nodes and the coordinator's
    processes; only the api is exposed. A node connects to NATS with its own
    credentials, and its permissions confine it to its own subject and the
    reply subjects it is handed.

    Inside `serve`, the request and its events are Open Responses
    (`2026-04-24`), taken by reference from the vendored standard. The
    standard's shapes are OpenAPI 3.1 schemas, which AsyncAPI's schema
    formats cannot hold; where a field carries one, `x-voice-schema` points
    at it in the vendored document, and both sides validate against that.

    ## Who decides what

    - **The node decides what is possible.** Its operator lists, on the
      machine, the engines it offers (each with the login it uses) and its
      hard limits. The node declares these when it registers. The logins
      never leave the machine.
    - **The coordinator decides what runs.** It holds the desired seats for
      every node, configured through its admin API, and publishes them to
      the node as an `assignment`. The node runs exactly the assigned seats
      and refuses any seat outside its capabilities.
    - **Local controls only restrict.** The node's operator may pause the
      node, pause a seat, or lower the node's in-flight cap on the machine.
      Nothing local can widen what the coordinator assigned.

    A node's effective in-flight cap is the smallest of its declared
    `max_in_flight`, the cap the coordinator sets, and any local cap. Each
    seat is further held to its own `concurrency`.

    ## Session

    1. The node registers (`POST /node/v1/register`) with its id, version,
       capabilities and local controls. One live node per id: registering
       again replaces the earlier registration, so a restarted node takes
       over from its own ghost. The answer carries the heartbeat interval,
       the NATS address, and the current assignment.
    2. The node applies the assignment (starting, reconfiguring and stopping
       seats to match it), subscribes to `voice.node.<id>.>`, and reports
       every assigned seat's state (`POST /node/v1/seats`), including the
       seats it refused and why.
    3. From then on:
       - The coordinator publishes `assign` with the whole desired state
         whenever it changes. Each assignment carries a `version`; the node
         applies the newest and reports seat states for that version.
       - The node reports seat states whenever one changes, and heartbeats
         every interval (`POST /node/v1/heartbeat`) with every seat's state
         and load. The coordinator marks a node `down` after three intervals
         with nothing received, and fails its in-flight requests as seat
         failures.
       - The node reports capabilities when its operator changes what it
         offers (`PUT /node/v1/capabilities`) and local controls when they
         change (`PUT /node/v1/local`). The coordinator re-checks the
         assignment against them.
       - The node reports quota windows when an engine returns them
         (`POST /node/v1/quota`). The static engine never does.
       - Before a deliberate shutdown the node posts `draining`. The
         coordinator sends it no new requests, and the node exits once every
         in-flight request has its result.

    A node that was offline gets its assignment when it registers again:
    configuration made while a node is away takes effect when it returns.

    ## Serving

    - The coordinator publishes `serve` on `voice.node.<id>.serve` as a NATS
      request: the node replies at once with `accepted` or `refused`
      (unknown, paused or refused seat; seat or node full; engine down). No
      reply within the timeout, or `refused`, is a seat failure and the
      coordinator claims another slot. It never sends a seat more requests
      than its `concurrency`, or the node more than its effective cap.
    - The node then publishes the standard's streaming events, in order, to
      `<reply_to>.event`, and exactly one `result` to `<reply_to>.result`.
      It uses the `request_id` as the response's `id`. Events for one
      request never reorder.
    - Usage is the standard's `usage` on the terminal event's response, where
      `input_tokens` includes cached input. What the standard does not carry
      travels in `result`: the model as the engine reported it, cache writes,
      timing, and quota windows.
    - The coordinator publishes `cancel` when the caller goes away or the
      deadline passes. The node stops the engine and publishes its `result`,
      with outcome `cancelled` unless the request finished first.
    - A node that loses NATS abandons its in-flight requests; the
      coordinator, seeing no result, treats each as a seat failure: retried
      elsewhere if nothing had reached the caller, failed otherwise.
    - The coordinator retries a failed request on another seat only when
      `retryable` is true and no output has reached the caller. A
      `quota_exhausted` failure also marks the account exhausted until the
      reset in the result's quota windows.

    ## Subjects

    `voice.node.<node>.assign`, `voice.node.<node>.serve`,
    `voice.node.<node>.cancel` are the node's, and it subscribes to
    `voice.node.<node>.>`. `<reply_to>` is chosen by the api instance that
    published the `serve` and is unique per request. A node's NATS
    permissions allow subscribing to its own subject and publishing to reply
    subjects, nothing else.

    Grafted into a DNA habitat, voice's NATS is the habitat's broker, and
    every subject is under the prefix its account is granted: `voice.` is
    replaced by `heart.<id>.` (`heart.<id>.node.<node>.serve`,
    `heart.<id>.reply.…`, `heart.<id>.route`), and a request's reply inbox is
    under the inbox prefix handed over, or under the same prefix. A node
    learns its subject at registration (`nats.subject`), so it follows.
  contact:
    url: https://github.com/hale-lang/voice

defaultContentType: application/json

servers:
  nats:
    host: nats:4222
    protocol: nats
    description: The private network's NATS. Its address is part of the node's registration answer.

channels:
  assign:
    address: voice.node.{node}.assign
    parameters:
      node: { $ref: '#/components/parameters/node' }
    messages:
      assign: { $ref: '#/components/messages/assign' }
  serve:
    address: voice.node.{node}.serve
    parameters:
      node: { $ref: '#/components/parameters/node' }
    messages:
      serve: { $ref: '#/components/messages/serve' }
  serveReply:
    address: null
    description: The NATS reply inbox of a `serve` request.
    messages:
      serveAck: { $ref: '#/components/messages/serveAck' }
  cancel:
    address: voice.node.{node}.cancel
    parameters:
      node: { $ref: '#/components/parameters/node' }
    messages:
      cancel: { $ref: '#/components/messages/cancel' }
  event:
    address: '{reply_to}.event'
    parameters:
      reply_to: { $ref: '#/components/parameters/reply_to' }
    messages:
      event: { $ref: '#/components/messages/event' }
  result:
    address: '{reply_to}.result'
    parameters:
      reply_to: { $ref: '#/components/parameters/reply_to' }
    messages:
      result: { $ref: '#/components/messages/result' }

operations:
  receiveAssign:
    action: receive
    channel: { $ref: '#/channels/assign' }
    summary: The node's whole desired state, after any change.
  receiveServe:
    action: receive
    channel: { $ref: '#/channels/serve' }
    summary: Serve one request on one seat; answer accepted or refused at once.
    reply:
      channel: { $ref: '#/channels/serveReply' }
      address:
        location: '$message.header#/replyTo'
  receiveCancel:
    action: receive
    channel: { $ref: '#/channels/cancel' }
    summary: Stop serving a request.
  sendEvent:
    action: send
    channel: { $ref: '#/channels/event' }
    summary: One standard streaming event for a request.
  sendResult:
    action: send
    channel: { $ref: '#/channels/result' }
    summary: How a request ended. Exactly one per request, always last.

components:
  parameters:
    node:
      description: The node's id.
    reply_to:
      description: The reply subject prefix a `serve` named.

  messages:
    assign:
      name: assign
      payload: { $ref: '#/components/schemas/Assign' }
    serve:
      name: serve
      payload: { $ref: '#/components/schemas/Serve' }
    serveAck:
      name: serve_ack
      payload: { $ref: '#/components/schemas/ServeAck' }
    cancel:
      name: cancel
      payload: { $ref: '#/components/schemas/Cancel' }
    event:
      name: event
      payload: { $ref: '#/components/schemas/Event' }
    result:
      name: result
      payload: { $ref: '#/components/schemas/Result' }

  schemas:
    RequestId:
      type: string
      description: The coordinator's request id; the usage record's id and the response's `id`.

    Slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'

    Capabilities:
      type: object
      description: |
        What the node can run, as its operator configured it on the machine.
        The coordinator assigns seats only within it, and the node refuses
        any seat outside it.
      required: [engines, max_in_flight]
      properties:
        engines:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/Engine' }
        max_in_flight:
          type: integer
          minimum: 1
          description: The most requests the node will serve at once, across all its seats.
        hardware:
          $ref: '#/components/schemas/Hardware'

    Hardware:
      type: object
      description: |
        What the machine has, as the node measures it when it declares its
        capabilities: the machine describing itself, so a model can be
        placed where it fits. Nothing here is a control. A node that does
        not measure leaves it out, and no model is placed on it.
      required: [os, arch, memory_bytes, model_memory_bytes, accelerators, disk_free_bytes]
      properties:
        os:
          type: string
          enum: [linux, darwin]
        arch:
          type: string
          enum: [arm64, x86_64]
        memory_bytes:
          type: integer
          minimum: 1
          description: The machine's memory.
        model_memory_bytes:
          type: integer
          minimum: 0
          description: |
            What models may use of it: `memory_bytes`, unless the node's
            operator holds some back in the capabilities file, which only
            lowers it.
        accelerators:
          type: array
          maxItems: 16
          description: At most 16; a machine with more declares its first 16, and its node says so in its log.
          items: { $ref: '#/components/schemas/Accelerator' }
        disk_free_bytes:
          type: integer
          minimum: 0
          description: Free space under the node's data directory, where weights are kept.

    Accelerator:
      type: object
      required: [kind, name, memory_bytes, unified]
      properties:
        kind:
          type: string
          enum: [cuda, metal]
        name:
          type: string
          examples: [NVIDIA GB10, Apple M1 Max]
        memory_bytes:
          type: integer
          minimum: 0
          description: Its own memory; with `unified`, the machine's, which it shares.
        unified:
          type: boolean
          description: True when it shares the machine's memory (Apple silicon, NVIDIA GB10) rather than having its own.

    Engine:
      type: object
      description: |
        One engine the node offers: a kind of engine with the login it runs
        under. Two logins for one CLI are two engines. How the login is held
        is local to the node and is never declared.

        Whether a seat carries `tools` is derived from its kind, not
        declared: an `openai-compatible` seat does, a `static` seat only
        with its `tool_call` drill, any other kind never. A `serve` whose
        request lists `tools` for a seat that does not carry them is
        `refused` before any event, a seat failure, so the coordinator
        offers the request to the next seat.
      required: [id, kind, config_schema]
      properties:
        id:
          $ref: '#/components/schemas/Slug'
          description: Unique on the node; seats name it.
          examples: [static, claude-work, claude-personal]
        kind:
          type: string
          description: |
            What runs, e.g. `static`, `claude-cli`, `codex-cli`, `agy`, or
            `managed`: a model the coordinator placed on the node, whose
            weights and runtime the node fetches and verifies itself
            (`ManagedConfig`).
          examples: [static, claude-cli]
        description: { type: string }
        models:
          type: [array, 'null']
          description: The engine's own names for the models it can run, when it knows them. Null when any name may be tried.
          items: { type: string }
        config_schema:
          type: object
          description: |
            JSON Schema of the `config` a seat on this engine takes. The
            coordinator checks seats against it, and a UI renders it as a
            form. The static engine's is `StaticConfig`, the openai-compatible
            engine's `OpenAICompatibleConfig`, the claude-cli engine's
            `ClaudeCliConfig`, the managed engine's `ManagedConfig`.

    ManagedConfig:
      type: object
      description: |
        A managed seat's config, which the coordinator writes when the
        operator places a model on the node (openapi.yaml `Placement`):
        everything the node needs, pinned, so it looks nothing up. The
        node fetches each of the variant's files from the hub, at the
        variant's revision, and the runtime's archive, and uses a file only
        when its sha256 matches. Where the hub is and the token it takes
        are the node's own (its managed engine's `local` object), never
        the coordinator's.
      required: [placement, model, variant, runtime]
      properties:
        placement:
          type: string
          description: The placement this seat serves.
        model:
          type: string
          description: The catalog model it serves, the name its server answers to.
        variant:
          $ref: './openapi.yaml#/components/schemas/RecipeVariant'
        runtime:
          $ref: './openapi.yaml#/components/schemas/RuntimeCreate'

    StaticConfig:
      type: object
      description: |
        The static engine's seat config. It answers every request with
        `text`. Tokens are counted as one per four characters, rounded up, of
        the input and of `text`.
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        chunk_chars:
          type: integer
          minimum: 1
          default: 16
          description: Characters per streamed delta.
        first_output_ms:
          type: integer
          minimum: 0
          default: 0
          description: Delay before the first output, to exercise timing and deadlines.
        chunk_interval_ms:
          type: integer
          minimum: 0
          default: 0
        fail_after_ms:
          type: integer
          minimum: 0
          default: 0
          description: |
            A drill: every request fails this long after it is accepted,
            before any output, as a retryable `engine_failed`, so the
            coordinator offers it to the next seat. 0 never fails.
        tool_call:
          type: object
          description: |
            A drill: every request is answered by a call to this tool, a
            `function_call` output item with these `arguments` (a JSON
            text), instead of with `text`. A static seat without it
            refuses a request that lists `tools`.
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            arguments: { type: string, default: '{}' }

    OpenAICompatibleConfig:
      type: object
      description: |
        The openai-compatible engine's seat config: a seat that proxies to a
        server speaking the chat-completions wire (Ollama, LM Studio, the
        llama.cpp server, or a hosted one). The request's `instructions` and
        `input` are sent as `messages` to `<base_url>/chat/completions` with
        `stream: true`; the upstream's chunks come back as the standard's
        events, and its final `usage` is the run's usage (one token per four
        characters when it sends none). An http upstream is relayed
        as it streams, each event published when its chunk is complete; an
        https upstream is read to the end of its stream first. A refused or unreachable
        upstream, an error status, a stream that ends or stays silent for 120 s before its end, or a stream with no output fails the seat
        before any event is published, so the
        coordinator offers the request to the next seat. A finish reason of
        `length` ends the run `incomplete`. The request's `tools`, `tool_choice` and
        `parallel_tool_calls` are sent as the chat-completions wire names them
        (each tool's JSON Schema byte for byte), `function_call` input items as
        an assistant message's `tool_calls` and `function_call_output` items as
        `tool` messages. The upstream's streamed `delta.tool_calls` come back as
        a `function_call` output item: `response.output_item.added` when a
        call's index first appears, a `response.function_call_arguments.delta`
        per argument fragment as it arrives, then `response.function_call_arguments.done`
        and `response.output_item.done`. Calls arrive in index order; an
        interleaved one fails the seat.
      required: [base_url, model]
      properties:
        base_url:
          type: string
          pattern: '^https?://'
          description: The upstream's API root, such as `http://localhost:11434/v1`.
        model:
          type: string
          minLength: 1
          description: The upstream's own name for the model it runs.
        api_key_vault:
          type: string
          description: |
            The `std::secret` vault entry holding the API key, sent as a
            bearer token. The key is read into the request and is never
            logged, played or returned. Absent for an upstream with no key.
        input_per_mtok_micros:
          type: integer
          minimum: 0
          default: 0
          description: What the seat charges per million input tokens, in micros. 0 for a local server.
        output_per_mtok_micros:
          type: integer
          minimum: 0
          default: 0
          description: What the seat charges per million output tokens, in micros.

    ClaudeCliConfig:
      type: object
      description: |
        The claude-cli engine's seat config: a seat that runs `claude -p
        --output-format stream-json` as a child process, the request's
        `instructions` and `input` as its prompt on stdin, under the
        account's login. The login is the long-lived OAuth token `claude
        setup-token` prints, held in the node's vault and handed to the child
        only through its environment (`CLAUDE_CODE_OAUTH_TOKEN`), never its
        argv. The child runs with no tools. Its text deltas come back as the
        standard's events as they arrive, and its final `usage` is the run's
        usage (cache tokens counted as input). The seat is flat-rate: the
        run's cost is 0 and the account's own limits are its only cap. A
        missing binary, a nonzero exit or an error result (an expired or
        refused token among them) before any output, a run silent for 300 s,
        or one with no output fails the seat before any event is published,
        so the coordinator offers the request to the next seat. A stop reason
        of `max_tokens` ends the run `incomplete`. Cancelling the request
        stops the child.
      required: [token_vault]
      properties:
        token_vault:
          type: string
          minLength: 1
          description: |
            The `std::secret` vault entry holding the account's token. It is
            never logged, played or returned.
        model:
          type: string
          description: The CLI's own name or alias for the model; its default when absent.

    LocalControls:
      type: object
      description: |
        What the node's operator set on the machine. Each field only
        restricts: a paused node or seat takes no new requests, and a local
        cap only lowers the effective one.
      required: [paused, paused_seats]
      properties:
        paused: { type: boolean }
        paused_seats:
          type: array
          maxItems: 32
          items: { type: string }
        max_in_flight:
          type: [integer, 'null']
          minimum: 0
          description: A local cap on requests in flight, or null for none.
        reason:
          type: [string, 'null']
          description: Why, for the admin to read.

    Seat:
      type: object
      description: |
        One seat as the coordinator assigns it: an engine the node offers,
        spending one account, serving some catalog models.
      required: [id, engine, account, serves]
      properties:
        id:
          $ref: '#/components/schemas/Slug'
          description: Unique on the node. Its full name is `<node>/<seat>`.
        engine:
          type: string
          description: The id of one of the node's declared engines.
        account:
          type: string
          description: The coordinator account this seat spends. Several seats, on one node or many, may name the same account and share its limits.
        serves:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SeatModel' }
        data_classes:
          type: array
          description: Data classes this seat may carry. Defaults to `[internal]`.
          items: { type: string }
        concurrency:
          type: integer
          minimum: 1
          default: 1
          description: Requests this seat serves at once.
        enabled:
          type: boolean
          default: true
        config:
          type: object
          description: Engine-specific, valid against the engine's `config_schema`.

    SeatModel:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: A catalog model id.
        as:
          type: [string, 'null']
          description: The engine's own name for it, when that differs, e.g. `sonnet` for `claude-sonnet-5`.

    Assignment:
      type: object
      description: Everything the coordinator wants the node to run. The whole state each time, never a diff.
      required: [version, max_in_flight, seats]
      properties:
        version:
          type: integer
          description: Increases with every change. The node applies the newest it has.
        max_in_flight:
          type: integer
          minimum: 1
          description: The coordinator's cap for this node, at most the node's declared `max_in_flight`.
        seats:
          type: array
          maxItems: 16
          description: A seat the node is running and this list leaves out is stopped once its in-flight requests finish.
          items: { $ref: '#/components/schemas/Seat' }

    SeatState:
      type: object
      description: One assigned seat's state on the node.
      required: [id, status, in_flight]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [starting, fetching, up, down, disabled, paused, refused]
          description: |
            `fetching`: a managed seat whose weights or runtime the node is
            fetching and verifying; `progress` says how far. `starting`, for
            a managed seat: its server is loading the model. `down`: the
            engine cannot serve, e.g. its CLI is missing or logged out, or a
            managed seat's file did not verify. `paused`: a local control
            holds it. `refused`: the seat is outside the node's
            capabilities, e.g. an engine it does not offer or a config its
            engine rejects; `reason` says which.
        reason: { type: [string, 'null'] }
        progress:
          $ref: '#/components/schemas/FetchProgress'
        context:
          type: integer
          minimum: 1
          description: |
            A managed seat's server, once it answers: the context, in tokens,
            it took (llama-server's `n_ctx`, vLLM's `max_model_len`). Left out
            until it says.
        in_flight: { type: integer, minimum: 0 }

    FetchProgress:
      type: object
      description: How far a managed seat's fetch is, in bytes, across its files and its runtime's archive.
      required: [done_bytes, total_bytes]
      properties:
        done_bytes: { type: integer, minimum: 0 }
        total_bytes: { type: integer, minimum: 0 }

    Serve:
      type: object
      required: [type, request_id, seat, model, body, reply_to]
      properties:
        type: { type: string, const: serve }
        request_id: { $ref: '#/components/schemas/RequestId' }
        reply_to:
          type: string
          description: |
            The subject prefix the node answers on: events to `<reply_to>.event`,
            the result to `<reply_to>.result`. It names the api instance
            holding the caller, so the answer needs no routing.
        seat:
          type: string
          description: The seat's id on this node.
        model:
          type: string
          description: The catalog model id the caller named.
        engine_model:
          type: [string, 'null']
          description: The seat's own name for the model (`as`), when it has one.
        deadline:
          type: [string, 'null']
          format: date-time
        endpoint:
          type: string
          enum: [responses, systemone]
          default: responses
          description: |
            What `body` is. `responses` (the default): the standard request
            below. `systemone`: a decision model's request (the api's
            `contract: decision`), `{"state", "questions": {<id>: {"type":
            "choice" | "noul" | "score", "instructions", "criteria"?}}}` as a
            Jev-style `POST /v1/systemone` takes it. An `openai-compatible`
            seat serves one: it posts the body whole to `<base_url>/systemone`,
            `model` set to the seat's own name for the model, and answers with
            one `systemone.answer` event (`SystemOneAnswer`) and the result. So
            does a managed seat whose runtime's server is `jev-style`, posting
            to its own server on loopback (`/v1/systemone`); such a seat
            answers `failed` to any other request ("this seat serves only a
            decision model's requests"). Any other seat answers `failed`
            ("this seat serves no decision model") so the coordinator moves on. An upstream that
            refuses it fails the run with its own error, its code kept
            (`the upstream answered 422 (invalid_question): …`).
        body:
          description: |
            The standard request, as the coordinator will serve it: Chat
            Completions requests arrive converted, and `voice`, `stream`,
            `stream_options` and `background` are removed. It is always
            streamed on this connection. With `endpoint: systemone`, a
            decision model's request instead (see `endpoint`).
          type: object
          x-voice-schema: './vendor/open-responses/openapi.json#/components/schemas/CreateResponseBody'

    Event:
      type: object
      required: [type, request_id, event]
      properties:
        type: { type: string, const: event }
        request_id: { $ref: '#/components/schemas/RequestId' }
        event:
          description: |
            Any standard streaming event; for a `serve` with `endpoint:
            systemone`, the one `systemone.answer` event (`SystemOneAnswer`).
          type: object
          required: [type]
          x-voice-schema: './vendor/open-responses/openapi.json#/paths/~1responses/post/responses/200/content/text~1event-stream/schema'

    SystemOneAnswer:
      type: object
      description: |
        A decision model's answer (`serve` with `endpoint: systemone`), the
        only event of its run: the upstream's systemone answer, whole. Its
        `model` is the result's `served.model`; the coordinator reads
        `answer.usage.input_tokens` for the request's input tokens (a decision
        model writes none).
      required: [type, answer]
      properties:
        type: { type: string, const: systemone.answer }
        answer:
          type: object
          required: [answers]
          properties:
            model: { type: string }
            answers:
              type: object
              description: Each question's answer by its id, as the upstream gave it.
            usage:
              type: object
              properties:
                input_tokens: { type: integer, minimum: 0 }

    Result:
      type: object
      required: [type, request_id, outcome]
      properties:
        type: { type: string, const: result }
        request_id: { $ref: '#/components/schemas/RequestId' }
        outcome:
          type: string
          enum: [served, incomplete, failed, cancelled]
        served:
          type: object
          description: What actually ran. Absent when nothing started.
          required: [model]
          properties:
            model:
              type: string
              description: The model as the engine reported it.
            quantization: { type: [string, 'null'] }
            provider: { type: [string, 'null'] }
        usage:
          type: object
          description: What the standard's `usage` does not carry.
          properties:
            cache_write_input_tokens:
              type: integer
              description: Input tokens written to the provider's cache, already counted in `input_tokens`.
            cost_micros:
              type: integer
              minimum: 0
              description: |
                What the run cost at the seat's own price, in micros, rounded
                up. Sent by an engine whose seat config carries a price
                (openai-compatible); 0 for a local server.
        timing:
          type: object
          properties:
            first_output_ms:
              type: integer
              description: From `serve` received to the first output event.
            engine_ms:
              type: integer
              description: From `serve` received to the result.
        quota:
          type: array
          description: The account's provider windows as of this request, when the engine reports them.
          items: { $ref: './openapi.yaml#/components/schemas/QuotaWindow' }
        error:
          type: object
          description: Why, for `failed`.
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum: [seat_unavailable, engine_failed, engine_timeout, quota_exhausted, invalid_request]
            message: { type: string }
            retryable:
              type: boolean
              description: True when another seat could serve it. `invalid_request` never is.

    Cancel:
      type: object
      required: [type, request_id, reason]
      properties:
        type: { type: string, const: cancel }
        request_id: { $ref: '#/components/schemas/RequestId' }
        reason:
          type: string
          enum: [caller_gone, deadline, node_revoked, abandoned]
          description: |
            `abandoned`: the coordinator stopped waiting for this seat (no
            ack in time, no result within its wait) and may offer the request
            elsewhere.

    Assign:
      type: object
      required: [type, assignment]
      properties:
        type: { type: string, const: assign }
        assignment: { $ref: '#/components/schemas/Assignment' }

    ServeAck:
      type: object
      description: The node's immediate answer to a `serve`.
      required: [request_id, outcome]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        outcome:
          type: string
          enum: [accepted, refused]
        reason:
          type: [string, 'null']
          description: Why, for `refused`.

    # ---- the node plane's bodies (openapi.yaml refers to these) -----------

    Registration:
      type: object
      description: What a node presents when it registers.
      required: [protocol, version, capabilities, local]
      properties:
        protocol:
          type: integer
          const: 2
          description: This document's version.
        version:
          type: string
          description: The node software's version.
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        local: { $ref: '#/components/schemas/LocalControls' }

    Registered:
      type: object
      description: The coordinator's answer to a registration.
      required: [protocol, heartbeat_interval_ms, nats, assignment]
      properties:
        protocol: { type: integer, const: 2 }
        heartbeat_interval_ms: { type: integer, minimum: 1000 }
        nats:
          type: object
          required: [url, subject]
          properties:
            url:
              type: string
              description: Where NATS is, from the node's side of the private network.
              examples: ['nats://nats:4222']
            subject:
              type: string
              description: The node's own subject prefix.
              examples: ['voice.node.laptop']
            user:
              type: string
              description: |
                Grafted into a DNA habitat, the nodes' account on its broker,
                which may subscribe on `heart.<id>.node.>` and publish on
                `heart.<id>.reply.>` and `heart.<id>._INBOX.>`; absent
                standalone.
              examples: ['heart-abc-node']
            password:
              type: string
              description: |
                That account's password, present with `user` alone; the
                answer is sent `Cache-Control: no-store`.
        assignment: { $ref: '#/components/schemas/Assignment' }

    SeatStates:
      type: object
      required: [assignment_version, seats]
      properties:
        assignment_version:
          type: integer
          description: The assignment these states answer.
        seats:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/SeatState' }

    Heartbeat:
      type: object
      required: [in_flight, seats]
      properties:
        in_flight:
          type: integer
          minimum: 0
          description: Requests in flight across the node.
        seats:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/SeatState' }
        assignment_version:
          type: integer
          minimum: 0
          description: |
            The assignment version the node has applied. Core NATS delivers
            an `assign` at most once; a coordinator that sees this behind the
            node's current version publishes the assignment again.

    QuotaReport:
      type: object
      required: [seat, windows]
      properties:
        seat: { type: string }
        windows:
          type: array
          maxItems: 16
          items: { $ref: './openapi.yaml#/components/schemas/QuotaWindow' }

    Draining:
      type: object
      properties:
        reason: { type: string }
