# voice's own NATS as the habitat's broker hands it to a grafted heart
# (lib/broker): the heart's account may use `heart.zz.>` and nothing else,
# no `_INBOX.>` and no JetStream. The nodes, which have no account of
# their own yet, come in unauthenticated and are held to the same prefix.
port: 4222
# a caller's request body is at most 12 MiB, wrapped for a node in one message
max_payload: 16MB
authorization {
  users: [
    { user: heart-zz, password: brokerpw, permissions: { publish: "heart.zz.>", subscribe: "heart.zz.>" } }
    { user: nodes, password: nodespw, permissions: { publish: "heart.zz.>", subscribe: "heart.zz.>" } }
  ]
}
no_auth_user: nodes
