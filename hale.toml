# hale.toml — voice as a DNA organism's heart. Voice is three programs,
# each its own seed with its own manifest (api/, brain/, node/); this one
# is the repository's, read when the habitat grafts it.
#
# [dna] needs: the roles voice needs from the habitat at graft. Memory and
# the nerves are every organism's (its record, and the usage events it
# tells, api/events.hl); `database` is the heart's own Postgres store
# (store/), which the habitat provisions and hands over as
# HALE_DNA_DATABASE_DSN, its password in the vault entry the DSN names;
# `broker` is voice's own NATS (requests, assignments, the route table's
# notice), handed over as HALE_DNA_BROKER_URL, _USER, _VAULT and
# _SUBJECTS, every subject under the prefix it grants (lib/broker). The
# senses' store is left out: voice serves no readings yet.
#
# [dna.migrations.database]: the habitat runs `api migrate` against
# HALE_DNA_DATABASE_DSN at graft, at `hale habitat migrate` and at upgrade,
# every time. The migrator keeps its own ledger (pond's migrations table),
# so a run at the schema's head applies nothing and exits 0. The api and
# the brain never migrate on their own.
#
# The command runs from source (`hale run api`): voice is grafted from a
# pinned revision fetched without a checkout or a build (`hale habitat
# graft voice`, a sapling of the toolchain's nursery), and a revision holds
# no `api/api`. The first run compiles the api into the toolchain's cache;
# the later ones start at once. The `sapling` job in .github/workflows/ci.yml
# runs this command from a fresh clone.

# [dna] brings: what voice's own compose provides, its Postgres and its NATS
# (compose.yaml: `postgres`, `nats`, `migrate`), as `docker compose up` runs
# them standalone. A habitat grafting voice provisions neither by default:
# the application plane is voice's own, the organism plane (its record, its
# nerves) the habitat's. `hale habitat graft voice --reuse database` has the
# habitat provision one (and run the migration below against it), which
# voice's compose does not use yet: it always runs its own.

[dna]
# the hale release voice is built and run with: CI installs it, and a
# habitat provisions it on a host before running [dna.host.node]. The
# Dockerfile's HALE_VERSION must say the same (CI checks).
toolchain = "v0.30.1"
needs = ["memory", "nerves", "database", "broker"]
brings = ["database", "broker"]

[dna.migrations.database]
command = ["hale", "run", "api", "migrate", "--migrations", "store/migrations"]

# [dna.host.node]: how a habitat adds a voice node on a host it manages
# (`hale habitat organism place voice node --host <h>`): voice's own
# command, run on the host, as the person's login with sudo, unattended
# (docs/adding-a-node.md). The same on Linux and macOS. It needs the hale
# toolchain there, at voice's pin, and runs voice's source at the revision
# the habitat grafted. It records the node on the api, keeps its enrollment
# token in the node's vault, installs and starts the node as a system
# service running as that login's account, and prints no secret. Running
# it again is safe. Exit codes: 0 done, 2 a bad argument, 1 failed.

[dna.host.node]
platforms = ["linux", "macos"]
root = true
inputs = ["id", "api_url", "operator_token_file"]
# the api service whose published URL is {api_url}, and the command run in
# its container that prints the operator token the install is handed
# what a node's host must have, by platform: a GPU everywhere (NVIDIA on
# Linux, Apple silicon on macOS), which every runtime voice ships runs on;
# docker on Linux, which its runtimes run under there. A Mac runs its
# runtime itself and needs no docker.
requires = { linux = ["docker", "gpu"], macos = ["gpu"] }
api_service = "api"
operator_token = ["voice-api", "admin-token"]
# the service the install creates: the systemd unit on Linux, the launchd
# label on macOS, the same name on both
service = "voice-node-{id}"
# where the node serves its readings (node/readings.hl), on every
# interface: the habitat's senses scrape it there for its Services
# dashboard, beside the containers, and `unplace` stops
readings = 9476
install = ["hale", "run", "node", "install", "--id", "{id}", "--api", "{api_url}", "--operator-token-file", "{operator_token_file}"]
uninstall = ["hale", "run", "node", "uninstall", "--id", "{id}", "--api", "{api_url}", "--operator-token-file", "{operator_token_file}"]
