# voice is its own nursery: this repository, offered as the sapling `voice`
# and pinned at the commit a habitat reads it at (hale's `repo = "."`).
# A habitat trusts it and grafts it:
#
#   hale habitat nursery add https://github.com/hale-lang/voice
#   hale habitat graft voice
#
# A newer commit here is filed for the habitat's Board when it reads the
# nursery again, never taken on its own.

[[sapling]]
name = "voice"
summary = "distributed inference: one endpoint over local hosts and hosted providers, with routing, projects, budgets and rate limits"
repo = "."
packs = []
