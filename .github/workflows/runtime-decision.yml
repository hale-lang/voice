# The decision runtime's scorer, jev-score-v2 (runtimes/decision): built for
# every backend a node runs, here, never on someone's machine. metal builds
# on macOS; cpu, vulkan, rocm and cuda in their builders
# (runtimes/decision/Dockerfile), for each architecture they serve. Where a
# runner can run a build (metal, and cpu on both architectures),
# runtimes/decision/check/check.py holds it to the Jev-Style 2B release:
# its tokenizer, its GGUF check, and the MLX bf16 release's answers. GPU
# builds are built here, and checked on the GPUs they serve. The CPU image
# itself, voice-decide and its scorer, answers a request with the 2B model.
#
# Run by hand (Actions, "runtime: decision", Run workflow), it builds the
# same, then publishes DECISION_VERSION once: each Linux backend's image as
# ghcr.io/hale-lang/voice-decision:<backend>-<version>, one tag over its
# architectures, and the Metal archive as the release
# runtime-decision-<version>-metal. A tag or release that exists is refused:
# what a runtime pins never changes. The run's summary is what the runtime
# definitions (runtimes/decision-<version>-<backend>.json) must pin.

name: "runtime: decision"

on:
  pull_request:
    paths:
      - runtimes/decision/**
      - decide/**
      - .github/workflows/runtime-decision.yml
  workflow_dispatch:
    inputs:
      backends:
        description: "The backends to publish, space-separated (metal cpu vulkan rocm cuda); all when empty"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: runtime-decision-${{ github.event_name }}-${{ github.ref }}

env:
  DECISION_VERSION: 0.1.1
  IMAGE: ghcr.io/hale-lang/voice-decision
  # the release the scorer is vendored from, and its Q8_0 weights
  JEV_REPO: chaoliangUNSW/Jev-Style-2B-Decision-v3-GGUF
  JEV_REVISION: 154f7ac19614e30f0af52cc5b685baa95114c5a7
  JEV_GGUF_SHA256: f4826516125022362f4617e16d28b0e5f95b10d053bac18b59f49f27c89c83bb

jobs:
  build:
    name: ${{ matrix.backend }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: metal, arch: arm64, runner: macos-15, check: true }
          - { backend: cpu, arch: x86_64, runner: ubuntu-24.04, check: true }
          - { backend: cpu, arch: arm64, runner: ubuntu-24.04-arm, check: true }
          - { backend: vulkan, arch: x86_64, runner: ubuntu-24.04 }
          - { backend: vulkan, arch: arm64, runner: ubuntu-24.04-arm }
          - { backend: rocm, arch: x86_64, runner: ubuntu-24.04 }
          - { backend: cuda, arch: x86_64, runner: ubuntu-24.04 }
          - { backend: cuda, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # the ROCm and CUDA toolchains are tens of gigabytes unpacked
      - name: Room for the builder
        if: matrix.backend == 'rocm' || matrix.backend == 'cuda'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: ./.github/actions/hale
        if: matrix.backend == 'metal'
      - name: Build (macOS)
        if: matrix.backend == 'metal'
        env:
          # every program in the archive runs on macOS 14 and later, the
          # floor the scorer's build sets too (build.sh)
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          hale test decide && hale build decide
          DECIDE_BIN="$PWD/decide/decide" runtimes/decision/build.sh metal "$RUNNER_TEMP/out"
          for p in voice-decide jev-score-v2; do
            minos=$(otool -l "$RUNNER_TEMP/out/decision-runtime/$p" | awk '/LC_BUILD_VERSION/ {f=1} f && $1 == "minos" {print $2; exit}')
            echo "$p: macOS $minos and later"
            [ "$minos" = "14.0" ] || { echo "::error::$p is built for macOS $minos, not 14.0"; exit 1; }
          done
      # one builder per backend and architecture, its layers cached, so the
      # image (by hand, below) and the CPU image's check reuse what the
      # scorer's build compiled instead of compiling it again
      - uses: docker/setup-buildx-action@v3
        if: matrix.backend != 'metal'
      - name: Build (Linux)
        if: matrix.backend != 'metal'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtimes/decision/Dockerfile
          target: scorer
          build-args: BACKEND=${{ matrix.backend }}
          platforms: linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}
          outputs: type=local,dest=${{ runner.temp }}/out
          cache-from: type=gha,scope=decision-${{ matrix.backend }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=decision-${{ matrix.backend }}-${{ matrix.arch }}

      - name: The release's files
        if: matrix.check
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/model
          key: jev-style-2b-v3-gguf-${{ env.JEV_REVISION }}
      - name: Fetch the release's files
        if: matrix.check
        run: |
          set -eu
          m="$RUNNER_TEMP/model"
          mkdir -p "$m/tokenizer"
          for f in Jev-Style-2B-Decision-v3-Q8_0.gguf jev_style_decision_gguf.py readout_config.json \
                   tokenizer/tokenizer.json; do
            [ -s "$m/$f" ] || curl -fsSL -o "$m/$f" "https://huggingface.co/$JEV_REPO/resolve/$JEV_REVISION/$f"
          done
          echo "$JEV_GGUF_SHA256  $m/Jev-Style-2B-Decision-v3-Q8_0.gguf" | shasum -a 256 -c -
      - name: Check
        if: matrix.check
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q numpy tokenizers
          "$RUNNER_TEMP/venv/bin/python" runtimes/decision/check/check.py "$RUNNER_TEMP/out/decision-runtime" "$RUNNER_TEMP/model"

      # what a node runs: voice-decide on the weights a recipe places (the
      # GGUF and readout_config.json), answering a request
      - name: voice-decide answers (macOS)
        if: matrix.backend == 'metal'
        run: |
          set -eu
          w="$RUNNER_TEMP/weights"; mkdir -p "$w"
          ln -sf "$RUNNER_TEMP/model/Jev-Style-2B-Decision-v3-Q8_0.gguf" "$RUNNER_TEMP/model/readout_config.json" "$w/"
          "$RUNNER_TEMP/out/decision-runtime/voice-decide" --weights "$w" --port 18080 > "$RUNNER_TEMP/serve.log" 2>&1 &
          runtimes/decision/check/answers.sh http://127.0.0.1:18080 || { tail -50 "$RUNNER_TEMP/serve.log"; exit 1; }
      - name: The CPU image
        if: matrix.backend == 'cpu'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtimes/decision/Dockerfile
          target: image
          build-args: BACKEND=cpu
          platforms: linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}
          tags: voice-decision:check
          load: true
          cache-from: type=gha,scope=decision-${{ matrix.backend }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=decision-${{ matrix.backend }}-${{ matrix.arch }}
      - name: The image answers (Linux)
        if: matrix.backend == 'cpu'
        run: |
          set -eu
          w="$RUNNER_TEMP/weights"; mkdir -p "$w"
          cp "$RUNNER_TEMP/model/Jev-Style-2B-Decision-v3-Q8_0.gguf" "$RUNNER_TEMP/model/readout_config.json" "$w/"
          docker run -d --name decision-check -p 127.0.0.1:18080:8080 -v "$w:/models:ro" voice-decision:check \
            --weights /models --host 0.0.0.0 --port 8080
          runtimes/decision/check/answers.sh http://127.0.0.1:18080 || { docker logs decision-check 2>&1 | tail -50; exit 1; }

      - name: The Metal archive
        if: matrix.backend == 'metal'
        run: runtimes/decision/archive.sh "$RUNNER_TEMP/out" "decision-${DECISION_VERSION}-metal-darwin-arm64.tar.gz"
      - uses: actions/upload-artifact@v4
        if: matrix.backend == 'metal'
        with:
          name: decision-archive-metal
          path: ${{ runner.temp }}/out/decision-*-metal-darwin-arm64.tar.gz
          retention-days: 7

      # by hand: the image pushed by its digest, joined under one tag below
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && matrix.backend != 'metal' && contains(format(' {0} ', inputs.backends || 'metal cpu vulkan rocm cuda'), format(' {0} ', matrix.backend))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image by its digest
        if: github.event_name == 'workflow_dispatch' && matrix.backend != 'metal' && contains(format(' {0} ', inputs.backends || 'metal cpu vulkan rocm cuda'), format(' {0} ', matrix.backend))
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtimes/decision/Dockerfile
          target: image
          build-args: BACKEND=${{ matrix.backend }}
          platforms: linux/${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=decision-${{ matrix.backend }}-${{ matrix.arch }}
      - name: Its digest
        if: github.event_name == 'workflow_dispatch' && matrix.backend != 'metal' && contains(format(' {0} ', inputs.backends || 'metal cpu vulkan rocm cuda'), format(' {0} ', matrix.backend))
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "${{ steps.push.outputs.digest }}" > "$RUNNER_TEMP/digests/${{ matrix.backend }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && matrix.backend != 'metal' && contains(format(' {0} ', inputs.backends || 'metal cpu vulkan rocm cuda'), format(' {0} ', matrix.backend))
        with:
          name: digest-${{ matrix.backend }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: decision-runtime-${{ matrix.backend }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/decision-runtime
          retention-days: 7

  # by hand: each Linux backend's architectures under one tag, the Metal
  # archive as a release, and what the runtimes must pin
  publish:
    name: publish
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      # none when only the Metal archive is asked for (no match is no
      # failure); a failed download fails the run
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: decision-archive-metal
          path: archive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BACKENDS: ${{ inputs.backends || 'metal cpu vulkan rocm cuda' }}
        run: |
          set -eu
          # the backends asked for, the Linux images among them apart
          images=""
          for b in $BACKENDS; do
            case "$b" in
              metal) ;;
              cpu|vulkan|rocm|cuda) images="$images $b" ;;
              *) echo "::error::no backend $b (metal cpu vulkan rocm cuda)"; exit 1 ;;
            esac
          done
          metal=$(case " $BACKENDS " in *" metal "*) echo yes ;; esac)
          # every architecture of every image asked for is here before any
          # tag is made: a tag missing one could never be made whole
          for b in $images; do
            arches="x86_64 arm64"; [ "$b" = rocm ] && arches="x86_64"
            for a in $arches; do
              [ -s "digests/$b-$a" ] || { echo "::error::no digest for $b $a; nothing published"; exit 1; }
            done
          done
          tag="runtime-decision-${DECISION_VERSION}-metal"
          # a published runtime never changes: refuse before publishing anything
          if [ -n "$metal" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag exists; another build is another version"; exit 1
          fi
          for backend in $images; do
            if docker buildx imagetools inspect "$IMAGE:$backend-$DECISION_VERSION" >/dev/null 2>&1; then
              echo "::error::$IMAGE:$backend-$DECISION_VERSION exists; another build is another version"; exit 1
            fi
          done
          {
            echo "## decision $DECISION_VERSION: what the runtimes pin"
            echo
            echo "| runtime | artifact | pin |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for backend in $images; do
            refs=""
            for f in digests/$backend-*; do refs="$refs $IMAGE@$(cat "$f")"; done
            docker buildx imagetools create -t "$IMAGE:$backend-$DECISION_VERSION" $refs
            digest=$(docker buildx imagetools inspect "$IMAGE:$backend-$DECISION_VERSION" --format '{{json .Manifest}}' | jq -r .digest)
            arches=$(ls digests | sed -n "s/^$backend-//p" | tr '\n' ' ')
            echo "| decision-$DECISION_VERSION-$backend | $IMAGE:$backend-$DECISION_VERSION ($arches) | $digest |" >> "$GITHUB_STEP_SUMMARY"
          done
          [ -n "$metal" ] || exit 0
          a=$(ls archive/*.tar.gz)
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Runtime: decision-$DECISION_VERSION-metal (macOS arm64)" \
            --notes "Voice's decision runtime for macOS arm64 (Metal): voice-decide and jev-score-v2 on llama.cpp, built by runtimes/decision/build.sh in this workflow." \
            "$a"
          echo "| decision-$DECISION_VERSION-metal | $(basename "$a") | sha256 $(sha256sum "$a" | cut -d' ' -f1), $(stat -c %s "$a") bytes |" >> "$GITHUB_STEP_SUMMARY"
