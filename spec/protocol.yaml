asyncapi: 3.0.0
info:
  title: voice node protocol
  version: '2'
  description: |
    How a node and the coordinator talk. This is the seam a node
    implementation plugs into: a node that speaks this protocol and the
    node plane of `openapi.yaml` can join voice, whatever it is written in.
    `node.yaml` is only the local API of voice's own node.

    Two channels, by shape:

    - **HTTP, the node plane of the api** (`openapi.yaml`, tag `node`):
      everything one-shot. The node registers on start, presenting its
      enrollment token, and gets its assignment and where NATS is. It reports
      its state by HTTP writes: heartbeats, seat states, quota windows,
      capability and local-control changes, what its store holds,
      draining. It can read its current assignment any time.
    - **NATS, this document:** everything pushed or streamed. The
      coordinator publishes assignments, requests to serve and cancels on
      the node's own subject; the node streams each request's events and
      result to the reply subject that request named.

    NATS is on the private network with the nodes and the coordinator's
    processes; only the api is exposed. A node connects to NATS with its own
    credentials, and its permissions confine it to its own subject and the
    reply subjects it is handed.

    Inside `serve`, the request and its events are Open Responses
    (`2026-04-24`), taken by reference from the vendored standard. The
    standard's shapes are OpenAPI 3.1 schemas, which AsyncAPI's schema
    formats cannot hold; where a field carries one, `x-voice-schema` points
    at it in the vendored document, and both sides validate against that.

    ## Who decides what

    - **The node decides what is possible.** Its operator lists, on the
      machine, the engines it offers (an upstream's with the key it uses)
      and its hard limits. The node declares these when it registers. Keys
      never leave the machine.
    - **The coordinator decides what runs.** It holds the desired seats for
      every node, configured through its admin API, and publishes them to
      the node as an `assignment`. The node runs exactly the assigned seats
      and refuses any seat outside its capabilities.
    - **Local controls only restrict.** The node's operator may pause the
      node or a seat on the machine. Nothing local can widen what the
      coordinator assigned.

    A node has no in-flight cap of its own: it serves each seat up to the
    seat's `concurrency`, and its capacity is their sum. A placement's
    seat's concurrency is what its runtime is started with (TensorFold's
    `--parallel`, llama-server's slots, vLLM's `--max-num-seqs`), which the
    coordinator assigns it and the node starts the runtime with; any other
    seat's is what its operator set. A node from before, which declares
    `max_in_flight` and reads `Assignment.max_in_flight` as its cap, keeps
    working: the coordinator reads past the first and sends the second as
    the sum of the node's seats' concurrency.

    ## Session

    1. The node registers (`POST /node/v1/register`) with its id, version,
       capabilities and local controls. One live node per id: registering
       again replaces the earlier registration, so a restarted node takes
       over from its own ghost. The answer carries the heartbeat interval,
       the NATS address, and the current assignment.
    2. The node applies the assignment (starting, reconfiguring and stopping
       seats to match it), subscribes to `voice.node.<id>.>`, and reports
       every assigned seat's state (`POST /node/v1/seats`), including the
       seats it refused and why.
    3. From then on:
       - The coordinator publishes `assign` with the whole desired state
         whenever it changes. Each assignment carries a `version`; the node
         applies the newest and reports seat states for that version.
       - The node reports seat states whenever one changes, and heartbeats
         every interval (`POST /node/v1/heartbeat`) with every seat's state
         and load. The coordinator marks a node `down` after three intervals
         with nothing received, and fails its in-flight requests as seat
         failures.
       - The node reports capabilities when its operator changes what it
         offers (`PUT /node/v1/capabilities`) and local controls when they
         change (`PUT /node/v1/local`). The coordinator re-checks the
         assignment against them.
       - The node reports quota windows when an engine returns them
         (`POST /node/v1/quota`). The static engine never does.
       - The node reports its inventory (`PUT /node/v1/inventory`): the
         files its data directory's store holds whole, each by its sha256
         and size. It sends it once registered, and again whenever what
         it holds changes, never with every heartbeat. A file a placement
         no longer uses stays there, so the coordinator can tell which
         models a node has on disk, and that placing one again is a reload
         rather than a download.
       - Before a deliberate shutdown the node posts `draining`. The
         coordinator sends it no new requests, and the node exits once every
         in-flight request has its result.

    A node that was offline gets its assignment when it registers again:
    configuration made while a node is away takes effect when it returns.

    ## Serving

    - The coordinator publishes `serve` on `voice.node.<id>.serve` as a NATS
      request: the node replies at once with `accepted` or `refused`
      (unknown, paused or refused seat; seat or node full; engine down). No
      reply within the timeout, or `refused`, is a seat failure and the
      coordinator claims another slot, except a refusal whose `refusal` is
      `capacity`: the seat, or its node, is serving its most at once, and a
      slot frees when one of those requests ends. That seat has not failed;
      when every seat that could take the request refuses so, the
      coordinator waits for a slot and offers the request again. It never
      sends a seat more requests than its `concurrency`, by its own count;
      the node's is the truth.
    - The node then publishes the standard's streaming events, in order, to
      `<reply_to>.event`, and exactly one `result` to `<reply_to>.result`.
      It uses the `request_id` as the response's `id`. Events for one
      request never reorder.
    - While its engine is at work but sends no event (an engine that holds
      a tool call back until it is whole, sending SSE keep-alive comments
      meanwhile), the node publishes `alive` to `<reply_to>.alive`, at most
      once a second. The coordinator waits for a seat from one message to
      the next, `alive` included: a seat that sends neither an event nor
      `alive` for its idle span has failed.
    - Usage is the standard's `usage` on the terminal event's response, where
      `input_tokens` includes cached input. What the standard does not carry
      travels in `result`: the model as the engine reported it, cache writes,
      timing, and quota windows.
    - The coordinator publishes `cancel` when the caller goes away or the
      deadline passes. The node stops the engine and publishes its `result`,
      with outcome `cancelled` unless the request finished first.
    - A node that loses NATS abandons its in-flight requests; the
      coordinator, seeing no result, treats each as a seat failure: retried
      elsewhere if nothing had reached the caller, failed otherwise.
    - The coordinator retries a failed request on another seat only when
      `retryable` is true and no output has reached the caller. A
      `quota_exhausted` failure also marks the account exhausted until the
      reset in the result's quota windows.

    ## A model across two nodes

    A placement may span two nodes cabled to each other (openapi.yaml
    `Placement`). Its seat is on the first, its leader, which serves it; a
    seat of the same id on the second, its follower, runs the other half of
    the model and serves nothing itself. Each seat's config says its part
    (`ManagedConfig.cluster`), and both nodes fetch and verify the variant's
    files. The coordinator offers requests only to the leader's seat, and
    only while both seats are `up`: either one down, stopped, drained or
    replaced takes the model out of service until both run again.

    A model is placed across a link only once the link was checked. The
    coordinator assigns each of the two nodes a `link_check`
    (`Assignment.link_checks`); each runs one rank of an NCCL all-reduce
    over the link, in the image of the runtime that would serve a model
    across it, and reports what it measured (`POST /node/v1/link-checks`).

    ## Subjects

    `voice.node.<node>.assign`, `voice.node.<node>.serve`,
    `voice.node.<node>.cancel` are the node's, and it subscribes to
    `voice.node.<node>.>`. `<reply_to>` is chosen by the api instance that
    published the `serve` and is unique per request. A node's NATS
    permissions allow subscribing to its own subject and publishing to reply
    subjects, nothing else.

    Grafted into a DNA habitat, voice's NATS is the habitat's broker, and
    every subject is under the prefix its account is granted: `voice.` is
    replaced by `heart.<id>.` (`heart.<id>.node.<node>.serve`,
    `heart.<id>.reply.…`, `heart.<id>.route`), and a request's reply inbox is
    under the inbox prefix handed over, or under the same prefix. A node
    learns its subject at registration (`nats.subject`), so it follows.

    ## Pulling: protocol 3

    Protocol 3 is queue routing (`docs/design/queue-routing.md`): a seat
    pulls its work from queues on JetStream instead of being offered it by
    `serve`. Its channels and messages are below, each marked
    `x-voice-protocol: 3`; everything else here is protocol 2, which
    protocol 3 keeps. A node of protocol 3 pulls, and registers
    `protocol: 3`; it still answers `serve`, one count of its slots
    covering both, so a slot serving a `serve` is not pulled for. From the
    release that ships it, the coordinator registers nodes of protocol 2
    and 3 alike (`Registration.protocol`) for exactly that one release,
    and then refuses protocol 2. It queues a request (publishes a ticket
    for it) when every seat that could serve it is on a node registered
    with protocol 3, and offers any other with `serve`, chosen per request
    with no setting (the design's "Building phase 1", step (d)). A node of
    protocol 3 reports how each seat pulls on its heartbeat and in its
    status (`SeatState.pull`), and on its heartbeat the conversations each
    seat holds (`SeatState.conversations`); each seat's prefill rate is not
    reported yet.

    - **Tickets.** The api admits a request as it does today and publishes
      a `Ticket` for each attempt into the work stream (`VOICE_WORK`
      under voice's own NATS; `internal.yaml`, `WorkStream`), on one of
      the work subjects:
      - `voice.work.m.<model>.<class>.<need>`, for a model served under one
        provider account;
      - `voice.work.p.<model>.<provider>.<class>.<need>`, for a model served
        under more than one, `<provider>` one provider account the request
        may spend (today's `account`);
      - `voice.work.s.<node>.<seat>`, a seat's own queue, for a
        conversation's turn the api judged that seat may serve.

      `m` and `p` are a model's two shapes, which the brain decides and
      writes on the board (`internal.yaml`, `Board.models`), and `s` marks a
      seat's own queue. A **partition** is a subject of the first two
      shapes: the requests the same seats may serve. `<model>` is the
      catalog model the request is served as, after aliases; `<class>` its
      data class; `<need>` `tools` when the request lists tools, else
      `any`. Ids become tokens by percent-encoding `.`, `*`, `>`, `%`,
      whitespace and every byte outside printable ASCII, each as `%` and
      two upper-case hex digits (`glm-4.7-flash` is `glm-4%2E7-flash`).

      An attempt goes into the stream as one or two **copies**: `shared`,
      on a partition, and, for a conversation's turn, `seat`, on its home
      seat's own queue. Each copy's `Nats-Msg-Id` is
      `<request_id>.<attempt>.<copy>`, the same for every publish of that
      copy, so the stream keeps a copy sent again once and never takes one
      copy for the other. Its `Nats-TTL` is the ticket's own wait, to
      `wait_until`.
    - **Claims.** A seat with a free slot, by the node's own count, pulls a
      ticket from the queues its plan names and claims its request from the
      api instance that holds the caller: a `Claim`, as a NATS request to
      `<reply_to>.claim`. The api grants each attempt once, whichever copy
      was claimed: a `Grant` (the `serve` message, body and all) to the
      first claim, and a `Decline` to any other. A repeat of the granted
      claim itself (the same seat and the same copy, its answer lost) is
      granted again. The node acks the ticket on either answer, except a
      `Decline` for `ineligible`, which it puts back at once for a seat that
      may serve it; it runs a grant as it runs an accepted `serve`, its
      events, `alive` and result as above.
    - **Plans.** The brain publishes each node's `ConsumePlan` on
      `voice.node.<node>.consume` when it changes and every 30 s: per seat,
      held with a reason, or the queues to consume, in order. A node with no
      plan, and a seat its plan does not name, consumes its own queue and
      the partitions its assignment makes it eligible for, in both shapes
      (the `p` ones under its own provider account); a ticket it may not
      serve is declined `ineligible` at the claim.
    - **How a seat pulls.** Only while it has a free slot, by the node's
      own count, and never while it is not `up`, held by its plan, or a
      pair's follower (rank 1), whose leader pulls for the pair. With free
      slots it sweeps its queues in order, one pull at a time that takes
      what is there for at most as many tickets as it has free slots
      (`no_wait`); once every queue was found empty it holds a standing
      pull of one ticket on each, waiting 30 s, and serves the first to
      arrive. A ticket that comes when the seat has no free slot left (a
      standing pull of another queue answered too) is put back at once
      (`-NAK`). A ticket past its `wait_until` is acked and dropped; one
      that avoids the seat, or needs tools the seat does not carry, is put
      back after 1 s, for another seat.

    The subject routes a ticket; the claim decides who serves it. Grafted,
    the work subjects are under the broker's prefix as every other.
  contact:
    url: https://github.com/hale-lang/voice

defaultContentType: application/json

servers:
  nats:
    host: nats:4222
    protocol: nats
    description: The private network's NATS. Its address is part of the node's registration answer.

channels:
  assign:
    address: voice.node.{node}.assign
    parameters:
      node: { $ref: '#/components/parameters/node' }
    messages:
      assign: { $ref: '#/components/messages/assign' }
  serve:
    address: voice.node.{node}.serve
    parameters:
      node: { $ref: '#/components/parameters/node' }
    messages:
      serve: { $ref: '#/components/messages/serve' }
  serveReply:
    address: null
    description: The NATS reply inbox of a `serve` request.
    messages:
      serveAck: { $ref: '#/components/messages/serveAck' }
  cancel:
    address: voice.node.{node}.cancel
    parameters:
      node: { $ref: '#/components/parameters/node' }
    messages:
      cancel: { $ref: '#/components/messages/cancel' }
  event:
    address: '{reply_to}.event'
    parameters:
      reply_to: { $ref: '#/components/parameters/reply_to' }
    messages:
      event: { $ref: '#/components/messages/event' }
  alive:
    address: '{reply_to}.alive'
    parameters:
      reply_to: { $ref: '#/components/parameters/reply_to' }
    messages:
      alive: { $ref: '#/components/messages/alive' }
  result:
    address: '{reply_to}.result'
    parameters:
      reply_to: { $ref: '#/components/parameters/reply_to' }
    messages:
      result: { $ref: '#/components/messages/result' }
  workModel:
    address: voice.work.m.{model}.{class}.{need}
    description: A partition of a model served under one provider account.
    x-voice-protocol: 3
    parameters:
      model: { $ref: '#/components/parameters/model' }
      class: { $ref: '#/components/parameters/class' }
      need: { $ref: '#/components/parameters/need' }
    messages:
      ticket: { $ref: '#/components/messages/ticket' }
  workProvider:
    address: voice.work.p.{model}.{provider}.{class}.{need}
    description: A partition of a model served under more than one provider account, under one of them.
    x-voice-protocol: 3
    parameters:
      model: { $ref: '#/components/parameters/model' }
      provider: { $ref: '#/components/parameters/provider' }
      class: { $ref: '#/components/parameters/class' }
      need: { $ref: '#/components/parameters/need' }
    messages:
      ticket: { $ref: '#/components/messages/ticket' }
  workSeat:
    address: voice.work.s.{node}.{seat}
    description: A seat's own queue, for a conversation's turn the api judged it may serve.
    x-voice-protocol: 3
    parameters:
      node: { $ref: '#/components/parameters/node' }
      seat: { $ref: '#/components/parameters/seat' }
    messages:
      ticket: { $ref: '#/components/messages/ticket' }
  claim:
    address: '{reply_to}.claim'
    x-voice-protocol: 3
    parameters:
      reply_to: { $ref: '#/components/parameters/reply_to' }
    messages:
      claim: { $ref: '#/components/messages/claim' }
  claimReply:
    address: null
    description: The NATS reply inbox of a `claim` request.
    x-voice-protocol: 3
    messages:
      grant: { $ref: '#/components/messages/grant' }
      decline: { $ref: '#/components/messages/decline' }
  consume:
    address: voice.node.{node}.consume
    x-voice-protocol: 3
    parameters:
      node: { $ref: '#/components/parameters/node' }
    messages:
      consumePlan: { $ref: '#/components/messages/consumePlan' }

operations:
  receiveAssign:
    action: receive
    channel: { $ref: '#/channels/assign' }
    summary: The node's whole desired state, after any change.
  receiveServe:
    action: receive
    channel: { $ref: '#/channels/serve' }
    summary: Serve one request on one seat; answer accepted or refused at once.
    reply:
      channel: { $ref: '#/channels/serveReply' }
      address:
        location: '$message.header#/replyTo'
  receiveCancel:
    action: receive
    channel: { $ref: '#/channels/cancel' }
    summary: Stop serving a request.
  sendEvent:
    action: send
    channel: { $ref: '#/channels/event' }
    summary: One standard streaming event for a request.
  sendAlive:
    action: send
    channel: { $ref: '#/channels/alive' }
    summary: The seat is at work on a request though it sends no event yet.
  sendResult:
    action: send
    channel: { $ref: '#/channels/result' }
    summary: How a request ended. Exactly one per request, always last.
  receiveModelTicket:
    action: receive
    channel: { $ref: '#/channels/workModel' }
    summary: A ticket pulled from a partition, by a seat with a free slot.
  receiveProviderTicket:
    action: receive
    channel: { $ref: '#/channels/workProvider' }
    summary: A ticket pulled from a partition, by a seat with a free slot.
  receiveSeatTicket:
    action: receive
    channel: { $ref: '#/channels/workSeat' }
    summary: A ticket pulled from the seat's own queue, before any partition.
  sendClaim:
    action: send
    channel: { $ref: '#/channels/claim' }
    summary: Claim a ticket's request for a seat; granted once per attempt, or declined.
    reply:
      channel: { $ref: '#/channels/claimReply' }
      address:
        location: '$message.header#/replyTo'
  receiveConsumePlan:
    action: receive
    channel: { $ref: '#/channels/consume' }
    summary: Which queues each of the node's seats consumes, in order, or why it is held.

components:
  parameters:
    node:
      description: The node's id.
    reply_to:
      description: The reply subject prefix a `serve` or a ticket named.
    seat:
      description: The seat's id on its node.
    model:
      description: The catalog model a request is served as, after aliases, as a token.
    provider:
      description: A provider account's id (today's `account`), as a token.
    class:
      description: A data class, as a token.
    need:
      description: '`tools` when the request lists tools, else `any`.'
      enum: [tools, any]

  messages:
    assign:
      name: assign
      payload: { $ref: '#/components/schemas/Assign' }
    serve:
      name: serve
      payload: { $ref: '#/components/schemas/Serve' }
    serveAck:
      name: serve_ack
      payload: { $ref: '#/components/schemas/ServeAck' }
    cancel:
      name: cancel
      payload: { $ref: '#/components/schemas/Cancel' }
    event:
      name: event
      payload: { $ref: '#/components/schemas/Event' }
    alive:
      name: alive
      payload: { $ref: '#/components/schemas/Alive' }
    result:
      name: result
      payload: { $ref: '#/components/schemas/Result' }
    ticket:
      name: ticket
      x-voice-protocol: 3
      payload: { $ref: '#/components/schemas/Ticket' }
    claim:
      name: claim
      x-voice-protocol: 3
      payload: { $ref: '#/components/schemas/Claim' }
    grant:
      name: grant
      x-voice-protocol: 3
      payload: { $ref: '#/components/schemas/Serve' }
    decline:
      name: decline
      x-voice-protocol: 3
      payload: { $ref: '#/components/schemas/Decline' }
    consumePlan:
      name: consume_plan
      x-voice-protocol: 3
      payload: { $ref: '#/components/schemas/ConsumePlan' }

  schemas:
    RequestId:
      type: string
      description: The coordinator's request id; the usage record's id and the response's `id`.

    Slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'

    Capabilities:
      type: object
      description: |
        What the node can run, as its operator configured it on the machine.
        The coordinator assigns seats only within it, and the node refuses
        any seat outside it.
      required: [engines]
      properties:
        engines:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/Engine' }
        max_in_flight:
          type: integer
          minimum: 1
          deprecated: true
          description: |
            Read past: a node has no cap of its own, its capacity is its
            seats' `concurrency`. A node declares the most it serves at
            once, its slots, for a coordinator from before, which requires
            it; a capabilities file that still says it is read past too.
        hardware:
          $ref: '#/components/schemas/Hardware'
        links:
          type: array
          maxItems: 4
          description: |
            The direct links to other nodes its operator declared on the
            machine, in the node's capabilities file beside its engines
            (each machine's own interfaces and addresses): for each peer,
            the local ports cabled to it. A link declared here wins over
            the one the coordinator finds from `ports` for the same peer.
            A model is placed across two nodes only when each has a link
            to the other, declared or found, and their link passed its
            check (openapi.yaml `checkNodeLink`).
          items: { $ref: '#/components/schemas/Link' }
        ports:
          type: array
          maxItems: 8
          description: |
            The machine's cabled ports, as the node finds them: each
            network interface with an RDMA (RoCE) device and a carrier.
            The node looks at start and again whenever a carrier comes or
            goes, and reports its capabilities again when what it found
            changed (`reportCapabilities`). The coordinator pairs two
            nodes' ports by what each sees on its link (`neighbors`), and
            uses the link it finds as a declared one (`Link`): its first
            port the pair of ports that share an address family (and an
            IPv4 subnet), each port at the address it already has, IPv4
            before IPv6 link-local, and the RoCE v2 GID that carries that
            address as its `gid_index`. Voice configures no host
            networking: a port with neither address is cabled but not
            addressed.
          items: { $ref: '#/components/schemas/CabledPort' }

    Link:
      type: object
      description: One peer this node is cabled to, and the ports that reach it.
      required: [peer, ports]
      properties:
        peer:
          $ref: '#/components/schemas/Slug'
          description: The node at the other end.
        ports:
          type: array
          minItems: 1
          maxItems: 4
          description: |
            The local ports cabled to the peer, the first the one the two
            meet on: a model's ranks start from its address. Every port's
            RDMA device carries the model's traffic (`NCCL_IB_HCA`), and
            the first port's interface the rest (`NCCL_SOCKET_IFNAME`,
            `GLOO_SOCKET_IFNAME`, `TP_SOCKET_IFNAME`, `UCX_NET_DEVICES`),
            as NVIDIA's guide to serving vLLM across two DGX Sparks sets
            them. A DGX Spark's one cabled QSFP port is two ports here, one
            for each PCIe half of its ConnectX-7.
          items: { $ref: '#/components/schemas/LinkPort' }
        gid_index:
          type: integer
          minimum: 0
          maximum: 255
          description: |
            The RoCE GID index the ports' RDMA devices use
            (`NCCL_IB_GID_INDEX`), when NCCL's own choice is not the one
            the link's addresses are on: 3 for RoCE v2 over IPv4 on a DGX
            Spark's ConnectX-7, 1 for RoCE v2 over its IPv6 link-local
            address. A link the coordinator finds has the RoCE v2 GID that
            carries its first port's address.
          examples: [3]

    LinkPort:
      type: object
      required: [ifname, address]
      properties:
        ifname:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,15}$'
          description: Its network interface, by the name the machine gives it.
          examples: [enp1s0f0np0]
        address:
          type: string
          pattern: '^([0-9]{1,3}(\.[0-9]{1,3}){3}|fe80:[0-9a-f:]{2,35})$'
          description: |
            Its address on the link, without a prefix length: IPv4, or its
            IPv6 link-local address (`fe80::/64`, without a scope), which a
            node reaches on the interface of its own end of the link.
          examples: [198.51.100.1, 'fe80::5eff:fe00:111']
        hca:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: Its RDMA (RoCE) device, when it has one.
          examples: [rocep1s0f0]

    CabledPort:
      type: object
      description: |
        One port of the machine with an RDMA (RoCE) device and a carrier:
        what the coordinator pairs nodes' links from (`Capabilities.ports`).
        Read from the kernel (`/sys/class/net`, `/sys/class/infiniband`)
        and its neighbour tables, never configured.
      required: [ifname, mac, speed_mbps]
      properties:
        ifname:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,15}$'
          examples: [enp1s0f0np0]
        mac:
          type: string
          pattern: '^[0-9a-f]{2}(:[0-9a-f]{2}){5}$'
          description: Its hardware address.
          examples: ['02:00:5e:00:01:11']
        speed_mbps:
          type: integer
          minimum: 0
          description: Its link speed, in Mb/s, as the kernel says it (`speed`); 0 when it does not.
          examples: [200000]
        mtu:
          type: integer
          minimum: 0
          examples: [9000]
        hca:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
          description: Its RDMA device.
          examples: [rocep1s0f0]
        addresses:
          type: array
          maxItems: 8
          description: |
            Its addresses with their prefix lengths, as the machine has them:
            IPv4 and IPv6 link-local. Others are left out.
          items: { type: string, examples: [198.51.100.1/30, 'fe80::5eff:fe00:111/64'] }
        gids:
          type: array
          maxItems: 8
          description: Its RDMA device's RoCE v2 GIDs, each by its index, and the address it carries.
          items:
            type: object
            required: [index, address]
            properties:
              index: { type: integer, minimum: 0, maximum: 255, examples: [3] }
              address:
                type: string
                description: The GID as an address, an IPv4-mapped GID as its IPv4 address.
                examples: [198.51.100.1, 'fe80::5eff:fe00:111']
        neighbors:
          type: array
          maxItems: 16
          description: |
            The hardware addresses the node sees on the link: its neighbour
            tables' (IPv6 neighbour discovery after a ping to all nodes on
            the link, `ff02::1`, and ARP after a ping to the other end of a
            /30 or /31) and LLDP's, where the machine runs it.
          items:
            type: string
            pattern: '^[0-9a-f]{2}(:[0-9a-f]{2}){5}$'

    Hardware:
      type: object
      description: |
        What the machine has, as the node measures it when it declares its
        capabilities: the machine describing itself, so a model can be
        placed where it fits. Nothing here is a control. A node that does
        not measure leaves it out, and no model is placed on it.
      required: [os, arch, memory_bytes, model_memory_bytes, accelerators, disk_free_bytes]
      properties:
        os:
          type: string
          enum: [linux, darwin]
        arch:
          type: string
          enum: [arm64, x86_64]
        memory_bytes:
          type: integer
          minimum: 1
          description: The machine's memory.
        model_memory_bytes:
          type: integer
          minimum: 0
          description: |
            What models may use of it: `memory_bytes` less what the machine
            keeps for its own system (a sixteenth, at least 4 GiB; on a
            machine whose GPU shares its memory, the one pool both draw on),
            or less when the node's operator holds some back in the
            capabilities file, which only lowers it. The seats the node runs
            hold at most this together: a seat that would take more is not
            started, and says so.
        accelerators:
          type: array
          maxItems: 16
          description: At most 16; a machine with more declares its first 16, and its node says so in its log.
          items: { $ref: '#/components/schemas/Accelerator' }
        disk_free_bytes:
          type: integer
          minimum: 0
          description: Free space under the node's data directory, where weights are kept.

    Accelerator:
      type: object
      required: [kind, name, memory_bytes, unified]
      properties:
        kind:
          type: string
          enum: [cuda, rocm, vulkan, metal]
          description: |
            How it is reached: `cuda` (NVIDIA, through its driver), `rocm`
            (AMD, when ROCm's compute device `/dev/kfd` is there), `vulkan` (a
            discrete AMD or Intel GPU through its Vulkan driver), `metal`
            (Apple silicon). An AMD card with ROCm is listed as both `rocm`
            and `vulkan`.
        name:
          type: string
          examples: [NVIDIA GB10, Apple M1 Max, AMD Radeon RX 9070 XT]
        memory_bytes:
          type: integer
          minimum: 0
          description: Its own memory; with `unified`, the machine's, which it shares.
        unified:
          type: boolean
          description: True when it shares the machine's memory (Apple silicon, NVIDIA GB10) rather than having its own.
        compute_capability:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
          examples: ['12.1']
          description: |
            An NVIDIA GPU's compute capability, as `nvidia-smi` says it: what a
            runtime's kernels must be built for (`RuntimeCreate.compute_capabilities`).
            Left out when the driver does not say, and for other kinds.

    Engine:
      type: object
      description: |
        One engine the node offers: a kind of engine with what it runs
        against, an upstream and its key for one. Two upstreams of one kind
        are two engines. How a key is held is local to the node and is never
        declared.

        Whether a seat carries `tools` is derived from its kind and its
        config, not declared: an `openai-compatible` seat does; a `managed`
        seat under llama-server does, and one under vLLM when its variant
        names a `tool_call_parser`, which the node starts vLLM with; a
        `static` seat only with its `tool_call` drill; any other never. A `serve` whose
        request lists `tools` for a seat that does not carry them is
        `refused` before any event, a seat failure, so the coordinator
        offers the request to the next seat.
      required: [id, kind, config_schema]
      properties:
        id:
          $ref: '#/components/schemas/Slug'
          description: Unique on the node; seats name it.
          examples: [static, managed, ollama]
        kind:
          type: string
          description: |
            What runs: `static`, `openai-compatible`, or `managed`: a model
            the coordinator placed on the node, whose weights and runtime the
            node fetches and verifies itself (`ManagedConfig`). Coding
            harnesses and agent CLIs run outside voice, as clients of its
            API: no engine runs them.
          examples: [static, openai-compatible, managed]
        description: { type: string }
        models:
          type: [array, 'null']
          description: The engine's own names for the models it can run, when it knows them. Null when any name may be tried.
          items: { type: string }
        config_schema:
          type: object
          description: |
            JSON Schema of the `config` a seat on this engine takes. The
            coordinator checks seats against it, and a UI renders it as a
            form. The static engine's is `StaticConfig`, the openai-compatible
            engine's `OpenAICompatibleConfig`, the managed engine's
            `ManagedConfig`.

    ManagedConfig:
      type: object
      description: |
        A managed seat's config, which the coordinator writes when the
        operator places a model on the node (openapi.yaml `Placement`):
        everything the node needs, pinned, so it looks nothing up. The
        node fetches each of the variant's files from the hub, at the
        variant's revision, its file sets' each from its own source and
        revision, and the runtime's archive (or the engine archive its
        image runs), and uses a file only when its sha256 matches. A
        variant that names a prepare step has its inputs readied from them
        before its server starts, each checked against its pin. Where the hub is and the token it takes
        are the node's own (its managed engine's `local` object), never
        the coordinator's.
      required: [placement, model, variant, runtime]
      properties:
        placement:
          type: string
          description: The placement this seat serves.
        model:
          type: string
          description: The catalog model it serves, the name its server answers to.
        variant:
          $ref: './openapi.yaml#/components/schemas/RecipeVariant'
        runtime:
          $ref: './openapi.yaml#/components/schemas/RuntimeCreate'
        cluster:
          $ref: '#/components/schemas/ClusterPart'

    ClusterPart:
      type: object
      description: |
        A seat's part of a placement across two nodes: its rank, the node it
        pairs with, and where the ranks meet. The node runs the runtime's
        server across the two as the runtime says (`multi_node`): for vLLM
        (`mp`), its own multi-node executor, `--nnodes 2`, the leader rank
        0 serving the API and the follower rank 1 headless, the model split
        by tensor parallelism across the two GPUs, as NVIDIA's two-Spark
        guide runs it; for TensorFold (`lanes`), its two ranks, the leader
        `tensorfold-native serve` and the follower `tf-dsv41-lanes`, which
        connects to the leader's rendezvous at `master_addr:master_port`
        (the leader listens on that address alone: the port is
        unauthenticated), each rank's RDMA ring and NCCL on the link's
        RDMA devices at its declared `gid_index`. Both run on the host's
        network, so the ranks reach each other over the link, and the
        leader's API listens on loopback alone. A node takes part in one
        such placement at a time.
      required: [size, rank, peer, master_addr, master_port]
      properties:
        size: { type: integer, const: 2 }
        rank:
          type: integer
          minimum: 0
          maximum: 1
          description: 0 for the leader, which serves; 1 for the follower.
        peer:
          $ref: '#/components/schemas/Slug'
          description: The other node; this node's link to it (`Capabilities.links`) carries the model.
        master_addr:
          type: string
          description: |
            The leader's address on its link to the follower, the first of
            its ports; an IPv6 link-local address scoped to this node's own
            first port (`fe80::...%<ifname>`).
        master_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Where on it the ranks meet.
        link:
          $ref: '#/components/schemas/Link'
          description: |
            This node's end of the link to `peer`, as the coordinator uses
            it: the one its capabilities declare, or else the one the
            coordinator found from both nodes' `ports`. Left out by a
            coordinator that does not find links; the node then uses its
            declared one.

    StaticConfig:
      type: object
      description: |
        The static engine's seat config. It answers every request with
        `text`. Tokens are counted as one per four characters, rounded up, of
        the input and of `text`.
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        chunk_chars:
          type: integer
          minimum: 1
          default: 16
          description: Characters per streamed delta.
        first_output_ms:
          type: integer
          minimum: 0
          default: 0
          description: Delay before the first output, to exercise timing and deadlines.
        chunk_interval_ms:
          type: integer
          minimum: 0
          default: 0
        fail_after_ms:
          type: integer
          minimum: 0
          default: 0
          description: |
            A drill: every request fails this long after it is accepted,
            before any output, as a retryable `engine_failed`, so the
            coordinator offers it to the next seat. 0 never fails.
        tool_call:
          type: object
          description: |
            A drill: every request is answered by a call to this tool, a
            `function_call` output item with these `arguments` (a JSON
            text), instead of with `text`. A static seat without it
            refuses a request that lists `tools`.
          required: [name]
          properties:
            name: { type: string, minLength: 1 }
            arguments: { type: string, default: '{}' }

    OpenAICompatibleConfig:
      type: object
      description: |
        The openai-compatible engine's seat config: a seat that proxies to a
        server speaking the chat-completions wire (Ollama, LM Studio, the
        llama.cpp server, or a hosted one). The request's `instructions` and
        `input` are sent as `messages` to `<base_url>/chat/completions` with
        `stream: true`; the upstream's chunks come back as the standard's
        events, and its final `usage` is the run's usage (one token per four
        characters when it sends none). An http upstream is relayed
        as it streams, each event published when its chunk is complete; an
        https upstream is read to the end of its stream first. What an upstream
        relayed as it streams sends that is not an event (a keep-alive
        comment) is the engine at work: the node publishes `alive` for it. A refused or unreachable
        upstream, an error status, a stream that ends or stays silent for 120 s before its end, or a stream with no output fails the seat
        before any event is published, so the
        coordinator offers the request to the next seat. A finish reason of
        `length` ends the run `incomplete`. The request's `tools`, `tool_choice` and
        `parallel_tool_calls` are sent as the chat-completions wire names them
        (each tool's JSON Schema byte for byte), `function_call` input items as
        an assistant message's `tool_calls` and `function_call_output` items as
        `tool` messages. The upstream's streamed `delta.tool_calls` come back as
        a `function_call` output item: `response.output_item.added` when a
        call's index first appears, a `response.function_call_arguments.delta`
        per argument fragment as it arrives, then `response.function_call_arguments.done`
        and `response.output_item.done`. Calls arrive in index order; an
        interleaved one fails the seat.
      required: [base_url, model]
      properties:
        base_url:
          type: string
          pattern: '^https?://'
          description: The upstream's API root, such as `http://localhost:11434/v1`.
        model:
          type: string
          minLength: 1
          description: The upstream's own name for the model it runs.
        api_key_vault:
          type: string
          description: |
            The `std::secret` vault entry holding the API key, sent as a
            bearer token. The key is read into the request and is never
            logged, played or returned. Absent for an upstream with no key.
        input_per_mtok_micros:
          type: integer
          minimum: 0
          default: 0
          description: What the seat charges per million input tokens, in micros. 0 for a local server.
        output_per_mtok_micros:
          type: integer
          minimum: 0
          default: 0
          description: What the seat charges per million output tokens, in micros.

    LocalControls:
      type: object
      description: |
        What the node's operator set on the machine. Each field only
        restricts: a paused node or seat takes no new requests. A node from
        before may send a local `max_in_flight`: the coordinator reads past
        it, as no cap of a node's stands.
      required: [paused, paused_seats]
      properties:
        paused: { type: boolean }
        paused_seats:
          type: array
          maxItems: 32
          items: { type: string }
        reason:
          type: [string, 'null']
          description: Why, for the admin to read.

    Seat:
      type: object
      description: |
        One seat as the coordinator assigns it: an engine the node offers,
        spending one account, serving some catalog models.
      required: [id, engine, account, serves]
      properties:
        id:
          $ref: '#/components/schemas/Slug'
          description: Unique on the node. Its full name is `<node>/<seat>`.
        engine:
          type: string
          description: The id of one of the node's declared engines.
        account:
          type: string
          description: The coordinator account this seat spends. Several seats, on one node or many, may name the same account and share its limits.
        serves:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SeatModel' }
        data_classes:
          type: array
          description: Data classes this seat may carry. Defaults to `[internal]`.
          items: { type: string }
        concurrency:
          type: integer
          minimum: 1
          default: 1
          description: |
            Requests this seat serves at once. A placement's seat's is what
            its runtime is started with (TensorFold's `--parallel`, 32;
            llama-server's slots, as many requests of the context its
            placement promises as its prompt cache holds, one to four;
            vLLM's `--max-num-seqs`, 32; the decision server's 1), derived
            from its config, and the node holds it to that whatever this
            says. Any other seat's is what its operator set.
        enabled:
          type: boolean
          default: true
        config:
          type: object
          description: Engine-specific, valid against the engine's `config_schema`.

    SeatModel:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: A catalog model id.
        as:
          type: [string, 'null']
          description: The engine's own name for it, when that differs, e.g. `qwen3:8b` for `qwen3-8b`.

    Assignment:
      type: object
      description: Everything the coordinator wants the node to run. The whole state each time, never a diff.
      required: [version, max_in_flight, seats]
      properties:
        version:
          type: integer
          description: Increases with every change. The node applies the newest it has.
        max_in_flight:
          type: integer
          minimum: 1
          deprecated: true
          description: |
            The sum of its seats' `concurrency` (at least 1), for a node
            from before, which reads it as its cap. A node now reads past
            it: it has no cap of its own.
        seats:
          type: array
          maxItems: 16
          description: A seat the node is running and this list leaves out is stopped once its in-flight requests finish.
          items: { $ref: '#/components/schemas/Seat' }
        link_checks:
          type: array
          maxItems: 4
          description: |
            The link checks the node is to run, one rank of each. A node
            runs each once and reports it; a check it has reported, or one
            thirty minutes old, is left out.
          items: { $ref: '#/components/schemas/LinkCheckJob' }

    LinkCheckJob:
      type: object
      description: |
        One rank of a link's check: an NCCL all-reduce between the two nodes
        over their link, in the image named, with the NCCL settings the
        node's own declaration of the link gives (`Link.ports`), its RDMA
        devices passed to the container. Verify only: nothing is kept but
        what it measured.
      required: [id, peer, rank, master_addr, master_port, image]
      properties:
        id: { type: string }
        peer:
          $ref: '#/components/schemas/Slug'
        rank: { type: integer, minimum: 0, maximum: 1 }
        master_addr:
          type: string
          description: Rank 0's address on the link; an IPv6 link-local address scoped to this node's own first port (`fe80::...%<ifname>`).
        master_port: { type: integer, minimum: 1, maximum: 65535 }
        link:
          $ref: '#/components/schemas/Link'
          description: This node's end of the link, as for `ClusterPart.link`.
        image:
          type: string
          description: The image it runs in, by digest (`<image>@sha256:...`), the runtime a model across the link would run in.
          examples: ['nvcr.io/nvidia/vllm@sha256:5577473378...']

    LinkCheckResult:
      type: object
      description: What a node's rank of a link check measured.
      required: [id, ok]
      properties:
        id: { type: string }
        ok:
          type: boolean
          description: True when the all-reduce ran and its result was right.
        bus_bytes_per_second:
          type: integer
          minimum: 0
          description: The all-reduce's bus bandwidth, as nccl-tests counts it, for the largest size it ran.
        reason:
          type: string
          description: Why it failed, or what it ran.
        iommu:
          type: array
          maxItems: 4
          description: |
            The IOMMU domain each of the link's RDMA devices is in, as the
            machine says it (`/sys/bus/pci/devices/<bdf>/iommu_group/type`),
            left out for a device in none. An all-reduce under 10 GB/s with
            a device behind a translating IOMMU is told so: a diagnosis
            only, as voice never changes how a machine boots.
          items:
            type: object
            required: [hca, domain]
            properties:
              hca: { type: string, examples: [rocep1s0f0] }
              domain:
                type: string
                description: '`identity` is passthrough; `DMA` and `DMA-FQ` translate every access the device makes.'
                examples: [identity, DMA-FQ]

    SeatState:
      type: object
      description: One assigned seat's state on the node.
      required: [id, status, in_flight]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [starting, fetching, up, down, disabled, paused, refused]
          description: |
            `fetching`: a managed seat whose weights or runtime the node is
            fetching and verifying; `progress` says how far. `starting`, for
            a managed seat: its node is readying the inputs its variant's
            prepare step makes (`reason` says the step and how far), its
            server is loading the model or starting again after it ended
            (`reason` says why and which attempt), or, for the leader of a
            model across two nodes, it waits for its follower to join.
            `down`: the engine cannot serve, e.g. a managed seat's file did
            not verify, or its server keeps ending (it is still started again every few minutes).
            `paused`: a local control
            holds it. `refused`: the seat is outside the node's
            capabilities, e.g. an engine it does not offer or a config its
            engine rejects; `reason` says which.
        reason: { type: [string, 'null'] }
        progress:
          $ref: '#/components/schemas/FetchProgress'
        context:
          type: integer
          minimum: 1
          description: |
            A managed seat's server, once it answers: the context, in tokens,
            it took (llama-server's `n_ctx`, vLLM's `max_model_len`). Left out
            until it says.
        in_flight: { type: integer, minimum: 0 }
        pull:
          $ref: '#/components/schemas/SeatPull'
        conversations:
          type: array
          x-voice-protocol: 3
          maxItems: 128
          items: { type: string, pattern: '^[0-9a-f]{32}$' }
          description: |
            The conversations the seat's engine holds, as far as its node
            knows: the `conversation` of each ticket it was granted, the
            newest first, at most as many as its runtime holds (llama-server
            its slots, TensorFold 80, vLLM 32 as a floor, a hosted seat
            none). The api corrects where it records each conversation by it
            (`seat_conversation`, store.md): this seat's rows older than the
            heartbeat, but for those listed, go. Left out by a node of
            protocol 2.

    SeatPull:
      type: object
      x-voice-protocol: 3
      description: |
        How a seat pulls, from a node of protocol 3: on its heartbeat, its
        seats' report and its status; left out by a node of protocol 2.
      required: [state, reason, plan_version, queues]
      properties:
        state:
          type: string
          enum: [pulling, waiting, full, held, off]
          description: |
            `pulling`: it has a free slot and sweeps its queues. `waiting`:
            it has a free slot and found every queue empty, and holds a
            standing pull on each. `full`: every slot it may take is
            serving or claiming. `held`: its plan holds it (`reason`).
            `off`: it pulls nothing: it is not `up`, a pair's follower, or
            its node is not on NATS (`reason`).
        reason:
          type: [string, 'null']
          description: Why it is held or off; null otherwise.
        plan_version:
          type: [integer, 'null']
          description: |
            The version of the plan it follows (`ConsumePlan.version`),
            null while it pulls on its own eligibility (no plan, or one
            that does not name it).
        queues:
          type: array
          maxItems: 64
          description: |
            The work subjects it consumes, in the order it sweeps them;
            empty when it is held.
          items: { type: string }

    FetchProgress:
      type: object
      description: How far a managed seat's fetch is, in bytes, across its files and its runtime's archive.
      required: [done_bytes, total_bytes]
      properties:
        done_bytes: { type: integer, minimum: 0 }
        total_bytes: { type: integer, minimum: 0 }

    Serve:
      type: object
      required: [type, request_id, seat, model, body, reply_to]
      properties:
        type: { type: string, const: serve }
        request_id: { $ref: '#/components/schemas/RequestId' }
        reply_to:
          type: string
          description: |
            The subject prefix the node answers on: events to `<reply_to>.event`,
            the result to `<reply_to>.result`. It names the api instance
            holding the caller, so the answer needs no routing.
        seat:
          type: string
          description: The seat's id on this node.
        model:
          type: string
          description: The catalog model id the caller named.
        engine_model:
          type: [string, 'null']
          description: The seat's own name for the model (`as`), when it has one.
        deadline:
          type: [string, 'null']
          format: date-time
        endpoint:
          type: string
          enum: [responses, decision]
          default: responses
          description: |
            What `body` is. `responses` (the default): the standard request
            below. `decision`: a decision model's request (the api's
            `contract: decision`), `{"state", "questions": {<id>: {"type":
            "choice" | "noul" | "score", "instructions", "criteria"?}}}` as a
            decision server's `POST /v1/systemone` takes it. An `openai-compatible`
            seat serves one: it posts the body whole to `<base_url>/systemone`,
            `model` set to the seat's own name for the model, and answers with
            one `decision.answer` event (`DecisionAnswer`) and the result. So
            does a managed seat whose runtime's server is `decision`, posting
            to its own server on loopback (`/v1/systemone`); such a seat
            answers `failed` to any other request ("this seat serves only a
            decision model's requests"). Any other seat answers `failed`
            ("this seat serves no decision model") so the coordinator moves on. An upstream that
            refuses it fails the run with its own error, its code kept
            (`the upstream answered 422 (invalid_question): …`).
        body:
          description: |
            The standard request, as the coordinator will serve it: Chat
            Completions requests arrive converted, and `voice`, `stream`,
            `stream_options` and `background` are removed. It is always
            streamed on this connection. With `endpoint: decision`, a
            decision model's request instead (see `endpoint`).
          type: object
          x-voice-schema: './vendor/open-responses/openapi.json#/components/schemas/CreateResponseBody'

    Event:
      type: object
      required: [type, request_id, event]
      properties:
        type: { type: string, const: event }
        request_id: { $ref: '#/components/schemas/RequestId' }
        event:
          description: |
            Any standard streaming event; for a `serve` with `endpoint:
            decision`, the one `decision.answer` event (`DecisionAnswer`).
          type: object
          required: [type]
          x-voice-schema: './vendor/open-responses/openapi.json#/paths/~1responses/post/responses/200/content/text~1event-stream/schema'

    Alive:
      type: object
      description: |
        The seat is at work on the request though it sends no event yet:
        its engine sent something that is not an event (an SSE keep-alive
        comment, or part of an event). Published at most once a second; the
        coordinator's idle span runs from it as from an event.
      required: [type, request_id]
      properties:
        type: { type: string, const: alive }
        request_id: { $ref: '#/components/schemas/RequestId' }

    DecisionAnswer:
      type: object
      description: |
        A decision model's answer (`serve` with `endpoint: decision`), the
        only event of its run: the upstream's systemone answer, whole. Its
        `model` is the result's `served.model`; the coordinator reads
        `answer.usage.input_tokens` for the request's input tokens (a decision
        model writes none).
      required: [type, answer]
      properties:
        type: { type: string, const: decision.answer }
        answer:
          type: object
          required: [answers]
          properties:
            model: { type: string }
            answers:
              type: object
              description: Each question's answer by its id, as the upstream gave it.
            usage:
              type: object
              properties:
                input_tokens: { type: integer, minimum: 0 }

    Result:
      type: object
      required: [type, request_id, outcome]
      properties:
        type: { type: string, const: result }
        request_id: { $ref: '#/components/schemas/RequestId' }
        outcome:
          type: string
          enum: [served, incomplete, failed, cancelled]
        served:
          type: object
          description: What actually ran. Absent when nothing started.
          required: [model]
          properties:
            model:
              type: string
              description: The model as the engine reported it.
            quantization: { type: [string, 'null'] }
            provider: { type: [string, 'null'] }
        usage:
          type: object
          description: What the standard's `usage` does not carry.
          properties:
            cache_write_input_tokens:
              type: integer
              description: Input tokens written to the provider's cache, already counted in `input_tokens`.
            cost_micros:
              type: integer
              minimum: 0
              description: |
                What the run cost at the seat's own price, in micros, rounded
                up. Sent by an engine whose seat config carries a price
                (openai-compatible); 0 for a local server.
        timing:
          type: object
          properties:
            first_output_ms:
              type: integer
              description: From `serve` received to the first output event.
            engine_ms:
              type: integer
              description: From `serve` received to the result.
        quota:
          type: array
          description: The account's provider windows as of this request, when the engine reports them.
          items: { $ref: './openapi.yaml#/components/schemas/QuotaWindow' }
        tool_arguments_repaired:
          type: array
          description: |
            The tool calls whose arguments the node repaired before it sent
            them (openapi.yaml `createResponse`, *Tool call arguments*): each
            call's id, its name and its arguments as the engine wrote them.
            Absent when it repaired none. The api records the repair on the
            request's usage and, for a request that peeks, what the engine
            wrote.
          items:
            type: object
            required: [call_id, name, arguments]
            properties:
              call_id: { type: string }
              name: { type: string }
              arguments: { type: string }
        error:
          type: object
          description: Why, for `failed`.
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum: [seat_unavailable, engine_failed, engine_timeout, quota_exhausted, invalid_request]
            message: { type: string }
            retryable:
              type: boolean
              description: True when another seat could serve it. `invalid_request` never is.

    Cancel:
      type: object
      required: [type, request_id, reason]
      properties:
        type: { type: string, const: cancel }
        request_id: { $ref: '#/components/schemas/RequestId' }
        reason:
          type: string
          enum: [caller_gone, deadline, node_revoked, abandoned]
          description: |
            `abandoned`: the coordinator stopped waiting for this seat (no
            ack in time, no result within its wait) and may offer the request
            elsewhere.

    Assign:
      type: object
      required: [type, assignment]
      properties:
        type: { type: string, const: assign }
        assignment: { $ref: '#/components/schemas/Assignment' }

    ServeAck:
      type: object
      description: The node's immediate answer to a `serve`.
      required: [request_id, outcome]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        outcome:
          type: string
          enum: [accepted, refused]
        reason:
          type: [string, 'null']
          description: Why, for `refused`.
        refusal:
          type: [string, 'null']
          enum: [capacity, unavailable, null]
          description: |
            For `refused`, what kind of refusal: `capacity` when the seat
            is serving its `concurrency`, or the node has no free slot, so
            a slot frees when a request it serves ends; `unavailable` for
            any other (no such seat, a seat not `up`, one that cannot carry
            the request). Null for
            `accepted`, and left out by a node that does not say: read as
            `unavailable`.

    # ---- protocol 3: pulling ----------------------------------------------

    Ticket:
      type: object
      x-voice-protocol: 3
      description: |
        A request waiting for a seat, as the api publishes it into the work
        stream: what eligibility needs and where to claim it, never its
        body, which stays in the memory of the api instance that holds the
        caller. Under 1 KiB. An attempt's two copies differ only in `copy`.
        Times are in UTC (`2026-11-26T10:00:00.25Z`).
      required: [request_id, attempt, reply_to, instance, model, provider_account, data_class, need, endpoint, conversation, enqueued_at, wait_until, copy, avoid, size]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        attempt:
          type: integer
          minimum: 1
          description: |
            The attempt, from 1. A retry before output is a new attempt,
            with a ticket of its own.
        reply_to:
          type: string
          description: |
            The attempt's subject prefix, as `Serve.reply_to`: the claim goes
            to `<reply_to>.claim`, and the events and the result as for
            `serve`.
        instance:
          type: string
          description: The api instance that holds the caller.
        model:
          type: string
          description: The catalog model the request is served as, after aliases.
        provider_account:
          type: [string, 'null']
          description: |
            The provider account (today's `account`) of the attempt's
            partition, in the `p` shape; null in the `m` shape.
        data_class:
          type: string
          description: The request's data class.
        need:
          type: string
          enum: [tools, any]
          description: '`tools` when the request lists tools, else `any`.'
        endpoint:
          type: string
          enum: [responses, decision]
          description: What the request's body is, as `Serve.endpoint`.
        conversation:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
          description: |
            The first 32 lower-case hex digits of the sha256 of the
            request's affinity key (its `prompt_cache_key`, or the key voice
            derives from its opening), never the key itself; null when it
            has none. A node keeps, per seat, the conversations its tickets
            carried.
        enqueued_at:
          type: string
          format: date-time
          description: When the attempt's first copy was published.
        wait_until:
          type: string
          format: date-time
          description: |
            When the request stops waiting for a seat: its
            `voice.deadline`, or 60 s from admission, at most 10 minutes
            (`internal.yaml`, `WorkStream.max_age`). A node acks and drops
            a ticket past it, never claims it.
        copy:
          type: string
          enum: [shared, seat]
          description: |
            `shared`, on a partition; `seat`, on the home seat's own queue,
            for a conversation's turn. The copy's `Nats-Msg-Id` is
            `<request_id>.<attempt>.<copy>`.
        avoid:
          type: array
          maxItems: 8
          description: |
            The seats that failed this request, `<node>/<seat>`. A seat named
            here puts the ticket back, with a delay, for another.
          items: { type: string }
        size:
          type: integer
          minimum: 0
          description: |
            Voice's estimate of the input, a token per four characters, as
            `input_tokens_estimated`.

    Claim:
      type: object
      x-voice-protocol: 3
      description: |
        A seat's claim on a ticket's request, a NATS request to
        `<reply_to>.claim` from the slot that pulled it, answered within
        2 s with a `Grant` or a `Decline`. The api grants an attempt once,
        whichever copy was claimed; `copy` serves only to recognize a
        repeat of the granted claim, which is granted again.
      required: [request_id, attempt, copy, seat]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        attempt:
          type: integer
          minimum: 1
        copy:
          type: string
          enum: [shared, seat]
        seat:
          type: string
          description: The claiming seat, `<node>/<seat>`.

    Decline:
      type: object
      x-voice-protocol: 3
      description: |
        The api's answer to a claim it does not grant. A grant is the
        `serve` message (`Serve`); `type` tells the two apart.
      required: [type, reason]
      properties:
        type: { type: string, const: decline }
        reason:
          type: string
          enum: [taken, gone, avoided, ineligible]
          description: |
            `taken`: another claim was granted this attempt. `gone`: the
            request is over (answered, its caller left, or its wait
            ended). `avoided`: the seat failed this request before.
            `ineligible`: the seat's provider account or data class is not
            one the request may use, from the configuration the api read at
            admission. The node acks the ticket on `taken` and `gone`; it
            puts it back for a seat that may serve it on `ineligible`, at
            once, and on `avoided`, after 1 s, as it does a ticket whose
            `avoid` names it. A claim nothing answers (no responders: the
            api instance is gone) is acked and dropped; one unanswered
            within its 2 s twice is put back at once.

    ConsumePlan:
      type: object
      x-voice-protocol: 3
      description: |
        Which queues each of the node's seats consumes, from the brain, on
        `<root>.node.<node>.consume`: published when it changes and every
        30 s, since core NATS delivers it at most once. The node pulls on
        the newest it was given until another comes, and on its own
        eligibility while it has none.
      required: [version, seats]
      properties:
        version:
          type: integer
          minimum: 0
          description: |
            The version of the board the plan is part of (`internal.yaml`,
            `Board.version`), the same number, so a node can say which
            board its plan came from: milliseconds of Postgres's clock,
            always above the version before it. A node ignores a plan older
            than the one it holds.
        seats:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/SeatPlan' }

    SeatPlan:
      type: object
      x-voice-protocol: 3
      description: One seat's plan, held with its reason, or the queues it consumes in order.
      required: [seat, hold, consume]
      properties:
        seat:
          type: string
          description: The seat's id on this node.
        hold:
          type: [string, 'null']
          description: |
            Why the seat pulls nothing (its node draining, its provider
            account exhausted, a pair's follower down, ...); null when it
            consumes.
        consume:
          type: array
          maxItems: 64
          description: |
            The work subjects it pulls from, whole, in order: its own queue
            first, then partitions. A seat with free slots sweeps them in
            order. Empty when it is held.
          items: { type: string }

    # ---- the node plane's bodies (openapi.yaml refers to these) -----------

    Registration:
      type: object
      description: What a node presents when it registers.
      required: [protocol, version, capabilities, local]
      properties:
        protocol:
          type: integer
          enum: [2, 3]
          description: |
            This document's version the node speaks: 3, a node that pulls
            and still answers `serve`; 2, one from before. The coordinator
            registers both for one release, then refuses 2.
        version:
          type: string
          description: The node software's version.
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        local: { $ref: '#/components/schemas/LocalControls' }

    Registered:
      type: object
      description: The coordinator's answer to a registration.
      required: [protocol, heartbeat_interval_ms, nats, assignment]
      properties:
        protocol:
          type: integer
          enum: [2, 3]
          description: The protocol the node registered under, its own.
        heartbeat_interval_ms: { type: integer, minimum: 1000 }
        nats:
          type: object
          required: [url, subject]
          properties:
            url:
              type: string
              description: Where NATS is, from the node's side of the private network.
              examples: ['nats://nats:4222']
            subject:
              type: string
              description: The node's own subject prefix.
              examples: ['voice.node.laptop']
            user:
              type: string
              description: |
                Grafted into a DNA habitat, the nodes' account on its broker,
                which may subscribe on `heart.<id>.node.>` and publish on
                `heart.<id>.reply.>` and `heart.<id>._INBOX.>`; absent
                standalone.
              examples: ['heart-abc-node']
            password:
              type: string
              description: |
                That account's password, present with `user` alone; the
                answer is sent `Cache-Control: no-store`.
        assignment: { $ref: '#/components/schemas/Assignment' }

    SeatStates:
      type: object
      required: [assignment_version, seats]
      properties:
        assignment_version:
          type: integer
          description: The assignment these states answer.
        seats:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/SeatState' }

    Heartbeat:
      type: object
      required: [in_flight, seats]
      properties:
        in_flight:
          type: integer
          minimum: 0
          description: Requests in flight across the node.
        seats:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/SeatState' }
        assignment_version:
          type: integer
          minimum: 0
          description: |
            The assignment version the node has applied. Core NATS delivers
            an `assign` at most once; a coordinator that sees this behind the
            node's current version publishes the assignment again.

    Inventory:
      type: object
      description: |
        The files the node's store holds whole (its data directory's
        `blobs/<sha256>`, each kept only once it verified): what it has on
        disk of the models it was placed, and the runtimes' archives. A
        file being fetched is not one of them until it verified. At most
        4096, about 300 KiB; a node that holds more reports the first 4096
        by sha256, and says so in its log.
      required: [blobs]
      properties:
        blobs:
          type: array
          maxItems: 4096
          description: Sorted by `sha256`, each file once.
          items: { $ref: '#/components/schemas/InventoryBlob' }

    InventoryBlob:
      type: object
      required: [sha256, bytes]
      properties:
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        bytes:
          type: integer
          minimum: 0

    QuotaReport:
      type: object
      required: [seat, windows]
      properties:
        seat: { type: string }
        windows:
          type: array
          maxItems: 16
          items: { $ref: './openapi.yaml#/components/schemas/QuotaWindow' }

    Draining:
      type: object
      properties:
        reason: { type: string }
