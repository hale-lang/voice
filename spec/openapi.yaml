              $ref: '#/components/schemas/AnnotationBackfill'
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued:
                    type: integer
                    description: The recorded requests it will ask about.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
