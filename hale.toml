# hale.toml — voice as a DNA organism's heart. Voice is three programs,
# each its own seed with its own manifest (api/, brain/, node/); this one
# is the repository's, read when the habitat grafts it.
#
# [dna] needs: the roles voice needs from the habitat at graft. Memory and
# the nerves are every organism's (its record, and the usage events it
# tells, api/events.hl); `database` is the heart's own Postgres store
# (store/), which the habitat provisions and hands over as
# HALE_DNA_DATABASE_DSN, its password in the vault entry the DSN names;
# `broker` is voice's own NATS (requests, assignments, the route table's
# notice), handed over as HALE_DNA_BROKER_URL, _USER, _VAULT and
# _SUBJECTS, every subject under the prefix it grants (lib/broker). The
# senses' store is left out: voice serves no readings yet.
#
# No [dna.migrations.*]: voice migrates its own Postgres. Compose's
# `migrate` service (`voice-api migrate`, from voice's image) brings the
# schema up to date before the api and the brain start, on every apply; its
# ledger (pond's migrations table) makes a run at the schema's head apply
# nothing. The api and the brain never migrate on their own. The `sapling`
# job in .github/workflows/ci.yml runs it twice from a fresh clone.

# [dna] brings: what voice's own compose provides, its Postgres and its NATS
# (compose.yaml: `postgres` in the `database` profile, `nats` in the
# `broker` profile, both on by default through .env), as `docker compose
# up` runs them standalone. A habitat grafting voice provisions neither by
# default: the application plane is voice's own, the organism plane (its
# record, its nerves) the habitat's. `hale habitat graft voice --reuse
# database --reuse broker` has the habitat provision either or both, and
# compose uses what it hands over: `migrate`, the api and the brain take
# HALE_DNA_DATABASE_DSN for `--database` and HALE_DNA_BROKER_URL for
# `--nats` (its account and subject prefix with it), the passwords read from
# the habitat's vault, never on a command line; nodes are handed the
# broker's URL. A role the habitat provides is left out of
# COMPOSE_PROFILES, which the habitat sets, so its server does not start
# (`none` for both); a habitat that sets none starts both, unused.

[dna]
# the hale release voice is built and run with: CI installs it, and a
# habitat provisions it on a host before running [dna.host.node]. The
# Dockerfile's HALE_VERSION must say the same (CI checks).
toolchain = "v0.32.8"
needs = ["memory", "nerves", "database", "broker"]
brings = ["database", "broker"]

# [dna.host.node]: how a habitat adds a voice node on a host it manages
# (`hale habitat organism place voice node --host <h>`): voice's own
# command, run on the host, as the person's login with sudo, unattended
# (docs/adding-a-node.md). The same on Linux and macOS. It runs the
# voice-node published for the revision the habitat grafted
# (HALE_DNA_REVISION): on Linux taken out of voice's image for that commit,
# on macOS the darwin build published beside it, checked against its
# sha256 (node/install.sh); the hale toolchain, at voice's pin, is needed
# only where none is published, to build it from voice's source at that
# revision. It records the node on the api, keeps its enrollment
# token in the node's vault, installs and starts the node as a system
# service running as that login's account, and prints no secret. Running
# it again is safe. Exit codes: 0 done, 2 a bad argument, 1 failed.

[dna.host.node]
platforms = ["linux", "macos"]
root = true
inputs = ["id", "api_url"]
# what a node's host must have, by platform: docker on Linux, which its
# runtimes run under there; Apple silicon on macOS, which a Mac's runtimes
# (MLX, Metal) need, and no docker. No GPU on Linux: a node with none still
# serves a CPU runtime (decision-*-cpu), an upstream or a Claude seat, and
# what a node's hardware runs is judged per placement (api/placements.hl).
requires = { linux = ["docker"], macos = ["gpu"] }
# the api service whose published URL is {api_url}
api_service = "api"
# the service the install creates: the systemd unit on Linux, the launchd
# label on macOS, the same name on both
service = "voice-node-{id}"
# where the node serves its readings (node/readings.hl), on every
# interface: the habitat's senses scrape it there for its Services
# dashboard, beside the containers, and `unplace` stops
readings = 9476
install = ["sh", "node/install.sh", "install", "--id", "{id}", "--api", "{api_url}"]
uninstall = ["sh", "node/install.sh", "uninstall", "--id", "{id}", "--api", "{api_url}"]

# The secrets voice declares: the habitat draws or slots each in its vault
# and hands it to the readers named, `HALE_SECRET_<NAME>` naming its entry
# in `HALE_VAULT_DIR`. A host command's are there only for its run, so the
# node's install keeps what the node needs in its own vault.

# voice's admin UI, which the api serves at `/`: listed on the habitat's
# dashboard, with how to sign in (the operator token, which a person reads)
[dna.ui.admin]
label = "voice admin"
service = "api"
path = "/"
login = "operator-token"

# the admin plane's one credential: the habitat draws it at graft; the api
# checks it (it mints none when grafted), the node's install records and
# removes the node with it, and a person reads it for the admin UI:
# `hale dna secret show operator-token`
[dna.secrets.operator-token]
kind = "drawn"
readers = ["api", "host.node"]
person = "read"

# a Claude subscription's token, one member per account, labelled with
# voice's account id: `claude setup-token`, then
# `hale dna secret set claude-token --member work`. The node's install keeps
# each as `claude-token--<label>` in the node's vault, which a claude seat
# names as its `token_vault`; placing the node again hands over a new one.
# Optional: a node serves models with no Claude account, and placed again
# with none, its install removes the tokens it kept.
[dna.secrets.claude-token]
kind = "slot"
family = true
optional = true
readers = ["host.node"]
person = "write"

# voice as its habitat's model provider: every organism's legs call voice,
# each with a key the habitat draws for it, one member of this family per
# organism, labelled with its name; the api takes each as a tenant's key
# (api/tenants.hl), whose project spends what the tenant defaults allow
# (none until the operator sets them)
[dna.secrets.tenant-key]
kind = "drawn"
family = true
readers = ["api"]

[dna.provides.models]
service = "api"
key = "tenant-key"
# voice's own fields on each /v1/models entry (available, capabilities.tools)
# live in its `voice` object, as every extension of voice's does
extension = "voice"
# what the habitat tells a person when a tenant is served nothing yet: the
# habitat is voice's customer, a project, <habitat>-habitat, whose accounts its
# tenants inherit; it spends none until the operator gives it some
# (tenants.hl). {habitat} is the habitat's name, which hale fills in.
grant = "give {habitat}-habitat an account to spend in voice's admin UI (Projects): an account billing none serves models on your own machines at no cost (create one in Accounts if there is none)"
