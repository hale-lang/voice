# Voice's image (the api, the brain and the node: Dockerfile), published so
# a grafted voice pulls it rather than building on its host. Every push to
# main and every tag is built for linux/amd64 and linux/arm64, each on a
# runner of its own architecture (no emulation), pushed by digest and joined
# under one tag: the commit's full sha, which compose.yaml names
# (ghcr.io/hale-lang/voice:${HALE_DNA_REVISION}), and a tag's name too.

name: image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hale-lang/voice

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Its digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "${{ steps.push.outputs.digest }}" > "$RUNNER_TEMP/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag over both architectures
        run: |
          set -eu
          tags="-t $IMAGE:$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags="$tags -t $IMAGE:$GITHUB_REF_NAME"; fi
          docker buildx imagetools create $tags $(for f in digests/*; do echo "$IMAGE@$(cat "$f")"; done)
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"
          {
            echo "## $IMAGE:$GITHUB_SHA"
            [ "$GITHUB_REF_TYPE" = tag ] && echo "also $IMAGE:$GITHUB_REF_NAME"
            echo
            echo "digest $(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          } >> "$GITHUB_STEP_SUMMARY"
