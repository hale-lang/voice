// `Account`. `windows` are the provider windows an engine last reported.
message Account {
  optional string id = 1;
  optional string name = 2;
  optional bool has_provider = 3; // Hale: whether `provider` is present
  optional string provider = 4; // Hale: optional, present when `has_provider`
  // How an account is paid for (`Account.billing`).
  optional Billing billing = 5;
  repeated Limit limits = 6; // Hale: at most 16
  // Whether a project or an account is in use (`status`).
  optional Lifecycle status = 7;
  repeated string seats = 8; // Hale: at most 32
  repeated QuotaWindow windows = 9; // Hale: at most 16
  optional bool has_exhausted_until = 10; // Hale: whether `exhausted_until` is present
  optional int64 exhausted_until = 11; // Hale: Time, nanoseconds since the Unix epoch, UTC; optional, present when `has_exhausted_until`
  optional int64 created_at = 12; // Hale: Time, nanoseconds since the Unix epoch, UTC
  optional bool has_archived_at = 13; // Hale: whether `archived_at` is present
  optional int64 archived_at = 14; // Hale: Time, nanoseconds since the Unix epoch, UTC; optional, present when `has_archived_at`
}

// `AccountCreate`. With no `billing` it is `none`.
message AccountCreate {
  optional string id = 1;
  optional string name = 2;
  optional bool has_provider = 3; // Hale: whether `provider` is present
  optional string provider = 4; // Hale: optional, present when `has_provider`
  optional bool has_billing = 5; // Hale: whether `billing` is present
  // How an account is paid for (`Account.billing`).
  optional Billing billing = 6; // Hale: optional, present when `has_billing`
  repeated Limit limits = 7; // Hale: at most 16
}

message AccountList {
  repeated Account data = 1; // Hale: at most 64
}

message AccountQuery {
  optional bool include_archived = 1;
}

message AccountRef {
  optional string account = 1;
}

// `AccountUpdate`, for the account the path names.
message AccountUpdate {
  optional string account = 1;
  optional bool has_id = 2; // Hale: whether `id` is present
  optional string id = 3; // Hale: optional, present when `has_id`
  optional bool has_name = 4; // Hale: whether `name` is present
  optional string name = 5; // Hale: optional, present when `has_name`
  optional bool has_provider = 6; // Hale: whether `provider` is present
  optional string provider = 7; // Hale: optional, present when `has_provider`
  optional bool clear_provider = 8; // Hale: whether `provider` is cleared (sent as JSON `null`)
  optional bool has_billing = 9; // Hale: whether `billing` is present
  // How an account is paid for (`Account.billing`).
  optional Billing billing = 10; // Hale: optional, present when `has_billing`
  optional bool has_limits = 11; // Hale: whether `limits` is present
  repeated Limit limits = 12; // Hale: at most 16; optional, present when `has_limits`
}

// `ApplyStep`: one step of a plan carried out: removing a placement,
// adding a catalog model or a placement, pointing an alias.
message ApplyStep {
  // What a step does.
  optional ApplyAction action = 1;
  optional string target = 2;
  optional string detail = 3;
  // What a step came to.
  optional ApplyStepState state = 4;
  optional string reason = 5;
}

// `Arrangement`: wants kept, when they were last planned, and whether the
// fleet has changed since.
message Arrangement {
  optional string id = 1;
  optional string name = 2;
  ArrangementWants wants = 3;
  optional int64 created_at = 4; // Hale: Time, nanoseconds since the Unix epoch, UTC
  optional int64 updated_at = 5; // Hale: Time, nanoseconds since the Unix epoch, UTC
  optional bool has_planned_at = 6; // Hale: whether `planned_at` is present
  optional int64 planned_at = 7; // Hale: Time, nanoseconds since the Unix epoch, UTC; optional, present when `has_planned_at`
  optional bool fleet_changed = 8;
}

// `ArrangementApplied`: each step and what it came to, what to do next,
// and, when the plan had drifted, the fresh plan.
message ArrangementApplied {
  // How applying a plan came out: all done; stopped at a step that failed;
  // or not begun, the plan no longer what the fleet would get.
  optional ApplyOutcome outcome = 1;
  repeated ApplyStep steps = 2; // Hale: at most 160
  optional string advice = 3;
  optional bool has_plan = 4; // Hale: whether `plan` is present
  ArrangementPlan plan = 5; // Hale: optional, present when `has_plan`
}

// `ArrangementApply`: a plan to carry out, the wants it was made for, the
// account the seats it adds spend, and the project whose aliases it
// points.
message ArrangementApply {
  ArrangementWants wants = 1;
  ArrangementPlan plan = 2;
  optional string account = 3;
  optional string project = 4;
}

message ArrangementList {
  repeated Arrangement data = 1; // Hale: at most 64
}

// `ArrangementPin`: a model on `count` nodes, the ones named or any; two
// are a pair cabled to each other, the model split across them.
message ArrangementPin {
  optional string model = 1;
  optional int64 count = 2;
  repeated string nodes = 3; // Hale: at most 2
}

// `ArrangementPlan`.
message ArrangementPlan {
  repeated PlanKeep keep = 1; // Hale: at most 64
  repeated PlanRemove remove = 2; // Hale: at most 64
  repeated PlanAdd add = 3; // Hale: at most 32
  repeated PlanAlias aliases = 4; // Hale: at most 16
  repeated PlanDownload downloads = 5; // Hale: at most 16
  repeated string down = 6; // Hale: at most 64
  repeated PlanUnmet unmet = 7; // Hale: at most 32
}

// `ArrangementPut`: wants kept as arrangement `arrangement`.
message ArrangementPut {
  optional string arrangement = 1;
  optional string name = 2;
  ArrangementWants wants = 3;
}

message ArrangementRef {
  optional string arrangement = 1;
}

// A role an arrangement may ask voice to fill (`ArrangementRole`): its
