  optional string key = 3;
  ServedBy served = 4;
  optional int64 price_micros = 5;
  optional string currency = 6;
  optional int64 wall_ms = 7;
  repeated Attempt attempts = 8; // Hale: at most 8
}

// A row with no request, or no response.
message HaleEmpty {}

// A refusal, and the server error (kind "server"): the detail of its status.
// `requires` is the roles of an unauthorized refusal, `served` the digest of a digest_mismatch one.
message HaleRefusal {
  string kind = 1;
  string reason = 2;
  repeated string requires = 3;
  string served = 4;
}
