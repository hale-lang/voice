# The organization's nerves for scripts/e2e.sh: a JetStream server with the
# owner, who makes the stream, and the attached application's user, which
# publishes on its own subjects alone (as hale's dna/nats.conf writes it,
# spec/dna.md "The application's account").
jetstream { store_dir: "/tmp/js" }
accounts {
  ORG: {
    jetstream: enabled
    users: [
      { user: owner, password: ownerpw }
      { user: app-voice, password: apppw, permissions: { publish: ["*.app.voice.>"], subscribe: ["_INBOX.>"] } }
    ]
  }
}
