name: Install hale
description: Installs a released hale toolchain (checksum-verified) and what it needs to build native programs.
inputs:
  version:
    description: The hale release tag.
    required: false
    default: v0.27.0
runs:
  using: composite
  steps:
    - name: Native build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang-18 lld-18 libc6-dev libssl-dev \
          libffi8 libtinfo6 libzstd1 zlib1g-dev libstdc++6
        sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
    - name: Cache the toolchain
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.hale/bin
        key: hale-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - name: Download and verify
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        case "${{ runner.arch }}" in
          X64) arch=x86_64 ;;
          ARM64) arch=aarch64 ;;
          *) echo "unsupported runner architecture: ${{ runner.arch }}" >&2; exit 1 ;;
        esac
        case "${{ runner.os }}" in
          Linux) triple="$arch-unknown-linux-gnu" ;;
          macOS)
            # only the Apple-silicon tarball is released
            [ "$arch" = aarch64 ] || { echo "macOS needs an arm64 runner" >&2; exit 1; }
            triple="aarch64-apple-darwin" ;;
          *) echo "unsupported runner OS: ${{ runner.os }}" >&2; exit 1 ;;
        esac
        name="hale-${{ inputs.version }}-$triple.tar.gz"
        base="https://github.com/hale-lang/hale/releases/download/${{ inputs.version }}"
        mkdir -p ~/.hale/bin
        cd "$(mktemp -d)"
        curl -fsSLO "$base/$name"
        curl -fsSLO "$base/$name.sha256"
        # macOS has shasum, not sha256sum; both read the same .sha256 file
        if command -v sha256sum >/dev/null; then sha256sum -c "$name.sha256"; else shasum -a 256 -c "$name.sha256"; fi
        tar xzf "$name" -C ~/.hale/bin ./hale ./libhale_ts_shim.a
    - name: On PATH
      shell: bash
      run: |
        echo "$HOME/.hale/bin" >> "$GITHUB_PATH"
        ~/.hale/bin/hale --version
