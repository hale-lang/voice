asyncapi: 3.0.0
info:
  title: voice internal subjects
  version: '1'
  description: |
    Voice's own NATS subjects: what crosses between the brain and the api
    instances. Not part of the seam a node plugs into; that is
    `protocol.yaml`. Written from an api instance's side.

    The one subject in use today tells the api instances that the route table
    changed. The brain computes the table from the fleet's reported state
    (`store.md`, "The brain's read") every second and writes it to Postgres
    (`route_table`, `store.md`, "The route table"), then publishes the new
    version here: eight bytes, whatever the table's size, so it never meets
    NATS's `max_payload`. Only the newest version is ever told: one NATS
    cannot take now is replaced by the next, and the newest is told once
    NATS is back. An instance that sees a version newer than the table it
    holds reads the table from Postgres; `GET /admin/v1/routes` reads it
    there too. A lost notice costs a second, and a node accepts or refuses
    every request regardless of what the table said. Today's api instances
    read the table from Postgres on each request and do not subscribe.

    ## The work stream and the board: protocol 3

    Queue routing (`docs/design/queue-routing.md`; `protocol.yaml`,
    "Pulling: protocol 3") is not served yet; these are its parts on this
    side of the seam. The api publishes tickets into one JetStream stream
    over the work subjects, `WorkStream`, consumed by one durable pull
    consumer per queue, `WorkConsumer`, shared by every seat that consumes
    it. The brain alone creates them, idempotently each tick for every
    queue some seat is eligible for, and deletes a consumer no seat has
    been eligible for in an hour; nodes never create one. The brain also
    writes the board to Postgres each tick (`Board`; `store.md`, "The
    board"), from which the api chooses a partition and the brain plans
    each node's seats (`protocol.yaml`, `ConsumePlan`). The route table
    stays until the push path goes.

    The board carries each model's shape, each queue's reading (with its
    model's recent service time) and each seat's plan, and no provider
    account's headroom: the api reads that from `quota_window` (`store.md`)
    when it admits a request.

    When the brain finds the stream gone and creates it again, it
    publishes the new stream's incarnation on `voice.queues.reset`,
    outside the stream's subjects (`QueuesReset`). Each api instance, on
    an incarnation new to it, publishes again every copy of a ticket it
    holds that is not granted, under that copy's own `Nats-Msg-Id`, so
    the requests waiting when the stream was lost wait on in the new one.
  contact:
    url: https://github.com/hale-lang/voice

defaultContentType: application/json

servers:
  nats:
    host: nats:4222
    protocol: nats
    description: The private network's NATS, shared with the nodes.

channels:
  route:
    address: voice.route
    messages:
      routeNotice: { $ref: '#/components/messages/routeNotice' }
  queuesReset:
    address: voice.queues.reset
    description: The work stream was created again, from the brain.
    x-voice-protocol: 3
    messages:
      queuesReset: { $ref: '#/components/messages/queuesReset' }

operations:
  receiveRouteNotice:
    action: receive
    channel: { $ref: '#/channels/route' }
    summary: The route table's new version, from the brain.
  receiveQueuesReset:
    action: receive
    channel: { $ref: '#/channels/queuesReset' }
    summary: The work stream's new incarnation, from the brain; publish again every copy not granted.

components:
  messages:
    routeNotice:
      name: route_notice
      contentType: application/octet-stream
      payload: { $ref: '#/components/schemas/RouteNotice' }
    queuesReset:
      name: queues_reset
      x-voice-protocol: 3
      payload: { $ref: '#/components/schemas/QueuesReset' }

  schemas:
    RouteNotice:
      type: string
      format: binary
      description: |
        The route table in Postgres is at a version (`RouteTable.version`):
        the brain's `RouteWritten { version }` as the Hale bus encodes it,
        the version as eight bytes, a little-endian signed integer, and
        nothing else. A reader that is a Hale program declares the same
        topic (`topic RouteWritten { payload: Version; subject: "route"; }`,
        `brain/main.hl`) and binds it to a NATS connection under the same
        root.
      minLength: 8
      maxLength: 8

    RouteTable:
      type: object
      description: The route table as `route_table` holds it and `GET /admin/v1/routes` answers it.
      required: [version, at, models]
      properties:
        version:
          type: integer
          description: |
            Milliseconds of Postgres's clock when the table was written, and
            always above the version before it (the stored version plus one
            when the clock has not passed it), so it increases with every
            write across a takeover and a clock step. An instance ignores a
            table older than the one it holds.
        at: { type: string, format: date-time }
        models:
          type: array
          items: { $ref: '#/components/schemas/ModelRoutes' }

    ModelRoutes:
      type: object
      required: [model, seats, exhausted]
      properties:
        model:
          type: string
          description: A catalog model id.
        seats:
          type: array
          description: The seats that can serve it now, best first.
          items: { $ref: '#/components/schemas/SeatRoute' }
        exhausted:
          type: array
          description: Accounts that could serve it but have no headroom, and when they will again.
          items:
            type: object
            required: [account, until]
            properties:
              account: { type: string }
              until: { type: [string, 'null'], format: date-time }

    SeatRoute:
      type: object
      required: [seat, node, account, rank, free, data_classes]
      properties:
        seat:
          type: string
          description: '`<node>/<seat>`.'
        node: { type: string }
        account: { type: string }
        engine_model:
          type: [string, 'null']
          description: The seat's own name for the model, passed through in `serve`.
        rank:
          type: number
          description: Lower is better. Account headroom first, then seat load, with a little jitter so instances spread.
        free:
          type: integer
          minimum: 0
          description: |
            Slots the seat had free as of this table: its concurrency (a
            placement's seat's, what its runtime is started with) less what it
            has in flight; a node has no cap of its own. An instance decrements
            its copy when it sends `serve`; the node's answer is the truth.
        data_classes:
          type: array
          items: { type: string }

    # ---- protocol 3: the work stream and the board ------------------------

    QueuesReset:
      type: object
      x-voice-protocol: 3
      description: |
        The work stream was lost and the brain created it again, with its
        consumers. Published once, on `<root>.queues.reset`. Core NATS
        delivers it at most once: an instance that misses it publishes
        nothing again, and its waiting requests wait their wait out.
      required: [incarnation]
      properties:
        incarnation:
          type: integer
          minimum: 0
          description: |
            The new stream's creation time, in milliseconds since the Unix
            epoch, as JetStream's stream info gives it. An api instance
            remembers the last it saw, and on another (or the first, when
            it has seen none) publishes again every copy of a ticket it
            holds that is not granted, each under its own `Nats-Msg-Id`.

    WorkStream:
      type: object
      x-voice-protocol: 3
      description: |
        The work stream's configuration, as JetStream's `STREAM.CREATE`
        takes it (durations in nanoseconds); what it does not set is the
        server's default. A ticket carries no content, so it is under 1 KiB
        and the stream never holds a body.
      required: [name, subjects, retention, storage, max_age, max_msgs_per_subject, discard, discard_new_per_subject, duplicate_window, allow_msg_ttl]
      properties:
        name:
          type: string
          pattern: '^VOICE_WORK(_[0-9a-f]{12})?$'
          description: |
            `VOICE_WORK` under voice's own NATS, the default root `voice`.
            Under a habitat's broker, any other root (`heart.<id>`),
            `VOICE_WORK_` and the first 12 lower-case hex digits of the
            sha256 of the root, so two hearts on one broker do not collide;
            a stream's name cannot carry the root's dots.
        subjects:
          type: array
          description: '`<root>.work.>`: every work subject, under the root.'
          items: { type: string }
          minItems: 1
          maxItems: 1
        retention:
          type: string
          const: workqueue
          description: A ticket goes when a consumer acks it.
        storage:
          type: string
          const: file
          description: Tickets survive a NATS restart.
        max_age:
          type: integer
          const: 600000000000
          description: |
            10 minutes, the longest a request waits for a seat whatever its
            deadline: no ticket outlives any request's wait.
        max_msgs_per_subject:
          type: integer
          const: 1024
          description: |
            A queue's backlog is bounded: past it the publish is refused and
            the caller answered `429 no_capacity` at once.
        discard:
          type: string
          const: new
          description: A full queue refuses the newcomer, not the oldest waiter.
        discard_new_per_subject:
          type: boolean
          const: true
          description: |
            The discard is per queue: a queue at `max_msgs_per_subject`
            refuses its newcomer (err_code 10077) while the others take
            theirs. Without it the per-subject limit drops the queue's
            oldest ticket instead.
        duplicate_window:
          type: integer
          const: 120000000000
          description: |
            2 minutes. A copy of a ticket published again (a lost ack, a
            reconnect) is kept once, by its `Nats-Msg-Id`
            (`<request_id>.<attempt>.<copy>`); the window is the stream's,
            whatever the subject.
        allow_msg_ttl:
          type: boolean
          const: true
          description: |
            Each ticket's `Nats-TTL` is its own wait, so an expired one
            leaves the depth the brain reads (NATS 2.11).

    WorkConsumer:
      type: object
      x-voice-protocol: 3
      description: |
        One queue's consumer, as JetStream's `CONSUMER.CREATE` takes it
        (durations in nanoseconds): durable, pulled, filtered on the
        queue's exact subject, since a work-queue stream refuses consumers
        whose filters overlap. Moving a seat between queues starts or stops
        its pulls and never changes a consumer.
      required: [durable_name, filter_subject, ack_policy, ack_wait, max_deliver, max_ack_pending, deliver_policy]
      properties:
        durable_name:
          type: string
          pattern: '^w_[0-9a-f]{16}$'
          description: '`w_` and the first 16 lower-case hex digits of the sha256 of `filter_subject`, the whole subject, root included.'
        filter_subject:
          type: string
          description: The queue's subject, whole, under the root.
        ack_policy:
          type: string
          const: explicit
        ack_wait:
          type: integer
          const: 10000000000
          description: |
            10 s: pull, claim and ack, milliseconds on the private network,
            with room for a claim's 2 s and one retry. A ticket pulled and
            not acked within it goes to another puller.
        max_deliver:
          type: integer
          const: -1
          description: Unlimited (the server's default); the ticket's TTL bounds its life, and claims make repeats harmless.
        max_ack_pending:
          type: integer
          const: 1024
        deliver_policy:
          type: string
          const: all

    Board:
      type: object
      x-voice-protocol: 3
      description: |
        The brain's board as `board` holds it (`store.md`, "The board"),
        written each tick in the same transaction as node liveness: each
        model's shape, each queue's reading and each seat's plan. The api
        reads it to choose a partition; the brain's `ConsumePlan` for each
        node is its seats' plans.
      required: [version, at, models, queues, seats]
      properties:
        version:
          type: integer
          description: |
            Milliseconds of Postgres's clock when the board was written, and
            always above the version before it (the stored version plus one
            when the clock has not passed it), as the route table's.
        at: { type: string, format: date-time }
        models:
          type: array
          items: { $ref: '#/components/schemas/BoardModel' }
        queues:
          type: array
          items: { $ref: '#/components/schemas/QueueReading' }
        seats:
          type: array
          items: { $ref: '#/components/schemas/BoardSeat' }

    BoardModel:
      type: object
      x-voice-protocol: 3
      required: [model, shape]
      properties:
        model:
          type: string
          description: A catalog model id.
        shape:
          type: string
          enum: [m, p]
          description: |
            `m` when the enabled seats that serve it in configuration run
            under one provider account, `p` when under more than one. The
            api publishes in the shape the board says.

    QueueReading:
      type: object
      x-voice-protocol: 3
      description: One queue, as its consumer read at the brain's tick.
      required: [subject, shape, model, provider_account, data_class, need, depth, oldest_age_ms, waiting_pulls, ack_pending, service_ms, seats]
      properties:
        subject:
          type: string
          description: The queue's subject, whole, under the root.
        shape:
          type: string
          enum: [m, p, s]
          description: A partition's shape, or `s` for a seat's own queue.
        model:
          type: [string, 'null']
          description: The partition's model; null for a seat's own queue.
        provider_account:
          type: [string, 'null']
          description: The partition's provider account (today's `account`), in the `p` shape; null otherwise.
        data_class:
          type: [string, 'null']
          description: The partition's data class; null for a seat's own queue.
        need:
          type: [string, 'null']
          enum: [tools, any, null]
          description: The partition's need; null for a seat's own queue.
        depth:
          type: integer
          minimum: 0
          description: Tickets waiting in it, its consumer's pending.
        oldest_age_ms:
          type: [integer, 'null']
          minimum: 0
          description: How long its oldest ticket has waited; null when it is empty.
        waiting_pulls:
          type: integer
          minimum: 0
          description: Pulls standing on it, from seats with a free slot and nothing to take.
        ack_pending:
          type: integer
          minimum: 0
          description: Tickets pulled and not yet acked.
        service_ms:
          type: [integer, 'null']
          minimum: 0
          description: |
            Recent service time of its model, from the ledger's last minute;
            null with none. With `depth` over its consuming seats' free
            slots, the expected wait.
        seats:
          type: array
          description: The seats consuming it, `<node>/<seat>`.
          items: { type: string }

    BoardSeat:
      type: object
      x-voice-protocol: 3
      required: [seat, hold, consume, concurrency, in_flight, conversations_held]
      properties:
        seat:
          type: string
          description: '`<node>/<seat>`.'
        hold:
          type: [string, 'null']
          description: Why it is held, pulling nothing; null when it consumes.
        consume:
          type: array
          description: The queues' subjects it consumes, in order; empty when held.
          items: { type: string }
        concurrency:
          type: integer
          minimum: 1
        in_flight:
          type: integer
          minimum: 0
        conversations_held:
          type: integer
          minimum: 0
          description: How many conversations its runtime keeps the prompts of; 0 for a hosted upstream.
