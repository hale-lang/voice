# voice's own NATS as the habitat's broker hands it to a grafted heart
# (lib/broker): the heart's account may use `heart.zz.>` and nothing else,
# no `_INBOX.>` and no JetStream; the nodes' account, which registration
# hands a node, may subscribe on its node subjects and publish replies and
# acks, and nothing else.
port: 4222
# a caller's request body is at most 12 MiB, wrapped for a node in one message
max_payload: 16MB
authorization {
  users: [
    { user: heart-zz, password: brokerpw, permissions: { publish: "heart.zz.>", subscribe: "heart.zz.>" } }
    { user: heart-zz-node, password: nodepw, permissions: { publish: ["heart.zz.reply.>", "heart.zz._INBOX.>"], subscribe: "heart.zz.node.>" } }
  ]
}
