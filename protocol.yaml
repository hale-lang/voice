asyncapi: 3.0.0
info:
  title: voice node protocol
  version: '1'
  description: |
    How a node and the coordinator talk: the node enrolls and declares what it
    can run, the coordinator assigns it seats, the node reports how they are
    doing, and it serves the requests routed to them. This is the seam a node
    implementation plugs into: a node that speaks this protocol can join
    voice, whatever it is written in. `openapi.yaml` is the coordinator's API
    and `node.yaml` the local API of voice's own node. This document is
    written from the node's side: the node sends what it `send`s and receives
    what it `receive`s.

    Inside the connection the requests and their events are Open Responses
    (`2026-04-24`), taken by reference from the vendored standard. The
    standard has a WebSocket mode of its own, one turn at a time from
    client to server; this protocol runs the other way and carries many
    requests at once, so it wraps the standard's request body and streaming
    events in an envelope keyed by `request_id`.

    The standard's shapes are OpenAPI 3.1 schemas, which AsyncAPI's schema
    formats cannot hold. Where a field carries one, `x-voice-schema` points
    at it in the vendored document, and both sides validate against that.

    ## Who decides what

    - **The node decides what is possible.** Its operator lists, on the
      machine, the engines it offers (each engine with the login it uses) and
      its hard limits. The node declares these as its `capabilities`. The
      logins themselves never leave the machine.
    - **The coordinator decides what runs.** It holds the desired seats for
      every node, configured through its admin API, and sends them to the
      node as an `assignment`. The node runs exactly the assigned seats and
      refuses any seat outside its capabilities.
    - **Local controls only restrict.** The node's operator may pause the
      node, pause a seat, or lower the node's in-flight cap on the machine.
      Nothing local can widen what the coordinator assigned.

    A node's effective in-flight cap is the smallest of its declared
    `max_in_flight`, the cap the coordinator sets, and any local cap. Each
    seat is further held to its own `concurrency`.

    ## Connection

    - The node opens a WebSocket to `/node/v1/connect` on the coordinator:
      `wss`, or `ws` only to a loopback address.
    - The upgrade request carries `Authorization: Bearer <enrollment token>`,
      the token issued when the node was created (`POST /admin/v1/nodes`).
      It is presented on every connection. A missing, unknown or revoked
      token is refused with `401` or `403` before the upgrade.
    - A node has at most one live connection. A newer authenticated
      connection replaces an older one, which the coordinator closes with
      code `4009`.
    - Every message is one text frame holding one JSON object with a `type`.
      A receiver ignores message types and fields it does not know, so either
      side can add them without a new protocol version. Both sides accept
      messages up to 16 MiB.
    - When the connection drops, the node reconnects with backoff: 1 s,
      doubling to 60 s, with jitter. It keeps trying at 60 s after a refusal.

    ## Session

    1. The node sends `hello`: its id, version, capabilities and local
       controls. It sends nothing else until it is answered.
    2. The coordinator answers `welcome`, carrying the node's current
       assignment, or `refused` and closes.
    3. The node applies the assignment (starting, reconfiguring and stopping
       seats to match it) and sends `seat_status` with every assigned seat's
       state, including the seats it refused and why.
    4. From then on:
       - The coordinator sends `assign` with the whole desired state whenever
         it changes. Each assignment carries a `version`; the node applies
         the newest and reports `seat_status` for that version.
       - The node sends `seat_status` whenever a seat's state changes, and
         `heartbeat` every interval with every seat's state and load. The
         coordinator marks a node `down` after three intervals with nothing
         received, and fails its in-flight requests as seat failures.
       - The node sends `capabilities` when its operator changes what it
         offers, and `local` when a local control changes. The coordinator
         re-checks the assignment against them.
       - The node sends `quota` when an engine reports the provider's
         windows for an account. The static engine never does.
       - The node sends `draining` before a deliberate shutdown. The
         coordinator sends it no new requests, and the node closes once every
         in-flight request has its `result`.

    An assignment reaching a node that was offline is simply the one in its
    `welcome`: configuration made while a node is away takes effect when it
    returns.

    ## Serving

    - The coordinator sends `serve` for a seat that is `up`. It never sends a
      seat more requests than its `concurrency`, or the node more than its
      effective cap; it queues the rest itself, so a node never queues.
    - The node answers with `event` messages, the standard's streaming events
      in order, and ends every request with exactly one `result`. It uses the
      `request_id` as the response's `id`. Events for different requests
      interleave; events for one request never reorder.
    - Usage is the standard's `usage` on the terminal event's response, where
      `input_tokens` includes cached input. What the standard does not carry
      travels in `result`: the model as the engine reported it, cache writes,
      timing, and quota windows.
    - A node that cannot start a request (unknown, paused or refused seat,
      seat or node full, engine down) sends a `result` with outcome
      `failed`, `retryable` true, and no events.
    - The coordinator sends `cancel` when the caller goes away or the
      deadline passes. The node stops the engine and sends its `result`,
      with outcome `cancelled` unless the request finished first.
    - When the connection drops, the node abandons its in-flight requests.
      The coordinator treats each as a seat failure: retried elsewhere if
      nothing had reached the caller, failed otherwise.
    - The coordinator retries a failed request on another seat only when
      `retryable` is true and no output has reached the caller. A
      `quota_exhausted` failure also marks the account exhausted until the
      reset in the result's quota windows.

    ## Close codes

    `4009` replaced by a newer connection; `4003` node revoked, or its token
    rotated; `4400` protocol version unsupported, after a `refused`.
  contact:
    url: https://github.com/hale-lang/voice

defaultContentType: application/json

servers:
  coordinator:
    host: voice.example.invalid
    protocol: wss
    description: Placeholder; the coordinator's address is part of the node's boot configuration.
    security:
      - $ref: '#/components/securitySchemes/enrollmentToken'

channels:
  connection:
    address: /node/v1/connect
    description: The one connection between a node and the coordinator.
    messages:
      hello: { $ref: '#/components/messages/hello' }
      welcome: { $ref: '#/components/messages/welcome' }
      refused: { $ref: '#/components/messages/refused' }
      assign: { $ref: '#/components/messages/assign' }
      seatStatus: { $ref: '#/components/messages/seatStatus' }
      heartbeat: { $ref: '#/components/messages/heartbeat' }
      capabilities: { $ref: '#/components/messages/capabilities' }
      local: { $ref: '#/components/messages/local' }
      quota: { $ref: '#/components/messages/quota' }
      draining: { $ref: '#/components/messages/draining' }
      serve: { $ref: '#/components/messages/serve' }
      event: { $ref: '#/components/messages/event' }
      result: { $ref: '#/components/messages/result' }
      cancel: { $ref: '#/components/messages/cancel' }

operations:
  nodeSends:
    action: send
    channel: { $ref: '#/channels/connection' }
    summary: What the node sends to the coordinator.
    messages:
      - $ref: '#/channels/connection/messages/hello'
      - $ref: '#/channels/connection/messages/seatStatus'
      - $ref: '#/channels/connection/messages/heartbeat'
      - $ref: '#/channels/connection/messages/capabilities'
      - $ref: '#/channels/connection/messages/local'
      - $ref: '#/channels/connection/messages/quota'
      - $ref: '#/channels/connection/messages/draining'
      - $ref: '#/channels/connection/messages/event'
      - $ref: '#/channels/connection/messages/result'
  nodeReceives:
    action: receive
    channel: { $ref: '#/channels/connection' }
    summary: What the coordinator sends to the node.
    messages:
      - $ref: '#/channels/connection/messages/welcome'
      - $ref: '#/channels/connection/messages/refused'
      - $ref: '#/channels/connection/messages/assign'
      - $ref: '#/channels/connection/messages/serve'
      - $ref: '#/channels/connection/messages/cancel'

components:
  securitySchemes:
    enrollmentToken:
      type: http
      scheme: bearer
      description: The node's enrollment token, on the WebSocket upgrade request.

  messages:
    hello:
      name: hello
      summary: The node introduces itself, with what it can run and its local controls.
      payload: { $ref: '#/components/schemas/Hello' }
    welcome:
      name: welcome
      summary: The coordinator admits the node and gives it its assignment.
      payload: { $ref: '#/components/schemas/Welcome' }
    refused:
      name: refused
      summary: The coordinator will not admit the node; it closes next.
      payload: { $ref: '#/components/schemas/Refused' }
    assign:
      name: assign
      summary: The node's whole desired state, after any change.
      payload: { $ref: '#/components/schemas/Assign' }
    seatStatus:
      name: seat_status
      summary: Each assigned seat's state on the node.
      payload: { $ref: '#/components/schemas/SeatStatusMessage' }
    heartbeat:
      name: heartbeat
      summary: The node's seats' state and load, every interval.
      payload: { $ref: '#/components/schemas/Heartbeat' }
    capabilities:
      name: capabilities
      summary: What the node offers, after its operator changed it.
      payload: { $ref: '#/components/schemas/CapabilitiesMessage' }
    local:
      name: local
      summary: The node's local controls, after they changed.
      payload: { $ref: '#/components/schemas/LocalMessage' }
    quota:
      name: quota
      summary: Provider windows an engine reported for an account.
      payload: { $ref: '#/components/schemas/Quota' }
    draining:
      name: draining
      summary: The node takes no new requests and closes once in-flight ones finish.
      payload: { $ref: '#/components/schemas/Draining' }
    serve:
      name: serve
      summary: Serve one request on one seat.
      payload: { $ref: '#/components/schemas/Serve' }
    event:
      name: event
      summary: One standard streaming event for a request.
      payload: { $ref: '#/components/schemas/Event' }
    result:
      name: result
      summary: How a request ended. Exactly one per request, always last.
      payload: { $ref: '#/components/schemas/Result' }
    cancel:
      name: cancel
      summary: Stop serving a request.
      payload: { $ref: '#/components/schemas/Cancel' }

  schemas:
    RequestId:
      type: string
      description: The coordinator's request id; the usage record's id and the response's `id`.

    Slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,62}$'

    # ---- what a node offers ------------------------------------------------

    Capabilities:
      type: object
      description: |
        What the node can run, as its operator configured it on the machine.
        The coordinator assigns seats only within it, and the node refuses
        any seat outside it.
      required: [engines, max_in_flight]
      properties:
        engines:
          type: array
          items: { $ref: '#/components/schemas/Engine' }
        max_in_flight:
          type: integer
          minimum: 1
          description: The most requests the node will serve at once, across all its seats.

    Engine:
      type: object
      description: |
        One engine the node offers: a kind of engine with the login it runs
        under. Two logins for one CLI are two engines. How the login is held
        is local to the node and is never declared.
      required: [id, kind, config_schema]
      properties:
        id:
          $ref: '#/components/schemas/Slug'
          description: Unique on the node; seats name it.
          examples: [static, claude-work, claude-personal]
        kind:
          type: string
          description: What runs, e.g. `static`, `claude-cli`, `codex-cli`, `agy`.
          examples: [static, claude-cli]
        description: { type: string }
        models:
          type: [array, 'null']
          description: The engine's own names for the models it can run, when it knows them. Null when any name may be tried.
          items: { type: string }
        config_schema:
          type: object
          description: |
            JSON Schema of the `config` a seat on this engine takes. The
            coordinator checks seats against it, and a UI renders it as a
            form. The static engine's is `StaticConfig`.

    StaticConfig:
      type: object
      description: |
        The static engine's seat config. It answers every request with
        `text`. Tokens are counted as one per four characters, rounded up, of
        the input and of `text`.
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        chunk_chars:
          type: integer
          minimum: 1
          default: 16
          description: Characters per streamed delta.
        first_output_ms:
          type: integer
          minimum: 0
          default: 0
          description: Delay before the first output, to exercise timing and deadlines.
        chunk_interval_ms:
          type: integer
          minimum: 0
          default: 0

    LocalControls:
      type: object
      description: |
        What the node's operator set on the machine. Each field only
        restricts: a paused node or seat takes no new requests, and a local
        cap only lowers the effective one.
      required: [paused, paused_seats]
      properties:
        paused: { type: boolean }
        paused_seats:
          type: array
          items: { type: string }
        max_in_flight:
          type: [integer, 'null']
          minimum: 0
          description: A local cap on requests in flight, or null for none.
        reason:
          type: [string, 'null']
          description: Why, for the admin to read.

    # ---- what the coordinator assigns --------------------------------------

    Seat:
      type: object
      description: |
        One seat as the coordinator assigns it: an engine the node offers,
        spending one account, serving some catalog models.
      required: [id, engine, account, serves]
      properties:
        id:
          $ref: '#/components/schemas/Slug'
          description: Unique on the node. Its full name is `<node>/<seat>`.
        engine:
          type: string
          description: The id of one of the node's declared engines.
        account:
          type: string
          description: The coordinator account this seat spends. Several seats, on one node or many, may name the same account and share its limits.
        serves:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SeatModel' }
        data_classes:
          type: array
          description: Data classes this seat may carry. Defaults to `[internal]`.
          items: { type: string }
        concurrency:
          type: integer
          minimum: 1
          default: 1
          description: Requests this seat serves at once.
        enabled:
          type: boolean
          default: true
        config:
          type: object
          description: Engine-specific, valid against the engine's `config_schema`.

    SeatModel:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: A catalog model id.
        as:
          type: [string, 'null']
          description: The engine's own name for it, when that differs, e.g. `sonnet` for `claude-sonnet-5`.

    Assignment:
      type: object
      description: Everything the coordinator wants the node to run. The whole state each time, never a diff.
      required: [version, max_in_flight, seats]
      properties:
        version:
          type: integer
          description: Increases with every change. The node applies the newest it has.
        max_in_flight:
          type: integer
          minimum: 1
          description: The coordinator's cap for this node, at most the node's declared `max_in_flight`.
        seats:
          type: array
          description: A seat the node is running and this list leaves out is stopped once its in-flight requests finish.
          items: { $ref: '#/components/schemas/Seat' }

    SeatState:
      type: object
      description: One assigned seat's state on the node.
      required: [id, status, in_flight]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [starting, up, down, disabled, paused, refused]
          description: |
            `down`: the engine cannot serve, e.g. its CLI is missing or logged
            out. `paused`: a local control holds it. `refused`: the seat is
            outside the node's capabilities, e.g. an engine it does not offer
            or a config its engine rejects; `reason` says which.
        reason: { type: [string, 'null'] }
        in_flight: { type: integer, minimum: 0 }

    # ---- messages ----------------------------------------------------------

    Hello:
      type: object
      required: [type, protocol, node, version, capabilities, local]
      properties:
        type: { type: string, const: hello }
        protocol:
          type: integer
          const: 1
          description: This document's version.
        node:
          type: string
          description: The node's id. Must be the id the token was issued for, or the node is refused with `node_mismatch`.
        version:
          type: string
          description: The node software's version.
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        local: { $ref: '#/components/schemas/LocalControls' }

    Welcome:
      type: object
      required: [type, protocol, heartbeat_interval_ms, assignment]
      properties:
        type: { type: string, const: welcome }
        protocol: { type: integer, const: 1 }
        heartbeat_interval_ms: { type: integer, minimum: 1000 }
        assignment: { $ref: '#/components/schemas/Assignment' }

    Refused:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, const: refused }
        code:
          type: string
          enum: [protocol_unsupported, node_mismatch]
        message: { type: string }
        protocol:
          type: array
          description: The protocol versions the coordinator speaks, for `protocol_unsupported`.
          items: { type: integer }

    Assign:
      type: object
      required: [type, assignment]
      properties:
        type: { type: string, const: assign }
        assignment: { $ref: '#/components/schemas/Assignment' }

    SeatStatusMessage:
      type: object
      required: [type, assignment_version, seats]
      properties:
        type: { type: string, const: seat_status }
        assignment_version:
          type: integer
          description: The assignment these states answer.
        seats:
          type: array
          items: { $ref: '#/components/schemas/SeatState' }

    Heartbeat:
      type: object
      required: [type, in_flight, seats]
      properties:
        type: { type: string, const: heartbeat }
        in_flight:
          type: integer
          minimum: 0
          description: Requests in flight across the node.
        seats:
          type: array
          items: { $ref: '#/components/schemas/SeatState' }

    CapabilitiesMessage:
      type: object
      required: [type, capabilities]
      properties:
        type: { type: string, const: capabilities }
        capabilities: { $ref: '#/components/schemas/Capabilities' }

    LocalMessage:
      type: object
      required: [type, local]
      properties:
        type: { type: string, const: local }
        local: { $ref: '#/components/schemas/LocalControls' }

    Quota:
      type: object
      required: [type, seat, windows]
      properties:
        type: { type: string, const: quota }
        seat: { type: string }
        windows:
          type: array
          items: { $ref: './openapi.yaml#/components/schemas/QuotaWindow' }

    Draining:
      type: object
      required: [type]
      properties:
        type: { type: string, const: draining }
        reason: { type: string }

    Serve:
      type: object
      required: [type, request_id, seat, model, body]
      properties:
        type: { type: string, const: serve }
        request_id: { $ref: '#/components/schemas/RequestId' }
        seat:
          type: string
          description: The seat's id on this node.
        model:
          type: string
          description: The catalog model id the caller named.
        engine_model:
          type: [string, 'null']
          description: The seat's own name for the model (`as`), when it has one.
        deadline:
          type: [string, 'null']
          format: date-time
        body:
          description: |
            The standard request, as the coordinator will serve it: Chat
            Completions requests arrive converted, and `voice`, `stream`,
            `stream_options` and `background` are removed. It is always
            streamed on this connection.
          type: object
          x-voice-schema: './spec/vendor/open-responses/openapi.json#/components/schemas/CreateResponseBody'

    Event:
      type: object
      required: [type, request_id, event]
      properties:
        type: { type: string, const: event }
        request_id: { $ref: '#/components/schemas/RequestId' }
        event:
          description: Any standard streaming event.
          type: object
          required: [type]
          x-voice-schema: './spec/vendor/open-responses/openapi.json#/paths/~1responses/post/responses/200/content/text~1event-stream/schema'

    Result:
      type: object
      required: [type, request_id, outcome]
      properties:
        type: { type: string, const: result }
        request_id: { $ref: '#/components/schemas/RequestId' }
        outcome:
          type: string
          enum: [served, incomplete, failed, cancelled]
        served:
          type: object
          description: What actually ran. Absent when nothing started.
          required: [model]
          properties:
            model:
              type: string
              description: The model as the engine reported it.
            quantization: { type: [string, 'null'] }
            provider: { type: [string, 'null'] }
        usage:
          type: object
          description: What the standard's `usage` does not carry.
          properties:
            cache_write_input_tokens:
              type: integer
              description: Input tokens written to the provider's cache, already counted in `input_tokens`.
        timing:
          type: object
          properties:
            first_output_ms:
              type: integer
              description: From `serve` received to the first output event.
            engine_ms:
              type: integer
              description: From `serve` received to the result.
        quota:
          type: array
          description: The account's provider windows as of this request, when the engine reports them.
          items: { $ref: './openapi.yaml#/components/schemas/QuotaWindow' }
        error:
          type: object
          description: Why, for `failed`.
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum: [seat_unavailable, engine_failed, engine_timeout, quota_exhausted, invalid_request]
            message: { type: string }
            retryable:
              type: boolean
              description: True when another seat could serve it. `invalid_request` never is.

    Cancel:
      type: object
      required: [type, request_id, reason]
      properties:
        type: { type: string, const: cancel }
        request_id: { $ref: '#/components/schemas/RequestId' }
        reason:
          type: string
          enum: [caller_gone, deadline, node_revoked]
